name: Analyze cached Tencent Android APK ACE libs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/analyze-cached-tencent-apks-20261024.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  extract:
    name: Verify and extract ${{ matrix.game }} security SO only
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        game: [pubg, naruto]
    steps:
      - uses: actions/checkout@v4
      - name: Recover cached APK only inside Actions and analyze native security libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/ace_extract_cached_game_apks.py --game "${{ matrix.game }}"
      - name: Upload static report and hash manifests
        uses: actions/upload-artifact@v4
        with:
          name: ace-analysis-${{ matrix.game }}-report
          path: out/${{ matrix.game }}/reports/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
      - name: Upload small ACE SO package 00
        uses: actions/upload-artifact@v4
        with:
          name: ace-libs-${{ matrix.game }}-part-00
          path: out/${{ matrix.game }}/packs/ace-libs-00.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload small ACE SO package 01
        uses: actions/upload-artifact@v4
        with:
          name: ace-libs-${{ matrix.game }}-part-01
          path: out/${{ matrix.game }}/packs/ace-libs-01.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
