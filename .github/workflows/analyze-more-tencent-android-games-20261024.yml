name: Analyze more Tencent Android ACE SO via HTTP Range
on:
  push:
    branches: [main]
    paths: [.github/workflows/analyze-more-tencent-android-games-20261024.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: Static security SO ${{ matrix.game }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [hok, peace, cf]
    steps:
      - uses: actions/checkout@v4
      - name: Remote ZIP read and selective ELF analysis
        run: |
          set -euo pipefail
          python3 .github/scripts/ace_range_from_tencent_apks.py --game "${{ matrix.game }}"
      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: ace-more-${{ matrix.game }}-report
          path: out/${{ matrix.game }}/reports/
          if-no-files-found: error
          retention-days: 1
      - name: Upload selected ACE libs part 00
        uses: actions/upload-artifact@v4
        with:
          name: ace-more-${{ matrix.game }}-libs-00
          path: out/${{ matrix.game }}/packs/ace-libs-00.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload selected ACE libs part 01
        uses: actions/upload-artifact@v4
        with:
          name: ace-more-${{ matrix.game }}-libs-01
          path: out/${{ matrix.game }}/packs/ace-libs-01.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload selected ACE libs part 02
        uses: actions/upload-artifact@v4
        with:
          name: ace-more-${{ matrix.game }}-libs-02
          path: out/${{ matrix.game }}/packs/ace-libs-02.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload selected ACE libs part 03
        uses: actions/upload-artifact@v4
        with:
          name: ace-more-${{ matrix.game }}-libs-03
          path: out/${{ matrix.game }}/packs/ace-libs-03.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload selected ACE libs part 04
        uses: actions/upload-artifact@v4
        with:
          name: ace-more-${{ matrix.game }}-libs-04
          path: out/${{ matrix.game }}/packs/ace-libs-04.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload selected ACE libs part 05
        uses: actions/upload-artifact@v4
        with:
          name: ace-more-${{ matrix.game }}-libs-05
          path: out/${{ matrix.game }}/packs/ace-libs-05.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload selected ACE libs part 06
        uses: actions/upload-artifact@v4
        with:
          name: ace-more-${{ matrix.game }}-libs-06
          path: out/${{ matrix.game }}/packs/ace-libs-06.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload selected ACE libs part 07
        uses: actions/upload-artifact@v4
        with:
          name: ace-more-${{ matrix.game }}-libs-07
          path: out/${{ matrix.game }}/packs/ace-libs-07.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
