name: Analyze six more Tencent Android ACE libraries
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/analyze-six-more-tencent-games-20261024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: Static Tencent ${{ matrix.game }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        game: [arena, cod, lolm, speed, jcc, codev]
    steps:
      - uses: actions/checkout@v4
      - name: Remote ZIP range read only focused ELF files
        run: |
          set -euo pipefail
          python3 .github/scripts/ace_range_more_six_20261024.py --game "${{ matrix.game }}"
      - name: Upload detailed textual evidence
        uses: actions/upload-artifact@v4
        with:
          name: ace-new-${{ matrix.game }}-report
          path: out/${{ matrix.game }}/reports/
          if-no-files-found: error
          retention-days: 1
      - name: Upload ACE library selection 00
        uses: actions/upload-artifact@v4
        with:
          name: ace-new-${{ matrix.game }}-libs-00
          path: out/${{ matrix.game }}/packs/ace-libs-00.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload ACE library selection 01
        uses: actions/upload-artifact@v4
        with:
          name: ace-new-${{ matrix.game }}-libs-01
          path: out/${{ matrix.game }}/packs/ace-libs-01.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload ACE library selection 02
        uses: actions/upload-artifact@v4
        with:
          name: ace-new-${{ matrix.game }}-libs-02
          path: out/${{ matrix.game }}/packs/ace-libs-02.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload ACE library selection 03
        uses: actions/upload-artifact@v4
        with:
          name: ace-new-${{ matrix.game }}-libs-03
          path: out/${{ matrix.game }}/packs/ace-libs-03.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload ACE library selection 04
        uses: actions/upload-artifact@v4
        with:
          name: ace-new-${{ matrix.game }}-libs-04
          path: out/${{ matrix.game }}/packs/ace-libs-04.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload ACE library selection 05
        uses: actions/upload-artifact@v4
        with:
          name: ace-new-${{ matrix.game }}-libs-05
          path: out/${{ matrix.game }}/packs/ace-libs-05.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload ACE library selection 06
        uses: actions/upload-artifact@v4
        with:
          name: ace-new-${{ matrix.game }}-libs-06
          path: out/${{ matrix.game }}/packs/ace-libs-06.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload ACE library selection 07
        uses: actions/upload-artifact@v4
        with:
          name: ace-new-${{ matrix.game }}-libs-07
          path: out/${{ matrix.game }}/packs/ace-libs-07.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
