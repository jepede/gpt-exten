name: Android ARM64 linker edgecase fixtures
on:
  push:
    branches: [work/aosp-linker-analysis-20261013]
    paths:
      - stress-tests/edgecases/**
      - .github/workflows/android-linker-edgecases.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stress-edgecases:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached NDK r28c
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads/ndk
          gh run download 31684150811 --repo "${{ github.repository }}" --name ndk-r28c-part-00 --dir downloads/ndk
          gh run download 31684150811 --repo "${{ github.repository }}" --name ndk-r28c-part-01 --dir downloads/ndk
          echo '6e87d3bb98c2bfcdb9a703affd174b85ef00fff69b9aa0056372f79046308fa1  downloads/ndk/ndk-r28c.part.00' | sha256sum -c -
          echo 'bf9baef30047e4a7e1040034619728cce0b291d76e4d67b44a0d5d0554c0197c  downloads/ndk/ndk-r28c.part.01' | sha256sum -c -
          cat downloads/ndk/ndk-r28c.part.00 downloads/ndk/ndk-r28c.part.01 > downloads/android-ndk-r28c-linux.zip
          echo 'dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f  downloads/android-ndk-r28c-linux.zip' | sha256sum -c -
          mkdir -p ndk
          unzip -q downloads/android-ndk-r28c-linux.zip -d ndk
          test -x ndk/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          rm -f downloads/android-ndk-r28c-linux.zip downloads/ndk/ndk-r28c.part.*
      - name: Restore Bionic and QEMU
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads/runtime downloads/qemu runtime qemu-root
          gh run download 38517156477 --repo "${{ github.repository }}" --name aosp-arm64-bionic-runtime --dir downloads/runtime
          gh run download 32748029497 --repo "${{ github.repository }}" --name qemu-user-static-7.2-deb12u18-amd64 --dir downloads/qemu
          find downloads/runtime downloads/qemu -maxdepth 2 -type f -printf '%p %s bytes\n'
          echo '0d0c5c925cbee0c461b42a6df104e9316b52ca822c73bdb42fcd4100eae9ee8e  downloads/runtime/aosp-arm64-bionic-runtime.tar.gz' | sha256sum -c -
          tar -xzf downloads/runtime/aosp-arm64-bionic-runtime.tar.gz -C runtime
          echo 'c3e3ba2bd87f8c5b9a5da5ef21b5a3b82d7c63b89dd448d9ddaa4eabc5b6e402  downloads/qemu/qemu-user-static_7.2+dfsg-7+deb12u18+b3_amd64.deb' | sha256sum -c -
          dpkg-deb -x downloads/qemu/qemu-user-static_7.2+dfsg-7+deb12u18+b3_amd64.deb qemu-root
          test -x qemu-root/usr/bin/qemu-aarch64-static
          test -e runtime/sysroot/system/bin/linker64
          qemu-root/usr/bin/qemu-aarch64-static --version | head -1
      - name: Validate public generator and packed regression driver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile stress-tests/edgecases/generate.py stress-tests/edgecases/packed_compare.py
          python3 stress-tests/edgecases/packed_compare.py --help >/dev/null
      - name: Build six targeted compatibility fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 stress-tests/edgecases/generate.py --ndk "$PWD/ndk/android-ndk-r28c" --out "$PWD/edgecases"
          readelf -Wd edgecases/needed72 | grep NEEDED | wc -l
          readelf -Wd edgecases/stripped_main | grep NEEDED || true
          readelf -lW edgecases/huge_tls | grep -A1 TLS || true
      - name: Run native Bionic baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,pathlib,subprocess,sys
          b=pathlib.Path("edgecases").resolve()
          root=pathlib.Path("runtime/sysroot").resolve()
          qemu=pathlib.Path("qemu-root/usr/bin/qemu-aarch64-static").resolve()
          env=os.environ.copy()
          env["ANDROID_ROOT"]="/system"
          env["ANDROID_DATA"]="/data"
          env["LD_LIBRARY_PATH"]=str(b)+":/system/lib64:/apex/com.android.runtime/lib64:/apex/com.android.runtime/lib64/bionic"
          cases=json.loads((b/"manifest.json").read_text())["cases"]
          results=[]
          for ps in (4096,16384):
              for name in cases:
                  cmd=[str(qemu)]
                  if ps==16384: cmd+=["-p","16384"]
                  cmd+=["-L",str(root),str(b/name)]
                  try:
                      r=subprocess.run(cmd,capture_output=True,text=True,errors="replace",env=env,timeout=45)
                      d={"case":name,"pagesize":ps,"rc":r.returncode,"stdout":r.stdout,"stderr":r.stderr}
                  except subprocess.TimeoutExpired:
                      d={"case":name,"pagesize":ps,"rc":124,"stdout":"","stderr":"TIMEOUT"}
                  results.append(d)
                  print(ps,name,d["rc"],repr(d["stdout"][:120]),repr(d["stderr"][:180]),flush=True)
          (b/"native_results.json").write_text(json.dumps(results,indent=2))
          ok=sum(r["rc"]==0 for r in results)
          print("NATIVE_EDGECASE_PASS",ok,"/",len(results),flush=True)
          if ok!=len(results):
              sys.exit(1)
          PY
      - name: Test packed comparison harness using copy-only canary (NOT real packing)
        shell: bash
        run: |
          set -euo pipefail
          cat > copy_only_packer.py <<'PY'
          #!/usr/bin/env python3
          import shutil,sys
          shutil.copy2(sys.argv[2],sys.argv[3])
          PY
          chmod +x copy_only_packer.py
          python3 stress-tests/edgecases/packed_compare.py \
            --fixtures-dir "$PWD/edgecases" \
            --packer "$PWD/copy_only_packer.py" \
            --shell "$PWD/edgecases/needed72" \
            --qemu "$PWD/qemu-root/usr/bin/qemu-aarch64-static" \
            --sysroot "$PWD/runtime/sysroot" \
            --out "$PWD/harness-canary" \
            --repeats 1 \
            --timeout 45
          test "$(python3 -c 'import json;print(json.load(open("harness-canary/edgecase-results.json"))["counts"]["packed"])')" -eq 12
          echo 'HARNESS_COPY_ONLY_CANARY=PASS (not a real packed regression)'
      - name: Archive edge fixture source and results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d edgecases; then
            cp stress-tests/edgecases/packed_compare.py edgecases/packed_compare.py
            cp stress-tests/edgecases/generate.py edgecases/generate.py
            if test -f harness-canary/edgecase-results.json; then cp harness-canary/edgecase-results.json edgecases/harness-copy-only-canary.json; fi
            tar -czf android-arm64-edgecases-20261015.tar.gz -C edgecases .
            sha256sum android-arm64-edgecases-20261015.tar.gz > EDGE_SHA256SUMS
            test "$(stat -c%s android-arm64-edgecases-20261015.tar.gz)" -lt 500000000
            ls -lh android-arm64-edgecases-20261015.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-linker-edgecases-20261015
          path: |
            android-arm64-edgecases-20261015.tar.gz
            EDGE_SHA256SUMS
          retention-days: 1
          if-no-files-found: warn
