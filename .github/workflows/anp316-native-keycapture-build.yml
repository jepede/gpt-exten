name: ANP316 native Android key capture build
on:
  push:
    branches: [work/anp316-keyquery-20261120]
    paths: [.github/workflows/anp316-native-keycapture-build.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Build with the preinstalled NDK and formatter
        shell: python
        run: |
          import os,pathlib,subprocess,json,hashlib,shutil,re
          out=pathlib.Path('native-keycapture');out.mkdir()
          capture="/* Sample-specific Android ARM64 hardware-breakpoint key capture.\n * Reads genuine x24/x25/x26 buffers. It never replaces a key or tag result.\n * Kernel ABI: Linux arm64 NT_ARM_HW_BREAK and NT_PRSTATUS regsets.\n */\n#define _GNU_SOURCE\n#include <elf.h>\n#include <errno.h>\n#include <fcntl.h>\n#include <inttypes.h>\n#include <signal.h>\n#include <stdbool.h>\n#include <stdint.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <sys/ptrace.h>\n#include <sys/stat.h>\n#include <sys/types.h>\n#include <sys/uio.h>\n#include <sys/wait.h>\n#include <time.h>\n#include <unistd.h>\n\n#ifndef NT_ARM_HW_BREAK\n#define NT_ARM_HW_BREAK 0x402\n#endif\n#ifndef NT_PRSTATUS\n#define NT_PRSTATUS 1\n#endif\n\nstruct arm64_regs { uint64_t x[31], sp, pc, pstate; };\nstruct hw_regs {\n    uint32_t info, padding;\n    struct { uint64_t address; uint32_t control, padding; } slot[16];\n};\nstatic volatile sig_atomic_t cancelled;\nstatic void stop_requested(int signal_number) { (void)signal_number; cancelled = 1; }\nstatic double seconds_now(void) {\n    struct timespec t; clock_gettime(CLOCK_MONOTONIC, &t);\n    return (double)t.tv_sec + (double)t.tv_nsec / 1e9;\n}\nstatic int wait_event(pid_t pid, int *status, double deadline) {\n    while (!cancelled && seconds_now() < deadline) {\n        pid_t got = waitpid(pid, status, WNOHANG);\n        if (got == pid) return 0;\n        if (got < 0 && errno != EINTR) return -1;\n        struct timespec pause = {0, 10000000}; nanosleep(&pause, NULL);\n    }\n    errno = ETIMEDOUT; return -1;\n}\nstatic int read_exact(int fd, void *buffer, size_t count) {\n    unsigned char *p = buffer;\n    while (count) {\n        ssize_t n = read(fd, p, count);\n        if (n < 0 && errno == EINTR) continue;\n        if (n <= 0) return -1;\n        p += n; count -= (size_t)n;\n    }\n    return 0;\n}\nstatic int elf_entry(const char *path, uint64_t *entry) {\n    int fd = open(path, O_RDONLY | O_CLOEXEC); Elf64_Ehdr h;\n    if (fd < 0) return -1;\n    int result = read_exact(fd, &h, sizeof(h)); close(fd);\n    if (result || memcmp(h.e_ident, ELFMAG, SELFMAG) ||\n        h.e_ident[EI_CLASS] != ELFCLASS64 || h.e_ident[EI_DATA] != ELFDATA2LSB ||\n        h.e_machine != EM_AARCH64 || h.e_type != ET_DYN) { errno = EINVAL; return -1; }\n    *entry = h.e_entry; return 0;\n}\n/* Use Android's installed SHA256 implementation; no bundled crypto substitute. */\nstatic int sample_hash_matches(const char *path) {\n    int pipefd[2]; if (pipe(pipefd)) return -1;\n    pid_t child = fork();\n    if (child == 0) {\n        close(pipefd[0]); dup2(pipefd[1], STDOUT_FILENO); close(pipefd[1]);\n        execl(\"/system/bin/toybox\", \"toybox\", \"sha256sum\", path, (char *)NULL);\n        _exit(127);\n    }\n    close(pipefd[1]);\n    if (child < 0) { close(pipefd[0]); return -1; }\n    char text[65] = {0}; int result = read_exact(pipefd[0], text, 64);\n    close(pipefd[0]); int status = 0; pid_t got;\n    do { got = waitpid(child, &status, 0); } while (got < 0 && errno == EINTR);\n    if (got != child || result || !WIFEXITED(status) || WEXITSTATUS(status)) return -1;\n    return strcmp(text, \"6bda4d582812e3a153cacda211ecfb5aec5981f1282ab447d4a68317b9c84b8f\") == 0 ||\n           strcmp(text, \"2d1a3e8288ba3e447b6361c6fe10858ce7d02a71bbc6d14d3768a0c47ca0ccd2\") == 0;\n}\nstatic int load_bias(pid_t pid, uint64_t entry, uint64_t *bias) {\n    char path[80]; snprintf(path, sizeof(path), \"/proc/%d/auxv\", pid);\n    int fd = open(path, O_RDONLY | O_CLOEXEC); if (fd < 0) return -1;\n    Elf64_auxv_t pair; int result = -1;\n    while (read_exact(fd, &pair, sizeof(pair)) == 0 && pair.a_type) {\n        if (pair.a_type == AT_ENTRY && pair.a_un.a_val >= entry) {\n            *bias = pair.a_un.a_val - entry; result = 0; break;\n        }\n    }\n    close(fd); return result;\n}\nstatic int key_bytes(pid_t pid, uint64_t address, unsigned char output[32]) {\n    address &= UINT64_C(0x00ffffffffffffff);\n    if (!address) { errno = EFAULT; return -1; }\n    for (size_t i = 0; i < 32; i += sizeof(long)) {\n        errno = 0; long value = ptrace(PTRACE_PEEKDATA, pid, (void *)(uintptr_t)(address + i), NULL);\n        if (value == -1 && errno) return -1;\n        memcpy(output + i, &value, sizeof(value));\n    }\n    return 0;\n}\nstatic void print_key(const char *label, const unsigned char key[32]) {\n    printf(\"%s=\", label); for (size_t i = 0; i < 32; i++) printf(\"%02x\", key[i]); putchar('\\n');\n}\nstatic int hw_set(pid_t pid, struct hw_regs *regs, size_t slots) {\n    struct iovec io = {regs, 8 + slots * 16};\n    return (int)ptrace(PTRACE_SETREGSET, pid, (void *)(uintptr_t)NT_ARM_HW_BREAK, &io);\n}\nint main(int argc, char **argv) {\n    bool spawned = false, stopped = false, saved_hw = false, diagnostic = false;\n    int command = 0, result = 2, status = 0, limit = 120; pid_t pid = -1;\n    uint64_t entry = 0, bias = 0, rvas[2] = {0xd917fc, 0xd92234}; size_t points = 2;\n    struct hw_regs original = {0}, active = {0}; char executable[4096] = {0};\n    for (int i = 1; i < argc; i++) {\n        if (!strcmp(argv[i], \"--seconds\") && i + 1 < argc) limit = atoi(argv[++i]);\n        else if (!strcmp(argv[i], \"--diagnostic-rva\") && i + 1 < argc) {\n            char *end; errno = 0; rvas[0] = strtoull(argv[++i], &end, 0);\n            if (errno || *end || !rvas[0] || (rvas[0] & 3)) return 64;\n            diagnostic = true; points = 1;\n        } else if (!strcmp(argv[i], \"--attach\") && i + 1 < argc) pid = (pid_t)atoi(argv[++i]);\n        else if (!strcmp(argv[i], \"--spawn\") && i + 1 < argc) { command = i + 1; spawned = true; break; }\n        else { fprintf(stderr, \"Unknown/incomplete option: %s\\n\", argv[i]); return 64; }\n    }\n    if (limit < 1 || limit > 3600 || (spawned && pid > 0) || (!spawned && pid <= 0)) {\n        fprintf(stderr, \"usage: %s [--seconds 120] --spawn ./316_hardened.so [args...]\\n       %s [--seconds 120] --attach PID\\n\", argv[0], argv[0]); return 64;\n    }\n    if (spawned) {\n        if (snprintf(executable, sizeof(executable), \"%s\", argv[command]) >= (int)sizeof(executable)) return 64;\n    } else snprintf(executable, sizeof(executable), \"/proc/%d/exe\", pid);\n    if (elf_entry(executable, &entry)) { perror(\"ELF identity\"); return 1; }\n    if (!diagnostic && (entry != 0xd91630 || sample_hash_matches(executable) != 1)) {\n        fprintf(stderr, \"Refusing target: the complete 316 sample SHA256 did not match.\\n\"); return 1;\n    }\n    if (diagnostic) puts(\"DIAGNOSTIC_FIXTURE_MODE: values are not business keys.\");\n    signal(SIGINT, stop_requested); signal(SIGTERM, stop_requested);\n    double deadline = seconds_now() + limit;\n    if (spawned) {\n        pid = fork();\n        if (pid == 0) {\n            if (ptrace(PTRACE_TRACEME, 0, NULL, NULL)) { perror(\"TRACEME\"); _exit(126); }\n            execv(argv[command], &argv[command]); perror(\"execv\"); _exit(127);\n        }\n        if (pid < 0) { perror(\"fork\"); return 1; }\n    } else if (ptrace(PTRACE_ATTACH, pid, NULL, NULL)) { perror(\"PTRACE_ATTACH\"); return 1; }\n    if (wait_event(pid, &status, deadline) || !WIFSTOPPED(status)) { perror(\"initial trace stop\"); goto cleanup; }\n    stopped = true;\n    if (load_bias(pid, entry, &bias)) { perror(\"AT_ENTRY load bias\"); goto cleanup; }\n    struct iovec io = {&original, sizeof(original)};\n    if (ptrace(PTRACE_GETREGSET, pid, (void *)(uintptr_t)NT_ARM_HW_BREAK, &io)) { perror(\"GET hardware breakpoints\"); goto cleanup; }\n    saved_hw = true; active = original;\n    if ((original.info & 255) < points) { fprintf(stderr, \"Not enough hardware breakpoint slots.\\n\"); goto cleanup; }\n    for (size_t i = 0; i < points; i++) { active.slot[i].address = bias + rvas[i]; active.slot[i].control = (0xfu << 5) | (2u << 1) | 1u; }\n    if (hw_set(pid, &active, points)) { perror(\"SET hardware breakpoints\"); goto cleanup; }\n    printf(\"CAPTURE_ARMED pid=%d load_bias=0x%\" PRIx64 \" points=%zu seconds=%d\\n\", pid, bias, points, limit); fflush(stdout);\n    if (ptrace(PTRACE_CONT, pid, NULL, NULL)) { perror(\"CONT\"); goto cleanup; }\n    stopped = false;\n    while (!cancelled && seconds_now() < deadline) {\n        if (wait_event(pid, &status, deadline)) break;\n        if (WIFEXITED(status) || WIFSIGNALED(status)) { puts(\"TARGET_EXITED_WITHOUT_KEY_CAPTURE\"); pid = -1; goto cleanup; }\n        if (!WIFSTOPPED(status)) continue;\n        stopped = true; int sig = WSTOPSIG(status);\n        struct arm64_regs regs = {0}; io.iov_base = &regs; io.iov_len = sizeof(regs);\n        if (ptrace(PTRACE_GETREGSET, pid, (void *)(uintptr_t)NT_PRSTATUS, &io)) { perror(\"GET general registers\"); goto cleanup; }\n        bool hit = false; for (size_t i = 0; i < points; i++) if (regs.pc == bias + rvas[i]) hit = true;\n        if (sig == SIGTRAP && hit) {\n            unsigned char keys[3][32];\n            for (int i = 0; i < 3; i++) if (key_bytes(pid, regs.x[24 + i], keys[i])) { perror(\"read original key buffer\"); goto cleanup; }\n            unsigned nonzero = 0; for (int i = 0; i < 32; i++) nonzero |= keys[2][i];\n            if (!nonzero) { puts(\"KEY_FUNCTION_RETURNED_EMPTY_MASTER\"); goto cleanup; }\n            print_key(diagnostic ? \"DIAGNOSTIC_X24\" : \"SIGNATURE_BUFFER_0\", keys[0]);\n            print_key(diagnostic ? \"DIAGNOSTIC_X25\" : \"SIGNATURE_BUFFER_1\", keys[1]);\n            print_key(diagnostic ? \"DIAGNOSTIC_X26\" : \"MASTER_KEY_CANDIDATE\", keys[2]);\n            puts(\"READ_FROM_ORIGINAL_REGISTERS: validate both actual AEAD tags before accepting.\"); fflush(stdout);\n            result = 0; goto cleanup;\n        }\n        if (ptrace(PTRACE_CONT, pid, NULL, (void *)(uintptr_t)(sig == SIGSTOP ? 0 : sig))) { perror(\"resume signal\"); goto cleanup; }\n        stopped = false;\n    }\n    puts(\"CAPTURE_TIMEOUT_OR_INTERRUPTED: no key was invented.\");\ncleanup:\n    if (pid > 0) {\n        if (!stopped) {\n            kill(pid, SIGSTOP); cancelled = 0;\n            if (wait_event(pid, &status, seconds_now() + 3) == 0 && WIFSTOPPED(status)) stopped = true;\n        }\n        if (stopped) {\n            if (saved_hw && hw_set(pid, &original, points)) perror(\"restore original debug registers\");\n            int deliver = spawned && result != 0 ? SIGTERM : 0;\n            if (ptrace(PTRACE_DETACH, pid, NULL, (void *)(uintptr_t)deliver)) perror(\"PTRACE_DETACH\");\n        }\n    }\n    return result;\n}\n"
          fixture="/* Controlled validation fixture only: these bytes are not an ANP316 key. */\n#include <stdio.h>\n#include <string.h>\n#include <unistd.h>\nstatic unsigned char a[32], b[32], c[32];\n__attribute__((noinline)) static void hold_registers(void) {\n    register void *x24 __asm__(\"x24\") = a;\n    register void *x25 __asm__(\"x25\") = b;\n    register void *x26 __asm__(\"x26\") = c;\n    __asm__ volatile(\".global fixture_capture\\nfixture_capture:\\n nop\\n\" : : \"r\"(x24), \"r\"(x25), \"r\"(x26) : \"memory\");\n}\nint main(int argc, char **argv) {\n    int empty = argc > 1 && !strcmp(argv[1], \"empty\");\n    int delay = argc > 1 && !strcmp(argv[1], \"delay\");\n    for (int i = 0; i < 32; i++) { a[i] = (unsigned char)i; b[i] = (unsigned char)(i + 32); c[i] = empty ? 0 : (unsigned char)(i + 64); }\n    puts(\"CONTROLLED_FIXTURE_READY\"); fflush(stdout);\n    sleep(delay ? 15 : 1); hold_registers(); puts(\"CONTROLLED_FIXTURE_FINISHED\"); return 0;\n}\n"
          (out/'anp316_keycapture.c').write_text(capture)
          (out/'keycapture_fixture.c').write_text(fixture)
          formatter=shutil.which('clang-format-18') or shutil.which('clang-format') or shutil.which('clang-format-19')
          if not formatter:raise RuntimeError('No preinstalled C formatter; do not download another toolchain')
          subprocess.run([formatter,'-i',str(out/'anp316_keycapture.c'),str(out/'keycapture_fixture.c')],check=True)
          candidates=[]
          for key in ['ANDROID_NDK_HOME','ANDROID_NDK_LATEST_HOME','ANDROID_NDK_ROOT']:
           if os.environ.get(key):candidates.append(pathlib.Path(os.environ[key]))
          for key in ['ANDROID_HOME','ANDROID_SDK_ROOT']:
           if os.environ.get(key):candidates += sorted((pathlib.Path(os.environ[key])/'ndk').glob('*'),reverse=True)
          ndk=next((p for p in candidates if (p/'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang').is_file()),None)
          if ndk is None:raise RuntimeError('No preinstalled Android NDK; no duplicate upstream download allowed')
          bin=ndk/'toolchains/llvm/prebuilt/linux-x86_64/bin'
          cc=bin/'aarch64-linux-android24-clang'
          for stem in ['anp316_keycapture','keycapture_fixture']:
           subprocess.run([str(cc),'-O2','-Wall','-Wextra','-Werror','-fPIE','-pie',str(out/(stem+'.c')),'-o',str(out/stem)],check=True)
          symbols=subprocess.check_output([str(bin/'llvm-nm'),'-n',str(out/'keycapture_fixture')],text=True)
          rva=next(int(line.split()[0],16) for line in symbols.splitlines() if line.split()[-1]=='fixture_capture')
          info={'ndk_properties':(ndk/'source.properties').read_text(),'fixture_capture_rva':hex(rva),'formatter':subprocess.check_output([formatter,'--version'],text=True).strip(),'files':{p.name:{'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.iterdir() if p.is_file()}}
          (out/'build.json').write_text(json.dumps(info,indent=2));print(json.dumps(info))
      - uses: actions/upload-artifact@v4
        with:
          name: anp316-native-keycapture
          path: native-keycapture/
          retention-days: 1
