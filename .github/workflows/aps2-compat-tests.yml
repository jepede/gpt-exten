name: Standalone APS2 decoder compatibility tests
on:
  push:
    branches: [work/aosp-linker-analysis-20261013]
    paths:
      - compatibility/**
      - .github/workflows/aps2-compat-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute with GCC
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic compatibility/aps2_decoder_test.c -o aps2_test
          ./aps2_test
      - name: Compile and execute ELF ABI compat units with GCC
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic compatibility/elf_versions_test.c -o elf_compat_test
          ./elf_compat_test
      - name: Compile and execute ELF ABI compat units with Clang ASan/UBSan
        run: |
          set -euo pipefail
          clang -std=c11 -g -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all compatibility/elf_versions_test.c -o elf_compat_test_san
          ./elf_compat_test_san
      - name: Compile and execute 4KiB/16KiB preflight and copy tests
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic compatibility/elf_load_plan_test.c -o load_plan_test
          ./load_plan_test
          clang -std=c11 -g -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all compatibility/elf_load_plan_test.c -o load_plan_test_san
          ./load_plan_test_san
      - name: Compile and execute with Clang UBSan
        run: |
          set -euo pipefail
          clang -std=c11 -g -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all compatibility/aps2_decoder_test.c -o aps2_test_ubsan
          ./aps2_test_ubsan
