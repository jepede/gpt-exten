name: Android NDK r28c Open Source ARM64 Build Test
on:
  push:
    paths:
      - '.github/workflows/arm64-ndk-oss-github-actions-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Reuse cached NDK r28c artifacts and verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ndkparts"
          gh run download 39019800471 --repo jepede/gpt-exten --pattern 'ndk-r28c-five-part-0*' --dir "$RUNNER_TEMP/ndkparts"
          cd "$RUNNER_TEMP/ndkparts"
          find . -name 'ndk-r28c.part.*' -type f | sort
          test "$(find . -name 'ndk-r28c.part.*' -type f | wc -l)" -eq 5
          for row in \
            '5171e5cc785cc062e090c3edecf594ce355fa83143c6fb2e62aafdba9c70a621 ndk-r28c.part.00' \
            '56983eda293816841e9c87bb90adc2a41e80f216fdb0fce3a927083c677fded7 ndk-r28c.part.01' \
            '342c5394c75929a11ce8538997ae16a8a1213728440efcded5560c07c794faf5 ndk-r28c.part.02' \
            'fe4905960f15b33defa09a871d5f44c18076b02f5334d6bdf6eef94ae6da7394 ndk-r28c.part.03' \
            'f853ef4464dab98c084336ea80b8da9986770803e2718a01f4f0fea66e70d1d1 ndk-r28c.part.04'
          do
            file="$(echo "$row" | cut -d' ' -f2)"
            expected="$(echo "$row" | cut -d' ' -f1)"
            actual="$(find . -name "$file" -type f -exec sha256sum {} \; | cut -d' ' -f1)"
            test "$expected" = "$actual"
          done
          for n in 00 01 02 03 04; do cat "$(find . -name "ndk-r28c.part.$n" -print -quit)"; done > "$RUNNER_TEMP/android-ndk-r28c-linux.zip"
          printf 'dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f  %s\n' "$RUNNER_TEMP/android-ndk-r28c-linux.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ndk"
          unzip -q "$RUNNER_TEMP/android-ndk-r28c-linux.zip" -d "$RUNNER_TEMP/ndk"
          echo "NDK_HOME=$RUNNER_TEMP/ndk/android-ndk-r28c" >> "$GITHUB_ENV"
      - name: Checkout pinned upstream repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          git clone -q --depth=1 --branch v1.7.19 https://github.com/DaveGamble/cJSON.git source/cJSON
          git clone -q --depth=1 --branch v1.3.1 https://github.com/madler/zlib.git source/zlib
          git clone -q --depth=1 --branch v0.8.3 https://github.com/Cyan4973/xxHash.git source/xxHash
          for d in cJSON zlib xxHash; do printf '%s ' "$d"; git -C source/$d rev-parse HEAD; done > SOURCE_COMMITS.txt
          cat SOURCE_COMMITS.txt
      - name: Build ARM64 Bionic libraries and ELF programs
        shell: bash
        run: |
          set -euo pipefail
          CC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          "$CC" --version | head -2
          mkdir -p release/lib release/bin release/src release/reports
          common='-O2 -fPIC -Wl,-z,now -Wl,-z,relro -Wl,--hash-style=both'
          "$CC" $common -shared -Wl,-soname,liboss_cjson.so -I source/cJSON source/cJSON/cJSON.c -lm -o release/lib/liboss_cjson.so
          "$CC" $common -shared -Wl,-soname,liboss_zlib.so -I source/zlib \
             source/zlib/adler32.c source/zlib/compress.c source/zlib/crc32.c source/zlib/deflate.c \
             source/zlib/gzclose.c source/zlib/gzlib.c source/zlib/gzread.c source/zlib/gzwrite.c \
             source/zlib/infback.c source/zlib/inffast.c source/zlib/inflate.c source/zlib/inftrees.c \
             source/zlib/trees.c source/zlib/uncompr.c source/zlib/zutil.c -o release/lib/liboss_zlib.so
          "$CC" $common -shared -Wl,-soname,liboss_xxhash.so -I source/xxHash source/xxHash/xxhash.c -o release/lib/liboss_xxhash.so
          cp source/cJSON/cJSON.h source/xxHash/xxhash.h source/zlib/zlib.h source/zlib/zconf.h release/src/
          cp source/cJSON/LICENSE release/reports/cJSON_LICENSE 2>/dev/null || true
          cp source/xxHash/LICENSE release/reports/xxHash_LICENSE 2>/dev/null || true
          cp source/zlib/LICENSE release/reports/zlib_LICENSE 2>/dev/null || true
          curl -fLsS https://raw.githubusercontent.com/jepede/gpt-exten/main/ndk-oss-tests/smoke_link.c > release/src/smoke_link.c
          curl -fLsS https://raw.githubusercontent.com/jepede/gpt-exten/main/ndk-oss-tests/smoke_dlopen.c > release/src/smoke_dlopen.c
          "$CC" -O2 -fPIE -pie -I source/cJSON -I source/zlib -I source/xxHash release/src/smoke_link.c \
             -L release/lib -l:liboss_cjson.so -l:liboss_zlib.so -l:liboss_xxhash.so -lm \
             -Wl,-rpath,'$ORIGIN/../lib' -o release/bin/smoke_link
          "$CC" -O2 -fPIE -pie release/src/smoke_dlopen.c -ldl \
             -Wl,-rpath,'$ORIGIN/../lib' -o release/bin/smoke_dlopen
          cp SOURCE_COMMITS.txt release/reports/
          "$CC" --version > release/reports/BUILD_INFO.txt
          for f in release/bin/* release/lib/*.so; do
            file "$f" | tee -a release/reports/ELF_SUMMARY.txt
            readelf -h "$f" | grep -E 'Class:|Type:|Machine:' >> release/reports/ELF_SUMMARY.txt
            readelf -d "$f" | grep -E 'NEEDED|SONAME|RUNPATH' >> release/reports/ELF_DYNAMIC.txt || true
          done
          (cd release && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Store small build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oss-ndk-r28c-arm64-api35-20261025
          path: release/
          if-no-files-found: error
          retention-days: 400
