          static int (*vendor_mprotect)(void *, size_t, int);
          static void **vendor_mprotect_slot;
          static atomic_int input_code_ready;
          static unsigned decoder_protect_events;
          static int arm_vendor_protection(void);
          
          static int input_mprotect(void *address, size_t length, int protection) {
            int result = vendor_mprotect(address, length, protection);
            if (result || !(protection & PROT_EXEC) || atomic_load(&input_code_ready))
              return result;
            uintptr_t first = vendor_base + read_hook.rva;
            uintptr_t second = vendor_base + openat_hook.rva;
            int one = memory_protection(first, 16), two = memory_protection(second, 16);
            if (++decoder_protect_events <= 12)
              stage("DECODER_EXEC_TRANSITION address=%p length=%zu prot=%d caller=%p "
                    "read_prot=%d open_prot=%d",
                    address, length, protection, __builtin_return_address(0), one, two);
            if (one < 0 || two < 0 || !(one & PROT_EXEC) || !(two & PROT_EXEC) ||
                memcmp((void *)first, read_hook.expected, 16) ||
                memcmp((void *)second, openat_hook.expected, 16))
              return result;
            int success = 1;
            if (diagnostic_mode != 2 && diagnostic_mode != 4)
              success = !prepare_input_hook(&read_hook, (void *)redirected_read_open);
            if (success && diagnostic_mode != 2 && diagnostic_mode != 3)
              success = !prepare_input_hook(&openat_hook, (void *)redirected_openat);
            if (!success) {
              rollback_input_hook(&read_hook);
              rollback_input_hook(&openat_hook);
            }
            atomic_store(&input_code_ready, success ? 1 : -1);
            void *original = (void *)vendor_mprotect;
            if (write_own_memory(vendor_mprotect_slot, &original, sizeof(original)))
              stage("VENDOR_PROTECT_IMPORT_RESTORE_FAILED");
            stage("DECODED_INPUT_FUNCTIONS_READY result=%d", success);
            return result;
          }
          
          static jint input_vendor_onload(JavaVM *vm, void *reserved) {
            stage("GENUINE_VENDOR_ONLOAD_INTERCEPTED base=%p", (void *)vendor_base);
            stage("DIAGNOSTIC_VENDOR_ONLOAD mode=%d", diagnostic_mode);
            if (diagnostic_mode != 1 && arm_vendor_protection())
              return JNI_ERR;
            stage("GENUINE_VENDOR_ONLOAD_TAIL_FORWARD");
            __attribute__((musttail)) return vendor_onload(vm, reserved);
          }
          
          static void *input_dlsym(void *handle, const char *name) {
            if (!handle || handle == RTLD_NEXT || !name || strcmp(name, "JNI_OnLoad")) {
              /* Required tail call preserves libdl's original caller namespace. */
              __attribute__((musttail)) return real_dlsym(handle, name);
            }
            void *symbol = real_dlsym(handle, name);
            Dl_info info;
            if (!symbol || !dladdr(symbol, &info) || !info.dli_fname ||
                !strstr(info.dli_fname, "/.jiagu/libjiagu_vip_64.so") ||
                (uintptr_t)symbol - (uintptr_t)info.dli_fbase != 0x2c5b88)
              return symbol;
            vendor_base = (uintptr_t)info.dli_fbase;
            vendor_onload = (jint(*)(JavaVM *, void *))symbol;
            void *original = (void *)real_dlsym;
            if (write_own_memory(art_dlsym_slot, &original, sizeof(original))) {
              stage("ART_DLSYM_RESTORE_FAILED");
              return symbol;
            }
            stage("ART_DLSYM_RESTORED_VENDOR_CAPTURED symbol=%p", symbol);
            return (void *)input_vendor_onload;
          }
          
          static uintptr_t dynamic_pointer(uintptr_t base, uintptr_t end,
                                           Elf64_Addr value) {
            if (value >= base && value < end)
              return (uintptr_t)value;
            return base + (uintptr_t)value;
          }
          
          typedef struct {
            uintptr_t base;
            const char *suffix;
            const char *symbol;
            void **slot;
          } ImportLookup;
          static int inspect_import_got(struct dl_phdr_info *info, size_t size,
                                        void *context) {
            (void)size;
            ImportLookup *lookup = context;
            if (!info->dlpi_name ||
                (lookup->base && (uintptr_t)info->dlpi_addr != lookup->base) ||
                (lookup->suffix && !strstr(info->dlpi_name, lookup->suffix)))
              return 0;
            uintptr_t base = (uintptr_t)info->dlpi_addr, end = base;
            const Elf64_Dyn *dynamic = NULL;
            size_t dynamic_count = 0;
            for (Elf64_Half i = 0; i < info->dlpi_phnum; i++) {
              const Elf64_Phdr *ph = &info->dlpi_phdr[i];
              if (ph->p_type == PT_LOAD && base + ph->p_vaddr + ph->p_memsz > end)
                end = base + ph->p_vaddr + ph->p_memsz;
              if (ph->p_type == PT_DYNAMIC) {
                dynamic = (const Elf64_Dyn *)(base + ph->p_vaddr);
                dynamic_count = (size_t)ph->p_memsz / sizeof(*dynamic);
              }
            }
            if (!dynamic || dynamic_count > 4096)
              return 1;
            const Elf64_Sym *symbols = NULL;
            const char *strings = NULL;
            const Elf64_Rela *jump = NULL, *rela = NULL;
            size_t jump_size = 0, rela_size = 0, string_size = 0;
            int jump_kind = 0;
            for (size_t i = 0; i < dynamic_count && dynamic[i].d_tag != DT_NULL; i++) {
              Elf64_Addr value = dynamic[i].d_un.d_ptr;
              switch (dynamic[i].d_tag) {
              case DT_SYMTAB:
                symbols = (const Elf64_Sym *)dynamic_pointer(base, end, value);
                break;
              case DT_STRTAB:
                strings = (const char *)dynamic_pointer(base, end, value);
                break;
              case DT_STRSZ:
                string_size = (size_t)value;
                break;
              case DT_JMPREL:
                jump = (const Elf64_Rela *)dynamic_pointer(base, end, value);
                break;
              case DT_PLTRELSZ:
                jump_size = (size_t)value;
                break;
              case DT_PLTREL:
                jump_kind = (int)value;
                break;
              case DT_RELA:
                rela = (const Elf64_Rela *)dynamic_pointer(base, end, value);
                break;
              case DT_RELASZ:
                rela_size = (size_t)value;
                break;
              default:
                break;
              }
            }
            if (!symbols || !strings || !string_size || string_size > 16777216)
              return 1;
            const Elf64_Rela *tables[2] = {jump_kind == DT_RELA ? jump : NULL, rela};
            size_t lengths[2] = {jump_size, rela_size};
            for (unsigned table = 0; table < 2; table++) {
              if (!tables[table] || lengths[table] > 67108864 ||
                  lengths[table] % sizeof(Elf64_Rela) ||
                  !mapped_pointer((uintptr_t)tables[table], lengths[table], 'r', NULL))
                continue;
              for (size_t index = 0; index < lengths[table] / sizeof(Elf64_Rela);
                   index++) {
                const Elf64_Rela *rel = &tables[table][index];
                unsigned type = ELF64_R_TYPE(rel->r_info);
                if (type != R_AARCH64_JUMP_SLOT && type != R_AARCH64_GLOB_DAT)
                  continue;
                size_t symbol_index = ELF64_R_SYM(rel->r_info);
                const Elf64_Sym *sym = &symbols[symbol_index];
                if (!mapped_pointer((uintptr_t)sym, sizeof(*sym), 'r', NULL) ||
                    sym->st_name >= string_size ||
                    strcmp(strings + sym->st_name, lookup->symbol))
                  continue;
                void **slot = (void **)(base + rel->r_offset);
                if (memory_protection((uintptr_t)slot, sizeof(void *)) < 0 ||
                    !mapped_pointer((uintptr_t)*slot, 4, 'x', NULL))
                  continue;
                lookup->slot = slot;
                stage("ELF_IMPORT_SLOT_FOUND symbol=%s slot=%p original=%p",
                      lookup->symbol, (void *)slot, *slot);
                return 1;
              }
            }
            stage("ELF_IMPORT_SLOT_NOT_FOUND symbol=%s jump_size=%zu rela_size=%zu",
                  lookup->symbol, jump_size, rela_size);
            return 1;
          }
          
          static int arm_vendor_protection(void) {
            ImportLookup query = {.base = vendor_base, .symbol = "mprotect"};
            dl_iterate_phdr(inspect_import_got, &query);
            if (!query.slot) {
              stage("VENDOR_PROTECTION_IMPORT_UNAVAILABLE");
              return -1;
            }
            vendor_mprotect_slot = query.slot;
            vendor_mprotect = (int (*)(void *, size_t, int))*query.slot;
            void *replacement = (void *)input_mprotect;
            if (write_own_memory(query.slot, &replacement, sizeof(replacement)))
              return -1;
            stage("VENDOR_DECODE_PROTECTION_OBSERVER_ARMED");
            return 0;
          }
          
          JNIEXPORT void JNICALL Java_lab_restore_NativeInput_configure(
              JNIEnv *env, jclass type, jstring installed, jstring original) {
            jfieldID mode_field =
                (*env)->GetStaticFieldID(env, type, "diagnosticMode", "I");
            if (!mode_field || check_java(env, "input-mode-field"))
              return;
            diagnostic_mode = (*env)->GetStaticIntField(env, type, mode_field);
            if (diagnostic_mode < 0 || diagnostic_mode > 7) {
              jclass error = (*env)->FindClass(env, "java/lang/IllegalArgumentException");
              if (error)
                (*env)->ThrowNew(env, error, "Unsupported input mode");
              return;
            }
            if (atomic_exchange_explicit(&archive_configured, 1, memory_order_acq_rel))
              return;
            const char *actual = (*env)->GetStringUTFChars(env, installed, NULL);
            if (!actual)
              return;
            const char *archive = (*env)->GetStringUTFChars(env, original, NULL);
            if (!archive) {
              (*env)->ReleaseStringUTFChars(env, installed, actual);
              return;
            }
            int valid =
                strlen(actual) < sizeof(installed_apk) &&
                strlen(archive) < sizeof(original_apk) &&
                strstr(actual, "cn.chuci.and.wkfenshen") && strstr(actual, "/base.apk") &&
                strstr(archive, "cn.chuci.and.wkfenshen") && strcmp(actual, archive);
            if (valid) {
              strcpy(installed_apk, actual);
              strcpy(original_apk, archive);
            }
            (*env)->ReleaseStringUTFChars(env, original, archive);
            (*env)->ReleaseStringUTFChars(env, installed, actual);
            char log_path[PATH_MAX];
            if (valid && snprintf(log_path, sizeof(log_path), "%s.native-input.log",
                                  original_apk) < (int)sizeof(log_path))
              journal_fd = open(
                  log_path, O_WRONLY | O_CREAT | O_APPEND | O_CLOEXEC | O_NOFOLLOW, 0600);
            struct stat archive_stat;
            if (!valid || stat(original_apk, &archive_stat) ||
                !S_ISREG(archive_stat.st_mode) || archive_stat.st_uid != getuid() ||
                archive_stat.st_size != 44934638)
              goto failure;
            if (diagnostic_mode == 6 || diagnostic_mode == 7) {
              if (install_syscall_input())
                goto failure;
              return;
            }
            ImportLookup query = {.suffix = "/libart.so", .symbol = "dlsym"};
            dl_iterate_phdr(inspect_import_got, &query);
            art_dlsym_slot = query.slot;
            if (query.slot)
              real_dlsym = (void *(*)(void *, const char *)) * query.slot;
            if (!art_dlsym_slot || !real_dlsym)
              goto failure;
            void *replacement = (void *)input_dlsym;
            if (write_own_memory(art_dlsym_slot, &replacement, sizeof(replacement)))
              goto failure;
            stage("NATIVE_ARCHIVE_INPUT_ARMED actual=%s original=%s", installed_apk,
                  original_apk);
            return;
          failure:
            stage("NATIVE_ARCHIVE_INPUT_SETUP_FAILED");
            jclass error = (*env)->FindClass(env, "java/lang/IllegalStateException");
            if (error)
              (*env)->ThrowNew(
                  env, error,
                  "Native archive input adapter unavailable; see startup log");
          }
          
          JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM *vm, void *reserved) {
            (void)reserved;
