name: Build Real Screen Backdrop
on:
  push:
    branches: [integration/real-screen-backdrop-20260917]
    paths:
      - real_screen_backdrop/**
      - .github/workflows/build-real-screen-backdrop.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore existing NDK artifact parts (no new upstream download)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31684150811
          artifact-ids: 9174697344,9174699121
          path: ${{ runner.temp }}/ndk-parts
      - name: Verify and restore r28c
        env:
          PARTS: ${{ runner.temp }}/ndk-parts
          DEST: ${{ runner.temp }}/ndk
        run: |
          python3 - <<'PY'
          import os,pathlib,hashlib,shutil
          root=pathlib.Path(os.environ['PARTS']);dest=pathlib.Path(os.environ['DEST']);dest.mkdir()
          expected=['6e87d3bb98c2bfcdb9a703affd174b85ef00fff69b9aa0056372f79046308fa1','bf9baef30047e4a7e1040034619728cce0b291d76e4d67b44a0d5d0554c0197c']
          with (dest/'ndk.zip').open('wb') as output:
              for index,digest in enumerate(expected):
                  matches=list(root.rglob('ndk-r28c.part.%02d'%index));assert len(matches)==1,matches
                  with matches[0].open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==digest
                  with matches[0].open('rb') as f:shutil.copyfileobj(f,output)
          with (dest/'ndk.zip').open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f'
          PY
          unzip -q "$DEST/ndk.zip" -d "$DEST"
      - name: Build ARM64 and DEX; run protocol, fixture and GPU tests
        env:
          NDK_ROOT: ${{ runner.temp }}/ndk/android-ndk-r28c
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: 1
        run: bash real_screen_backdrop/ci_build.sh
      - name: Prepare delivery
        run: |
          find real_screen_backdrop -type d -name __pycache__ -prune -exec rm -rf {} +
          mkdir -p delivery
          cp -a real_screen_backdrop/. delivery/
      - uses: actions/upload-artifact@v4
        with:
          name: RealScreenBackdrop_AHB_v1
          path: delivery/
          retention-days: 30
          if-no-files-found: error
      - name: Publish diagnostic logs even after a failed build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealScreenBackdrop_build_logs
          path: real_screen_backdrop/validation/
          retention-days: 30
          if-no-files-found: ignore
