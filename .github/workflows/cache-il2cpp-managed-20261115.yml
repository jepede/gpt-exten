name: Cache IL2CPP managed analysis tools
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cache-il2cpp-managed-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Collect pinned upstream binaries and verify runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload out
          cd payload
          fetch() {
            curl -fLsS --retry 3 --retry-all-errors "$1" -o "$2"
          }
          fetch https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/10.0/releases.json ../releases.json
          for arch in x64 arm64; do
            item=$(jq -ce --arg arch "linux-$arch" '.releases[] | select(.runtime.version=="10.0.15") | .runtime.files[] | select(.rid==$arch and (.name | endswith(".tar.gz")))' ../releases.json)
            name="dotnet-runtime-10.0.15-linux-$arch.tar.gz"
            fetch "$(jq -r .url <<<"$item")" "$name"
            echo "$(jq -r .hash <<<"$item")  $name" | sha512sum -c -
          done
          fetch https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net7-v6.7.46.zip Il2CppDumper-net7-v6.7.46.zip
          fetch https://api.nuget.org/v3-flatcontainer/ilspycmd.any/11.2.0.10050/ilspycmd.any.11.2.0.10050.nupkg ilspycmd.any.11.2.0.10050.nupkg
          fetch https://raw.githubusercontent.com/icsharpcode/ILSpy/v11.2/LICENSE ILSpy-LICENSE.txt
          python -m pip download --no-deps --only-binary=:all: --dest . keystone-engine==0.9.2
          test "$(du -sb . | cut -f1)" -lt 99000000
          sha256sum * > ../component-hashes.txt
          cat ../component-hashes.txt
          cp ../component-hashes.txt SHA256SUMS
          cd ..
          tar -cf out/il2cpp-managed-tools.tar -C payload .
          stat -c '%s %n' out/il2cpp-managed-tools.tar
          sha256sum out/il2cpp-managed-tools.tar
      - uses: actions/upload-artifact@v4
        with:
          name: il2cpp-managed-linux-x64-arm64-20261115
          path: out/il2cpp-managed-tools.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 400
