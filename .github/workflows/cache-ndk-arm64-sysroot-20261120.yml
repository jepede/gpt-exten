name: Cache NDK r28c ARM64 API35 sysroot
on:
  push:
    branches: ['work/ydw5-ndk-sysroot-20261120']
    paths: ['.github/workflows/cache-ndk-arm64-sysroot-20261120.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reuse original NDK cache without upstream download
        uses: actions/download-artifact@v4
        with:
          pattern: ndk-r28c-five-part-0*
          run-id: 39019800471
          github-token: ${{ github.token }}
          path: cached
          merge-multiple: true
      - name: Verify source and extract native headers and ARM64 API35 libraries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,json,tarfile
          expected=['5171e5cc785cc062e090c3edecf594ce355fa83143c6fb2e62aafdba9c70a621','56983eda293816841e9c87bb90adc2a41e80f216fdb0fce3a927083c677fded7','342c5394c75929a11ce8538997ae16a8a1213728440efcded5560c07c794faf5','fe4905960f15b33defa09a871d5f44c18076b02f5334d6bdf6eef94ae6da7394','f853ef4464dab98c084336ea80b8da9986770803e2718a01f4f0fea66e70d1d1']
          whole=Path('ndk.zip')
          with whole.open('wb') as out:
              for i,h in enumerate(expected):
                  b=Path(f'cached/ndk-r28c.part.{i:02d}').read_bytes()
                  assert hashlib.sha256(b).hexdigest()==h
                  out.write(b)
          assert whole.stat().st_size==722261334
          assert hashlib.sha256(whole.read_bytes()).hexdigest()=='dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f'
          root=Path('stage');root.mkdir()
          prefix='android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/sysroot/'
          records=[]
          with zipfile.ZipFile(whole) as z:
              for n in z.namelist():
                  if n.endswith('/'):continue
                  if n.startswith(prefix):
                      rel=n[len(prefix):]
                      target=rel.startswith('usr/include/')
                      if rel.startswith('usr/lib/aarch64-linux-android/'):
                          rest=rel[len('usr/lib/aarch64-linux-android/'):]
                          target=('/' not in rest) or rest.startswith('35/')
                      if not target:continue
                      dst=root/'sysroot'/rel
                  elif n in ('android-ndk-r28c/NOTICE','android-ndk-r28c/NOTICE.toolchain','android-ndk-r28c/source.properties'):
                      dst=root/Path(n).name
                  else:continue
                  b=z.read(n);dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(b)
                  records.append({'path':str(dst.relative_to(root)),'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          out=Path('out');out.mkdir()
          archive=out/'ndk-r28c-arm64-api35-sysroot.tar.xz'
          with tarfile.open(archive,'w:xz',preset=6) as t:t.add(root,arcname='ndk-arm64-api35')
          assert archive.stat().st_size<95000000,'Must split before uploading oversized bundle'
          manifest={'name':'Android NDK ARM64 API35 sysroot','version':'r28c-api35-v1','platform':'Android API35 / Linux','architecture':'AArch64 target, any host','source_run_id':39019800471,'source_sha256':'dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f','file':archive.name,'size':archive.stat().st_size,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'files':records}
          (out/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (out/'SHA256SUMS.txt').write_text(manifest['sha256']+'  '+archive.name+'\n')
          print({k:v for k,v in manifest.items() if k!='files'})
          PY
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ndk-r28c-arm64-api35-sysroot-v1
          path: out/*
          compression-level: 0
          retention-days: 400
          if-no-files-found: error
      - name: Record actual artifact expiry and checksums in cache index
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess,base64,time
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];aid=os.environ['ARTIFACT_ID'];run=os.environ['GITHUB_RUN_ID']
          def api(path,method='GET',data=None):
              cmd=['gh','api','--method',method,path]
              if data is not None:cmd+=['--input','-']
              return json.loads(subprocess.check_output(cmd,input=None if data is None else json.dumps(data).encode()))
          a=api(f'repos/{repo}/actions/artifacts/{aid}')
          m=json.loads(Path('out/MANIFEST.json').read_text())
          record=f'''\n\n## Artifact Record: Android NDK ARM64 API35 sysroot r28c-api35-v1 (2026-11-20)\n\n- Artifact Name: `{a['name']}`\n- Artifact ID: `{aid}`\n- Run ID: `{run}`\n- Workflow: `.github/workflows/cache-ndk-arm64-sysroot-20261120.yml` on `work/ydw5-ndk-sysroot-20261120`\n- File: `{a['name']}.zip` (outer Artifact)\n- Size: `{a['size_in_bytes']}` bytes\n- SHA256: `{a.get('digest','unavailable')}` (outer Artifact digest)\n- Created At: `{a['created_at']}`\n- Expires At: `{a['expires_at']}` (actual GitHub response)\n- Storage Mode: SINGLE\n- Original File: `{m['file']}`\n- Original Size: `{m['size']}` bytes\n- Original SHA256: `{m['sha256']}`\n- Part Count: 1\n- Source: existing verified NDK r28c Run `39019800471`; NO upstream download; source SHA256 `{m['source_sha256']}`\n- Requested retention-days: 400; actual expiry above governs\n\n| Name | Version | Platform | Architecture | File/Path | SHA256 |\n|---|---|---|---|---|---|\n| Android NDK ARM64 API35 sysroot | r28c-api35-v1 | Android API35 / Linux | AArch64 target, any host | `{m['file']}` | `{m['sha256']}` |\n\nIncludes NDK headers, libc++ headers, ARM64 target support libraries and API35 link stubs; not Android runtime libraries. Per-file hashes in MANIFEST.json. Compiler/LLD separately cached in Run 39121838147. All files are public toolchain files; no private target or reconstructed source is uploaded.\n'''
          for attempt in range(4):
              old=api(f'repos/{repo}/contents/ARTIFACT_CACHE.md?ref=main')
              text=base64.b64decode(old['content']).decode()
              if f'Artifact ID: `{aid}`' in text:break
              body={'message':'Record verified NDK r28c ARM64 API35 sysroot cache','sha':old['sha'],'branch':'main','content':base64.b64encode((text+record).encode()).decode()}
              try:api(f'repos/{repo}/contents/ARTIFACT_CACHE.md','PUT',body);break
              except subprocess.CalledProcessError:
                  if attempt==3:raise
                  time.sleep(2)
          print(record)
          PY
