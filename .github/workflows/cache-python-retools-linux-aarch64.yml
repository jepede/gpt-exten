name: ARM64 Linux Python native analysis libraries
on:
  push:
    paths:
      - '.github/workflows/cache-python-retools-linux-aarch64.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Pin upstream wheels and source by PyPI checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/{wheels,source,licenses} work
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          def get(project, version, filename, folder):
              with urllib.request.urlopen(f'https://pypi.org/pypi/{project}/{version}/json') as resp:
                  entry = next(e for e in json.load(resp)['urls'] if e['filename'] == filename)
              path = pathlib.Path('package') / folder / filename
              with urllib.request.urlopen(entry['url']) as src:
                  path.write_bytes(src.read())
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              assert sha == entry['digests']['sha256']
              print(sha, filename, flush=True)
          get('capstone','5.0.6','capstone-5.0.6-py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64.whl','wheels')
          get('unicorn','2.1.4','unicorn-2.1.4-cp37-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl','wheels')
          get('keystone-engine','0.9.2','keystone-engine-0.9.2.tar.gz','source')
          PY
      - name: Build upstream Keystone Python wheel for the native host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          tar xf package/source/keystone-engine-0.9.2.tar.gz -C work
          root="$PWD/package"
          src="$PWD/work/keystone-engine-0.9.2"
          install -m 644 "$src/src/COPYING" "$root/licenses/Keystone-COPYING"
          if test -f "$src/src/EXCEPTIONS-CLIENT"; then install -m 644 "$src/src/EXCEPTIONS-CLIENT" "$root/licenses/Keystone-EXCEPTIONS-CLIENT"; fi
          cp "$src/src/llvm/LICENSE.TXT" "$root/licenses/Keystone-LLVM-LICENSE.TXT"
          cd "$src"
          PATH="/usr/bin:$PATH" CMAKE_POLICY_VERSION_MINIMUM=3.5 /usr/bin/python3 setup.py bdist_wheel --plat-name linux_aarch64 --dist-dir "$root/wheels" > "$RUNNER_TEMP/ks.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ks.log"; exit 1; }
          ls -l "$root"/wheels
      - name: Verify assembly, disassembly and emulation on AArch64
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-index --no-deps --target "$PWD/modules" package/wheels/*.whl
          PYTHONPATH="$PWD/modules" python3 - <<'PY'
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN
          from keystone import Ks, KS_ARCH_ARM64, KS_MODE_LITTLE_ENDIAN
          from unicorn import Uc, UC_ARCH_ARM64, UC_MODE_ARM
          from unicorn.arm64_const import UC_ARM64_REG_X0
          code, count = Ks(KS_ARCH_ARM64, KS_MODE_LITTLE_ENDIAN).asm("mov x0, #7; add x0, x0, #35")
          instructions = list(Cs(CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN).disasm(bytes(code), 0x1000))
          uc = Uc(UC_ARCH_ARM64, UC_MODE_ARM)
          uc.mem_map(0x1000, 0x1000)
          uc.mem_write(0x1000, bytes(code))
          uc.emu_start(0x1000, 0x1000 + len(code))
          assert count == len(instructions) == 2
          assert uc.reg_read(UC_ARM64_REG_X0) == 42
          print("Native Linux AArch64 round trip:", bytes(code).hex(), [i.mnemonic for i in instructions], "x0=42")
          PY
          python3 - <<'PY'
          import pathlib, zipfile
          for wheel in pathlib.Path('package/wheels').glob('*.whl'):
              with zipfile.ZipFile(wheel) as z:
                  for name in z.namelist():
                      base = pathlib.PurePosixPath(name).name
                      if base.upper().startswith(('LICENSE','COPYING')) and not name.endswith('/'):
                          (pathlib.Path('package/licenses') / (wheel.name.split('-')[0] + '-' + base)).write_bytes(z.read(name))
          PY
          cd package
          sha256sum wheels/*.whl source/* licenses/* > SHA256SUMS
          cat SHA256SUMS
          cd ..
          tar --sort=name --mtime='@0' --numeric-owner --owner=0 --group=0 -cf - -C package . | gzip -n > python-re-aarch64.tar.gz
          sha256sum python-re-aarch64.tar.gz
          stat -c '%s' python-re-aarch64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: python-re-linux-aarch64-capstone-unicorn-keystone-20261115
          path: python-re-aarch64.tar.gz
          compression-level: 0
          retention-days: 400
          if-no-files-found: error
