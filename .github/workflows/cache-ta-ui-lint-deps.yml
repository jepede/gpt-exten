name: Cache TrustAttestor UI Lint Dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-ta-ui-lint-deps.yml'

permissions:
  actions: read
  contents: read

jobs:
  warm-lint-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reuse cached Gradle and Kotlin-complete dependency cache
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base/gradle" "$RUNNER_TEMP/base/deps" "$RUNNER_TEMP/gradle-home"
          gh run download 34697680626 --repo "$GITHUB_REPOSITORY" --name gradle-8.10.2-bin --dir "$RUNNER_TEMP/base/gradle"
          gh run download 34698303924 --repo "$GITHUB_REPOSITORY" --name gradle-modules2-ta-ui-kotlincompile-linux-x86_64 --dir "$RUNNER_TEMP/base/deps"
          test "$(sha256sum "$RUNNER_TEMP/base/gradle/gradle-8.10.2-bin.zip" | awk '{print $1}')" = '31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26'
          test "$(sha256sum "$RUNNER_TEMP/base/deps/gradle-modules2-ta-ui-kotlincompile-linux-x86_64.tar.zst" | awk '{print $1}')" = '05ad98f032233604c106b0d8dec061160d09a9ab212b8831abc9377728bd563c'
          unzip -q "$RUNNER_TEMP/base/gradle/gradle-8.10.2-bin.zip" -d "$RUNNER_TEMP"
          tar -C "$RUNNER_TEMP/gradle-home" -I zstd -xf "$RUNNER_TEMP/base/deps/gradle-modules2-ta-ui-kotlincompile-linux-x86_64.tar.zst"

      - name: Resolve Android Lint 31.7.2 and transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/lint-warm"
          mkdir -p "$ROOT"
          cat > "$ROOT/settings.gradle" <<'EOF'
          rootProject.name = 'lint-warm'
          EOF
          cat > "$ROOT/build.gradle" <<'EOF'
          repositories {
              google()
              mavenCentral()
          }
          configurations {
              lintDeps
          }
          dependencies {
              lintDeps 'com.android.tools.lint:lint-gradle:31.7.2'
          }
          tasks.register('resolveLintDeps') {
              doLast {
                  configurations.lintDeps.resolve().sort().each { println it }
              }
          }
          EOF
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home"
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          "$RUNNER_TEMP/gradle-8.10.2/bin/gradle" -p "$ROOT" --no-daemon resolveLintDeps
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/com.android.tools.lint/lint-gradle/31.7.2" -type f -maxdepth 3 -print

      - name: Package release-complete dependency cache
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/gradle-modules2-ta-ui-releasecomplete-linux-x86_64.tar.zst"
          tar -C "$RUNNER_TEMP/gradle-home" -I 'zstd -19 -T0' -cf "$OUT" caches/modules-2
          sha256sum "$OUT" | tee "$OUT.sha256"
          stat -c '%n %s bytes' "$OUT"
          test "$(stat -c '%s' "$OUT")" -lt 500000000

      - name: Upload release-complete dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-modules2-ta-ui-releasecomplete-linux-x86_64
          path: |
            ${{ runner.temp }}/gradle-modules2-ta-ui-releasecomplete-linux-x86_64.tar.zst
            ${{ runner.temp }}/gradle-modules2-ta-ui-releasecomplete-linux-x86_64.tar.zst.sha256
          retention-days: 400
          compression-level: 0
