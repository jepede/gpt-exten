name: Download Android NDK r28c

on:
  push:
    paths:
      - '.github/workflows/download-ndk-r28c.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Delete the previous two-part NDK r28c cache and verify removal
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[replace-ndk-r28c-3part]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for entry in '12053422732:ndk-r28c-part-00' '12053417838:ndk-r28c-part-01'; do
            id="${entry%%:*}"
            expected="${entry#*:}"
            if actual="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --jq '.name' 2>/dev/null)"; then
              test "$actual" = "$expected" || { echo "::error::Unexpected artifact name for $id: $actual"; exit 1; }
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              echo "Deleted old NDK artifact: $id ($expected)"
            else
              echo "Old artifact already absent: $id"
            fi
          done
          for id in 12053422732 12053417838; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --jq '.id' >/dev/null 2>&1; then
              echo "::error::Old NDK artifact $id still exists"
              exit 1
            fi
          done
          echo "Old NDK cache deleted and absence verified"

      - name: Download NDK r28c anew from Google
        run: |
          set -euo pipefail
          mkdir -p artifact parts
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 \
            -o artifact/android-ndk-r28c-linux.zip \
            https://dl.google.com/android/repository/android-ndk-r28c-linux.zip

      - name: Verify source integrity and split evenly into exactly three parts
        run: |
          set -euo pipefail
          echo 'a7b54a5de87fecd125a17d54f73c446199e72a64  artifact/android-ndk-r28c-linux.zip' | sha1sum -c -
          echo 'dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f  artifact/android-ndk-r28c-linux.zip' | sha256sum -c -
          test "$(stat -c %s artifact/android-ndk-r28c-linux.zip)" -eq 722261334
          split -n 3 -d -a 2 artifact/android-ndk-r28c-linux.zip parts/ndk-r28c.part.
          test "$(find parts -type f -name 'ndk-r28c.part.*' | wc -l)" -eq 3
          for n in 00 01 02; do
            test -s "parts/ndk-r28c.part.$n"
            test "$(stat -c %s "parts/ndk-r28c.part.$n")" -lt 512000000
          done
          cat parts/ndk-r28c.part.{00,01,02} | sha256sum | grep -F 'dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f'
          echo "=== Source and part hashes ==="
          sha256sum artifact/android-ndk-r28c-linux.zip parts/ndk-r28c.part.*
          stat -c '%n %s bytes' artifact/android-ndk-r28c-linux.zip parts/ndk-r28c.part.*

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: ndk-r28c-part-00
          path: parts/ndk-r28c.part.00
          if-no-files-found: error
          compression-level: 0
          retention-days: 400

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: ndk-r28c-part-01
          path: parts/ndk-r28c.part.01
          if-no-files-found: error
          compression-level: 0
          retention-days: 400

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: ndk-r28c-part-02
          path: parts/ndk-r28c.part.02
          if-no-files-found: error
          compression-level: 0
          retention-days: 400
