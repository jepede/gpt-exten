name: Download Relay Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/download-relay.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download a public internet file
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output relay-example.html \
            https://www.example.com/
          test -s relay-example.html
          sha256sum relay-example.html | tee relay-example.sha256
          wc -c relay-example.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-example
          path: |
            relay-example.html
            relay-example.sha256
          compression-level: 0
          retention-days: 1

      - name: Publish run id marker
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .download-relay-run-id
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .download-relay-run-id
          git commit -m 'ci: publish download relay run id'
          git push
