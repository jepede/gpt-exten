name: Ember v05 AR15 field recording
on:
  push:
    branches: [work/ember-realism-v05-20261120]
    paths: [.github/workflows/ember-v05-ar15.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Retrieve missing CC0 5.56 source recording
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, hashlib, json, zipfile, wave
          root=pathlib.Path("ar15-source"); root.mkdir()
          items=[
            ("AR15-D_32P.wav","https://raw.githubusercontent.com/petroulacl/fps-asset-kit/main/sfx/firearm_sfx/Prepared%20SFX%20Library/AR-15/D_32P.wav"),
            ("mirror-README.md","https://raw.githubusercontent.com/petroulacl/fps-asset-kit/main/README.md"),
          ]
          records=[]
          for name,url in items:
            req=urllib.request.Request(url,headers={"User-Agent":"EmberSourceAudit/0.5"})
            with urllib.request.urlopen(req,timeout=60) as r: data=r.read(40*1024*1024)
            (root/name).write_bytes(data)
            records.append({"name":name,"source":url,"size":len(data),"sha256":hashlib.sha256(data).hexdigest(),"license":"CC0"})
          with wave.open(str(root/"AR15-D_32P.wav"),"rb") as w:
            print("source WAV",w.getnchannels(),w.getsampwidth(),w.getframerate(),w.getnframes())
            assert w.getnframes()>1000
          (root/"SOURCE.txt").write_text("The Free Firearm Sound Library; original https://opengameart.org/content/the-free-firearm-sound-library ; public-domain CC0 source. Downloaded from fps-asset-kit mirror. AR-15 field recording adapted for game SCAR-L and HK416. This is not a recording of either model.\n")
          with zipfile.ZipFile("ember-ar15-v05.zip","w",zipfile.ZIP_DEFLATED,6) as z:
            for p in sorted(root.iterdir()): z.write(p,p.relative_to(root))
          p=pathlib.Path("ember-ar15-v05.zip")
          assert p.stat().st_size<90*1024*1024
          manifest={"file":p.name,"size":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"records":records}
          pathlib.Path("ar15-manifest.json").write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ember-ar15-v05
          path: ember-ar15-v05.zip
          compression-level: 0
          retention-days: 400
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ember-ar15-v05-manifest
          path: ar15-manifest.json
          compression-level: 0
          retention-days: 400
          if-no-files-found: error
