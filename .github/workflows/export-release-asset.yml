name: Export Release Asset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-release-asset.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        run: |
          set -euo pipefail
          url='https://github.com/jepede/gpt-thought-environment-extension/releases/download/1.0.0/aosp_android_arm64_qemu_rootfs.tar.xz'
          curl --fail --location --retry 3 --retry-all-errors \
            --output aosp_android_arm64_qemu_rootfs.tar.xz "$url"
          echo 'af8a53f0d841120db9acf6a603a9f3b892f4b81a25dfc084146805f3758ce990  aosp_android_arm64_qemu_rootfs.tar.xz' | sha256sum -c -
          ls -lh aosp_android_arm64_qemu_rootfs.tar.xz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aosp-android-arm64-qemu-rootfs
          path: aosp_android_arm64_qemu_rootfs.tar.xz
          compression-level: 0
          retention-days: 1
      - name: Publish run id marker
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .release-artifact-run-id
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .release-artifact-run-id
          git commit -m 'ci: publish release export run id'
          git push
