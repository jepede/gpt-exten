name: Extract GPT-5.6 Prompt Archives

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-gpt56-prompts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Clone public source repository
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/MDX-Tom/gpt-5.6-instruct.git source

      - name: Extract repository text and every ZIP archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/repo-text bundle/extracted-zips

          rsync -a \
            --include='*/' \
            --include='*.md' \
            --include='*.txt' \
            --include='*.py' \
            --include='*.json' \
            --include='*.toml' \
            --include='*.yaml' \
            --include='*.yml' \
            --exclude='*' \
            source/ bundle/repo-text/

          while IFS= read -r -d '' archive; do
            rel="${archive#source/}"
            out="bundle/extracted-zips/${rel%.zip}"
            mkdir -p "$out"
            unzip -qq -o "$archive" -d "$out"
          done < <(find source -type f -name '*.zip' -print0 | sort -z)

          find bundle -type f -printf '%P\n' | sort > bundle/inventory.txt
          printf '\nArchive members:\n' >> bundle/inventory.txt
          while IFS= read -r -d '' archive; do
            printf '\n### %s\n' "${archive#source/}" >> bundle/inventory.txt
            unzip -Z1 "$archive" >> bundle/inventory.txt
          done < <(find source -type f -name '*.zip' -print0 | sort -z)

          echo "Extracted file count: $(find bundle -type f | wc -l)"
          du -sh bundle

      - name: Upload extracted prompt sources
        uses: actions/upload-artifact@v4
        with:
          name: gpt56-prompts-extracted
          path: bundle/
          compression-level: 0
          retention-days: 1
