name: Cache ARM64 System Lab Debian 13
on:
  push:
    paths:
      - '.github/workflows/fetch-arm64-system-lab-debian13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch public Debian packages only
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          docker run --rm -v "$PWD/output:/out" debian:trixie-slim bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            mkdir -p /out/host /out/guest /out/meta
            apt-get -y --no-install-recommends --download-only install qemu-system-arm qemu-system-common qemu-system-data
            cp /var/cache/apt/archives/*.deb /out/host/
            dpkg --add-architecture arm64
            apt-get update
            cd /out/guest
            apt-get download busybox-static:arm64 gdbserver:arm64 libc6:arm64 libgcc-s1:arm64
            kernel=$(apt-cache depends linux-image-arm64:arm64 | awk "/Depends: linux-image-/{print \$2; exit}")
            test -n "$kernel"
            apt-get download "$kernel:arm64"
            for f in /out/host/*.deb /out/guest/*.deb; do dpkg-deb -f "$f" Package Version Architecture; done > /out/meta/PACKAGES.txt
            apt-cache policy qemu-system-arm linux-image-arm64:arm64 busybox-static:arm64 > /out/meta/APT_POLICY.txt
            cat /etc/os-release > /out/meta/OS_RELEASE.txt
            cd /out
            find host guest -type f -print0 | sort -z | xargs -0 sha256sum > meta/SHA256SUMS.txt
          '
          sudo chown -R "$(id -u):$(id -g)" output
          tar -C output -cf arm64-system-lab-debian13-v1.tar host guest meta
          sha256sum arm64-system-lab-debian13-v1.tar > SHA256SUMS.txt
          stat -c '%s %n' arm64-system-lab-debian13-v1.tar
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-system-lab-debian13-v1
          path: |
            arm64-system-lab-debian13-v1.tar
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
