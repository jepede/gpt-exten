name: Fetch ASTC Encoder 5.7.0

on:
  push:
    paths:
      - '.github/workflows/fetch-astcenc-5-7-0.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download official astcenc release
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/ARM-software/astc-encoder/releases/download/5.7.0/astcenc-5.7.0-linux-x64.zip'
          curl -fL --retry 5 --retry-delay 2 "$url" -o astcenc-5.7.0-linux-x64.zip
          echo '6c6b299b17608e1ee74db9c491cdc793b12b2b104a4b52222e358d78ae0662a9  astcenc-5.7.0-linux-x64.zip' | sha256sum -c -
          mkdir extracted
          unzip -q astcenc-5.7.0-linux-x64.zip -d extracted
          find extracted -maxdepth 2 -type f -print
          find extracted -type f -name 'astcenc*' -exec chmod +x {} +
          sha256sum astcenc-5.7.0-linux-x64.zip > SHA256SUMS.txt
          find extracted -type f -exec sha256sum {} \; >> SHA256SUMS.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astcenc-5.7.0-linux-x64
          path: |
            astcenc-5.7.0-linux-x64.zip
            extracted/
            SHA256SUMS.txt
          retention-days: 90
          compression-level: 0
