name: Fetch frozen cquant Golden USD-M derivatives 2025-01-01 to 2026-07-31

on:
  push:
    paths:
      - '.github/workflows/fetch-cquant-binance-um-golden-derivatives-20250101-20260731.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify Golden Binance USD-M public data
        shell: bash
        run: |
          set -euo pipefail
          SYMBOLS=(AAVEUSDT ATOMUSDT ETCUSDT FILUSDT UNIUSDT)
          INTERVAL=15m
          BASE=https://data.binance.vision/data/futures/um
          mkdir -p work/zips work/raw/klines work/raw/metrics work/raw/funding work/manifests work/missing out

          fetch_required() {
            local kind="$1" symbol="$2" period="$3" url="$4" target="$5" manifest="$6"
            local zip checksum expected actual bytes rows
            zip="work/zips/${kind}-${symbol}-${period}.zip"
            checksum="${zip}.CHECKSUM"
            curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 "$url" -o "$zip"
            curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 "${url}.CHECKSUM" -o "$checksum"
            expected="$(awk '{print $1}' "$checksum" | tr 'A-F' 'a-f')"
            actual="$(sha256sum "$zip" | awk '{print $1}')"
            test "$actual" = "$expected"
            unzip -p "$zip" >> "$target"
            bytes="$(stat -c '%s' "$zip")"
            rows="$(unzip -p "$zip" | wc -l)"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$kind" "$symbol" "$INTERVAL" "$period" "$url" "$actual" "$bytes" "$rows" >> "$manifest"
            rm -f "$zip" "$checksum"
          }

          fetch_optional() {
            local kind="$1" symbol="$2" period="$3" url="$4" target="$5" manifest="$6" missing="$7"
            local zip checksum expected actual bytes rows
            zip="work/zips/${kind}-${symbol}-${period}.zip"
            checksum="${zip}.CHECKSUM"
            if ! curl -fL --retry 3 --retry-delay 1 --connect-timeout 20 "$url" -o "$zip"; then
              printf '%s\t%s\t%s\t%s\n' "$kind" "$symbol" "$period" "$url" >> "$missing"
              rm -f "$zip" "$checksum"
              return 0
            fi
            curl -fL --retry 5 --retry-delay 2 --connect-timeout 20 "${url}.CHECKSUM" -o "$checksum"
            expected="$(awk '{print $1}' "$checksum" | tr 'A-F' 'a-f')"
            actual="$(sha256sum "$zip" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "checksum mismatch for $url expected=$expected actual=$actual" >&2
              exit 1
            fi
            unzip -p "$zip" >> "$target"
            bytes="$(stat -c '%s' "$zip")"
            rows="$(unzip -p "$zip" | wc -l)"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$kind" "$symbol" "$INTERVAL" "$period" "$url" "$actual" "$bytes" "$rows" >> "$manifest"
            rm -f "$zip" "$checksum"
          }

          fetch_symbol() {
            local symbol="$1"
            local manifest="work/manifests/${symbol}.tsv"
            local missing="work/missing/${symbol}.tsv"
            printf 'kind\tsymbol\tinterval\tperiod\turl\tsha256\tzip_bytes\trows\n' > "$manifest"
            printf 'kind\tsymbol\tperiod\turl\n' > "$missing"
            : > "work/raw/klines/${symbol}.csv"
            : > "work/raw/metrics/${symbol}.csv"
            : > "work/raw/funding/${symbol}.csv"

            local month=2025-01
            while [[ "$month" != 2026-08 ]]; do
              fetch_required klines "$symbol" "$month" "$BASE/monthly/klines/$symbol/$INTERVAL/${symbol}-${INTERVAL}-${month}.zip" "work/raw/klines/${symbol}.csv" "$manifest"
              fetch_required funding "$symbol" "$month" "$BASE/monthly/fundingRate/$symbol/${symbol}-fundingRate-${month}.zip" "work/raw/funding/${symbol}.csv" "$manifest"
              month="$(date -u -d "${month}-01 +1 month" +%Y-%m)"
            done

            local date=2025-01-01
            while [[ "$date" != 2026-08-01 ]]; do
              fetch_optional metrics "$symbol" "$date" "$BASE/daily/metrics/$symbol/${symbol}-metrics-${date}.zip" "work/raw/metrics/${symbol}.csv" "$manifest" "$missing"
              date="$(date -u -d "$date +1 day" +%Y-%m-%d)"
            done
          }

          for symbol in "${SYMBOLS[@]}"; do fetch_symbol "$symbol" & done
          wait

          head -n 1 work/manifests/AAVEUSDT.tsv > work/SOURCE_MANIFEST.tsv
          for symbol in "${SYMBOLS[@]}"; do tail -n +2 "work/manifests/${symbol}.tsv" >> work/SOURCE_MANIFEST.tsv; done
          head -n 1 work/missing/AAVEUSDT.tsv > work/MISSING_SOURCES.tsv
          for symbol in "${SYMBOLS[@]}"; do tail -n +2 "work/missing/${symbol}.tsv" >> work/MISSING_SOURCES.tsv; done

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import csv,json

          symbols=['AAVEUSDT','ATOMUSDT','ETCUSDT','FILUSDT','UNIUSDT']
          meta={
            'source':'Binance Public Data / data.binance.vision',
            'market':'futures/um','contract':'perpetual','quote':'USDT','interval':'15m',
            'start_utc':'2025-01-01T00:00:00Z','end_utc_inclusive':'2026-07-31T23:45:00Z',
            'symbols':symbols,'series':{},'quality':{}
          }

          def parse_ts(kind, value):
            if kind in ('klines','funding'):
              return int(value)
            dt=datetime.strptime(value,'%Y-%m-%d %H:%M:%S').replace(tzinfo=timezone.utc)
            return int(dt.timestamp()*1000)

          def data_rows(path, kind):
            rows=0; headers=0; first=None; final=None; prev=None; dup=0; backwards=0; seen=set(); incomplete=0
            expected_cols={'klines':12,'metrics':8,'funding':3}[kind]
            with path.open(newline='',errors='strict') as f:
              for row in csv.reader(f):
                if not row: continue
                try:
                  ts=parse_ts(kind,row[0])
                except (ValueError,IndexError):
                  headers+=1; continue
                if len(row) < expected_cols or any(x == '' for x in row[:expected_cols]):
                  incomplete+=1; continue
                if ts in seen: dup+=1
                seen.add(ts)
                if first is None or ts < first: first=ts
                if final is None or ts > final: final=ts
                if prev is not None and ts < prev: backwards+=1
                prev=ts; rows+=1
            return {'rows':rows,'header_rows':headers,'incomplete_rows':incomplete,
                    'first_timestamp':first,'last_timestamp':final,
                    'duplicate_timestamps':dup,'backwards_timestamps':backwards}

          for sym in symbols:
            meta['series'][sym]={}
            for kind in ['klines','metrics','funding']:
              meta['series'][sym][kind]=data_rows(Path('work/raw')/kind/f'{sym}.csv',kind)

          missing=[]
          with Path('work/MISSING_SOURCES.tsv').open() as f:
            next(f,None)
            for line in f:
              line=line.rstrip('\n')
              if line: missing.append(line.split('\t'))
          meta['quality']['missing_source_files']=len(missing)
          meta['quality']['missing_entries']=missing
          meta['quality']['note']='Official USD-M metrics archives may contain source-side gaps, repeated headers, incomplete rows, or physical out-of-order observations. cquant validates timestamps, sorts complete metric observations by embedded UTC timestamp, and enforces maximum staleness without forward-filling missing values.'
          Path('work/DATASET_METADATA.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY

          (cd work && sha256sum raw/klines/*.csv raw/metrics/*.csv raw/funding/*.csv SOURCE_MANIFEST.tsv MISSING_SOURCES.tsv DATASET_METADATA.json > DATASET_MANIFEST.sha256)
          cp work/SOURCE_MANIFEST.tsv work/MISSING_SOURCES.tsv work/DATASET_METADATA.json work/DATASET_MANIFEST.sha256 out/
          tar -C work -czf out/cquant-binance-um-golden-derivatives-20250101-20260731.tar.gz raw SOURCE_MANIFEST.tsv MISSING_SOURCES.tsv DATASET_METADATA.json DATASET_MANIFEST.sha256
          (cd out && sha256sum cquant-binance-um-golden-derivatives-20250101-20260731.tar.gz > cquant-binance-um-golden-derivatives-20250101-20260731.tar.gz.sha256)
          size="$(stat -c '%s' out/cquant-binance-um-golden-derivatives-20250101-20260731.tar.gz)"
          echo "archive-bytes=$size"
          test "$size" -lt 500000000

      - name: Upload Golden derivatives dataset artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: cquant-binance-um-golden-derivatives-20250101-20260731
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 400

      - name: Record artifact metadata and cache entry
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > /tmp/artifact.json
          mkdir -p artifact-markers
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          api=json.loads(Path('/tmp/artifact.json').read_text())
          archive=Path('out/cquant-binance-um-golden-derivatives-20250101-20260731.tar.gz')
          version='2025-01-01_2026-07-31-15m-um-golden-derivatives-v1'
          marker={
            'dataset_name':'cquant Binance USD-M Golden Derivatives', 'version':version,
            'platform':'Any','architecture':'Any',
            'workflow':'.github/workflows/fetch-cquant-binance-um-golden-derivatives-20250101-20260731.yml',
            'run_id':int(os.environ['GITHUB_RUN_ID']), 'artifact_id':api['id'],
            'artifact_name':api['name'], 'artifact_size_in_bytes':api['size_in_bytes'],
            'artifact_digest':api.get('digest'), 'created_at':api['created_at'], 'expires_at':api['expires_at'],
            'original_file':archive.name,'original_size':archive.stat().st_size,
            'original_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
            'part_count':1,'storage_mode':'SINGLE'
          }
          Path('artifact-markers/cquant-binance-um-golden-derivatives-20250101-20260731.json').write_text(json.dumps(marker,indent=2)+'\n')

          cache_path=Path('ARTIFACT_CACHE.md')
          cache=cache_path.read_text()
          name='cquant Binance USD-M Golden Derivatives'
          row=f'| {name} | {version} | Any | Any | `{marker["run_id"]}` | SINGLE | `{marker["expires_at"]}` |\n'
          if version not in cache:
            idx=cache.find('\n\n## ',cache.find('## Index'))
            cache=cache[:idx]+row+cache[idx:]
            sums=[]
            for line in Path('work/DATASET_MANIFEST.sha256').read_text().splitlines():
              sha,path=line.split(None,1); sums.append((path.strip(),sha))
            section=['',f'## {name} 2025-01-01 to 2026-07-31','',
              f'- Workflow: `{marker["workflow"]}`',f'- Run ID: `{marker["run_id"]}`',
              '- Source: `https://data.binance.vision/data/futures/um/...`',
              '- Dataset: Binance Public Data, USD-M perpetual 15m Klines + daily metrics + monthly funding rate',
              '- Symbols: `AAVEUSDT ATOMUSDT ETCUSDT FILUSDT UNIUSDT`',
              '- Range: `2025-01-01` through `2026-07-31`',
              '- Frozen use: external Golden universe for protocol `short-only-ridge40-wf-v1`',
              '- Requested Retention: `400 days`','- Storage Mode: `SINGLE`',
              f'- Artifact Name: `{marker["artifact_name"]}`',f'- Artifact ID: `{marker["artifact_id"]}`',
              f'- Artifact Size: `{marker["artifact_size_in_bytes"]}` bytes',f'- Artifact Digest: `{marker["artifact_digest"]}`',
              f'- Original File: `{marker["original_file"]}`',f'- Original Size: `{marker["original_size"]}` bytes',
              f'- Original SHA256: `{marker["original_sha256"]}`','- Part Count: `1`',
              f'- Created At: `{marker["created_at"]}`',f'- Expires At: `{marker["expires_at"]}`','',
              '### Contents','', '| Name | Version | Platform | Architecture | File/Path | SHA256 |',
              '|---|---|---|---|---|---|']
            for path,sha in sums:
              if path.startswith('raw/'):
                section.append(f'| {name} | {version} | Any | Any | `{path}` | `{sha}` |')
            section += ['', '### Artifact','',
              '| Part | Artifact ID | Artifact Name | Original Size | Original SHA256 | Artifact Size | Artifact Digest | Created At | Expires At |',
              '|---:|---:|---|---:|---|---:|---|---|---|',
              f'| 1/1 | `{marker["artifact_id"]}` | `{marker["artifact_name"]}` | `{marker["original_size"]}` | `{marker["original_sha256"]}` | `{marker["artifact_size_in_bytes"]}` | `{marker["artifact_digest"]}` | `{marker["created_at"]}` | `{marker["expires_at"]}` |','',
              '### Restore','', 'Download the single Artifact, verify the inner tar.gz SHA256, extract it, then run `sha256sum -c DATASET_MANIFEST.sha256`.','']
            cache += '\n'.join(section)
            cache_path.write_text(cache)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifact-markers/cquant-binance-um-golden-derivatives-20250101-20260731.json ARTIFACT_CACHE.md
          git commit -m 'Record frozen cquant Golden USD-M derivatives artifact'
          git pull --rebase origin main
          git push origin HEAD:main
