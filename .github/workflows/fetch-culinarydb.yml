name: Fetch CulinaryDB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-culinarydb.yml'

permissions:
  contents: read

env:
  SOURCE_URL: https://cosylab.iiitd.edu.in/culinarydb/static/data/CulinaryDB.zip
  SOURCE_FILE: CulinaryDB.zip
  ARTIFACT_NAME: culinarydb-2017-csv

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download CulinaryDB official data bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 "$SOURCE_URL" -o "$SOURCE_FILE"
          sha256sum "$SOURCE_FILE" | tee SHA256SUMS.txt
          stat -c '%n %s bytes' "$SOURCE_FILE"
          unzip -l "$SOURCE_FILE" | tee CONTENTS.txt

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.SOURCE_FILE }}
            SHA256SUMS.txt
            CONTENTS.txt
          compression-level: 0
          retention-days: 400
          if-no-files-found: error
