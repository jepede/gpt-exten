name: Temporary GG History Fetch

on:
  push:
    paths:
      - .github/workflows/fetch-gg-history.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect second-stage redirects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          p='https://uoldown.com/android/gameguardian/download/71649'
          curl -fL --retry 4 -A "$ua" -o artifact/uoldown-stage1.html "$p"
          d=$(python3 - <<'PY'
          import html,re
          s=html.unescape(open('artifact/uoldown-stage1.html',errors='ignore').read()).replace('\\/','/')
          m=re.search(r'id=["\']download-button["\'][^>]*data-url=["\']([^"\']+)',s,re.I)
          print(m.group(1) if m else '')
          PY
          )
          echo "stage1 data-url=$d"
          curl -fL --retry 4 -A "$ua" -e "$p" -D artifact/uoldown-stage2-headers.txt -o artifact/uoldown-stage2.html "$d"
          curl -fL --retry 4 -A "$ua" -D artifact/official-headers.txt -o artifact/official.html https://gameguardian.net/download

          python3 - <<'PY'
          import html,re
          for fn in ['artifact/uoldown-stage2.html','artifact/official.html']:
              s=html.unescape(open(fn,errors='ignore').read()).replace('\\/','/')
              print('\n===',fn,'bytes',len(s),'===')
              for m in re.finditer(r'<[^>]+>',s):
                  tag=m.group(0)
                  lo=tag.lower()
                  if any(k in lo for k in ('download','data-url','data-href','onclick','location','refresh','.apk','action=')):
                      print(tag[:4000])
              print('--- URLs ---')
              vals=[]
              for m in re.finditer(r'https?://[^\s"\'<>]+',s,re.I):
                  u=m.group(0)
                  if any(k in u.lower() for k in ('apk','download','/dwn/','file','gameguardian')):
                      vals.append(u)
              for u in dict.fromkeys(vals): print(u)
          PY

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: gg-second-stage-inspection
          path: artifact/
          if-no-files-found: error
          retention-days: 1
