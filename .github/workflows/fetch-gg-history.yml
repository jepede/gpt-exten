name: Temporary GG History Fetch

on:
  push:
    paths:
      - .github/workflows/fetch-gg-history.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official historical APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact work
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          base='https://gameguardian.net/forum/files/file/2-gameguardian/'
          curl -fLsS --retry 5 --retry-delay 2 -A "$ua" -c work/cookies.txt -o work/base.html "$base"
          csrf=$(grep -oE 'csrfKey=[0-9a-f]+' work/base.html | head -1 | cut -d= -f2)
          test -n "$csrf"
          echo "Session initialized."

          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -1 || true)
          echo "AAPT=${AAPT:-unavailable}"

          valid_apk() {
            local f="$1"
            unzip -t "$f" >/dev/null 2>&1 || return 1
            unzip -Z1 "$f" | grep -Fx 'AndroidManifest.xml' >/dev/null || return 1
            return 0
          }

          extract_links() {
            local f="$1"
            python3 - "$f" <<'PY'
          import html,re,sys,urllib.parse
          s=html.unescape(open(sys.argv[1],encoding='utf-8',errors='ignore').read()).replace('\\/','/')
          base='https://gameguardian.net/forum/files/file/2-gameguardian/'
          out=[]
          for m in re.finditer(r'href=["\']([^"\']+)',s,re.I):
              u=urllib.parse.urljoin(base,m.group(1))
              lo=u.lower()
              if 'do=download' in lo and ('&r=' in lo or '?r=' in lo or 'confirm=1' in lo) and u not in out:
                  out.append(u)
          for u in out: print(u)
          PY
          }

          fetch_version() {
            local ver="$1" vid="$2"
            local out="artifact/GameGuardian-${ver}.apk"
            local first
            if [ "$vid" = current ]; then
              first="${base}?do=download&confirm=1&csrfKey=${csrf}"
            else
              first="${base}?do=download&confirm=1&version=${vid}&csrfKey=${csrf}"
            fi
            echo "=== Fetch ${ver} (version record ${vid}) ==="
            curl -fLsS --retry 5 --retry-delay 2 -A "$ua" -b work/cookies.txt -c work/cookies.txt \
              -e "$base" -D "work/${ver}.headers" -o "work/${ver}.first" "$first"
            if valid_apk "work/${ver}.first"; then
              mv "work/${ver}.first" "$out"
            else
              echo "First response is not APK; checking official file-selection links."
              mapfile -t links < <(extract_links "work/${ver}.first")
              got=0
              n=0
              for link in "${links[@]}"; do
                n=$((n+1))
                cand="work/${ver}.candidate-${n}"
                echo "candidate[$n]=$link"
                curl -fLsS --retry 4 --retry-delay 2 -A "$ua" -b work/cookies.txt -c work/cookies.txt \
                  -e "$first" -o "$cand" "$link" || continue
                if valid_apk "$cand"; then
                  mv "$cand" "$out"
                  got=1
                  break
                fi
              done
              if [ "$got" -ne 1 ]; then
                echo "ERROR: could not resolve APK for ${ver}"
                file "work/${ver}.first" || true
                wc -c "work/${ver}.first" || true
                python3 - "work/${ver}.first" <<'PY'
          import html,re,sys
          s=html.unescape(open(sys.argv[1],errors='ignore').read())
          t=re.sub(r'<[^>]+>',' ',s)
          t=re.sub(r'\s+',' ',t)
          print(t[:3000])
          PY
                return 1
              fi
            fi

            sha=$(sha256sum "$out" | awk '{print $1}')
            size=$(stat -c %s "$out")
            pkg=''; actual=''
            if [ -n "$AAPT" ]; then
              badging=$("$AAPT" dump badging "$out" 2>/dev/null | head -1 || true)
              pkg=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
              actual=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$ver" "$vid" "$(basename "$out")" "$size" "$sha" "$pkg" "$actual" >> artifact/MANIFEST.tsv
            echo "OK ${ver}: size=${size} sha256=${sha} package=${pkg:-?} versionName=${actual:-?}"
          }

          printf 'RequestedVersion\tOfficialVersionRecord\tFile\tSize\tSHA256\tPackage\tDetectedVersionName\n' > artifact/MANIFEST.tsv
          while read -r ver vid; do
            fetch_version "$ver" "$vid"
          done <<'EOF'
          90.0 5108
          91.0 5120
          92.0 5217
          93.0 5229
          94.0 5247
          95.0 5315
          96.0 5340
          96.1 5447
          97.0 5480
          98.0 5486
          99.0 5831
          100.0 6030
          101.0 6370
          101.1 current
          EOF

          (cd artifact && sha256sum GameGuardian-*.apk | sort -V > SHA256SUMS.txt)
          echo '=== MANIFEST ==='
          cat artifact/MANIFEST.tsv
          echo '=== SHA256SUMS ==='
          cat artifact/SHA256SUMS.txt
          du -sh artifact

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameguardian-official-90-101-apks
          path: artifact/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
