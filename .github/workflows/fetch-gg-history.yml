name: Temporary GG History Fetch

on:
  push:
    paths:
      - .github/workflows/fetch-gg-history.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect historical download page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl -fL --retry 5 --retry-delay 2 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -D artifact/headers.txt \
            -o artifact/page90.html \
            https://uoldown.com/android/gameguardian/download/71649
          file artifact/page90.html
          wc -c artifact/page90.html
          echo '=== headers ==='
          cat artifact/headers.txt
          echo '=== candidate links ==='
          python3 - <<'PY'
          import html, re
          s = open('artifact/page90.html', encoding='utf-8', errors='ignore').read()
          s = html.unescape(s).replace('\\/', '/')
          pats = [
              r'https?://[^\s"\'<>]+',
              r'(?:href|src|action|data-url|data-href)\s*=\s*["\']([^"\']+)',
          ]
          vals=[]
          for p in pats:
              for m in re.finditer(p, s, re.I):
                  v = m.group(1) if m.lastindex else m.group(0)
                  if any(x in v.lower() for x in ('apk','download','gameguardian','file','cdn')):
                      vals.append(v)
          for v in dict.fromkeys(vals):
              print(v)
          print('=== lines containing apk/download ===')
          for line in s.splitlines():
              if re.search(r'apk|download', line, re.I):
                  print(line[:2000])
          PY

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: gg-history-inspection
          path: artifact/
          if-no-files-found: error
          retention-days: 1
