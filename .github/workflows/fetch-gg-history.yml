name: Temporary GG History Fetch

on:
  push:
    paths:
      - .github/workflows/fetch-gg-history.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official version endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          base='https://gameguardian.net/forum/files/file/2-gameguardian/'
          curl -fLsS -A "$ua" -c artifact/cookies.txt -D artifact/base.headers -o artifact/base.html "$base"
          csrf=$(grep -oE 'csrfKey=[0-9a-f]+' artifact/base.html | head -1 | cut -d= -f2)
          echo "csrf=$csrf"

          curl -fLsS -A "$ua" -b artifact/cookies.txt -c artifact/cookies.txt \
            -e "$base" -H 'X-Requested-With: XMLHttpRequest' \
            -D artifact/download-dialog.headers -o artifact/download-dialog.html \
            "${base}?do=download"

          for pair in '101.0 6370' '100.0 6030' '90.0 5108'; do
            set -- $pair; ver=$1; id=$2
            curl -fLsS -A "$ua" -b artifact/cookies.txt -e "$base" \
              -D "artifact/changelog-${ver}.headers" -o "artifact/changelog-${ver}.html" \
              "${base}?changelog=${id}"
            for kind in id hash; do
              val="$id"
              case "$ver" in
                101.0) hash='74e37e9a80c754208a9fd717362b8c62';;
                100.0) hash='cd3cddd07f925e39c9d551adf6e54a7b';;
                90.0) hash='c09bd36ca8c5084d4ccea84fea55388f';;
              esac
              [ "$kind" = hash ] && val="$hash"
              url="${base}?do=download&version=${val}&csrfKey=${csrf}"
              curl -LsS -A "$ua" -b artifact/cookies.txt -e "${base}?changelog=${id}" \
                -D "artifact/try-${ver}-${kind}.headers" -o "artifact/try-${ver}-${kind}.body" "$url" || true
            done
          done

          python3 - <<'PY'
          from pathlib import Path
          import html,re,zipfile
          root=Path('artifact')
          for p in sorted(root.glob('*.html'))+sorted(root.glob('*.body')):
              b=p.read_bytes()
              print(f'\n=== {p.name} {len(b)} bytes magic={b[:12]!r} ===')
              try:
                  s=html.unescape(b.decode('utf-8','ignore')).replace('\\/','/')
              except Exception:
                  s=''
              vals=[]
              for pat in [r'https?://[^\s"\'<>]+', r'href=["\']([^"\']+)', r'action=["\']([^"\']+)']:
                  for m in re.finditer(pat,s,re.I):
                      v=m.group(1) if m.lastindex else m.group(0)
                      if any(x in v.lower() for x in ('do=download','version=','confirm=','&r=','?r=','.apk')) and v not in vals:
                          vals.append(v)
              for v in vals[:80]: print(v[:2000])
              for pat in [r'(?i)versionTitle[^<]*>\s*([^<]+)', r'(?i)data-changelogTitle=["\']([^"\']+)', r'(?i)(?:error|sorry|permission|not available)[^<]{0,200}']:
                  mm=re.findall(pat,s)
                  if mm: print('MATCH',pat,mm[:20])
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: gg-official-version-probe
          path: artifact/
          retention-days: 1
          if-no-files-found: error
