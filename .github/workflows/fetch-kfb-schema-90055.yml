name: Fetch KFB Schema 90055
on:
  push:
    branches:
      - main
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch schema tools
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/DianSuWitss/kfb-assetbundle-decrypt/main/kfb/05_tools"
          curl -fL --retry 3 "$base/kfb_schema.json" -o kfb_schema.json
          curl -fL --retry 3 "$base/kfb_schema_decoder.js" -o kfb_schema_decoder.js
          curl -fL --retry 3 "$base/kfb_readable_adapter.js" -o kfb_readable_adapter.js
          curl -fL --retry 3 "$base/kfb_dump_layout.json" -o kfb_dump_layout.json
          sha256sum kfb_schema.json kfb_schema_decoder.js kfb_readable_adapter.js kfb_dump_layout.json > SHA256SUMS.txt
          wc -c kfb_schema.json kfb_schema_decoder.js kfb_readable_adapter.js kfb_dump_layout.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kfb-schema-tools-90055
          path: |
            kfb_schema.json
            kfb_schema_decoder.js
            kfb_readable_adapter.js
            kfb_dump_layout.json
            SHA256SUMS.txt
          retention-days: 1
