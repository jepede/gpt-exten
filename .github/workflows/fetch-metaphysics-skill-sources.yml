name: Fetch Metaphysics Skill Sources

on:
  push:
    paths:
      - '.github/workflows/fetch-metaphysics-skill-sources.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch permissive skill sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/core bundle/engines

          clone_record() {
            local url="$1" dst="$2" group="$3"
            echo "==> $url"
            git clone --depth=1 --filter=blob:none "$url" "$dst"
            local sha
            sha="$(git -C "$dst" rev-parse HEAD)"
            printf '%s\t%s\t%s\n' "$url" "$sha" "$dst" >> "bundle/${group}/SOURCE_LOCK.tsv"
            rm -rf "$dst/.git"
          }

          # Agent/Skill sources (MIT or explicitly marked MIT upstream)
          clone_record https://github.com/mingze21/bazi-ziwei-skill.git bundle/core/bazi-ziwei-skill core
          clone_record https://github.com/TheCrazyAnt/bazi-ziwei.git bundle/core/bazi-ziwei core
          clone_record https://github.com/ZYC-teo/yanpan-suanming.git bundle/core/yanpan-suanming core
          clone_record https://github.com/clider0915/divination-skills.git bundle/core/divination-skills core
          clone_record https://github.com/weizeW/mingli-skills.git bundle/core/mingli-skills core
          clone_record https://github.com/yangzeze1292/chinese-metaphysics-skill.git bundle/core/chinese-metaphysics-skill core

          # Deterministic chart/calendar engines and architecture references
          clone_record https://github.com/SylarLong/iztro.git bundle/engines/iztro engines
          clone_record https://github.com/6tail/lunar-python.git bundle/engines/lunar-python engines
          clone_record https://github.com/tradecatlabs/fatecat.git bundle/engines/fatecat engines

          for group in core engines; do
            bytes="$(du -sb "bundle/$group" | awk '{print $1}')"
            echo "$bytes" > "bundle/$group/RAW_BYTES.txt"
            if [ "$bytes" -ge 480000000 ]; then
              echo "bundle/$group is too large for a safe <512MB artifact: $bytes bytes" >&2
              exit 1
            fi
            (
              cd "bundle/$group"
              find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            )
          done

          echo 'Core bytes:' "$(cat bundle/core/RAW_BYTES.txt)"
          echo 'Engine bytes:' "$(cat bundle/engines/RAW_BYTES.txt)"
          echo 'Core source locks:'
          cat bundle/core/SOURCE_LOCK.tsv
          echo 'Engine source locks:'
          cat bundle/engines/SOURCE_LOCK.tsv

      - name: Upload core skill sources
        uses: actions/upload-artifact@v4
        with:
          name: metaphysics-skill-sources-core
          path: bundle/core/
          retention-days: 1
          compression-level: 6
          include-hidden-files: true

      - name: Upload engine sources
        uses: actions/upload-artifact@v4
        with:
          name: metaphysics-skill-sources-engines
          path: bundle/engines/
          retention-days: 1
          compression-level: 6
          include-hidden-files: true
