name: Fetch Naruto Mobile via Tencent App Store

on:
  push:
    branches:
      - 'tmp/fetch-naruto-20261001'
    paths:
      - '.github/workflows/fetch-naruto-tencent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PACKAGE_NAME: com.tencent.KiHan
      EXPECTED_VERSION: 1.79.79.9
    steps:
      - name: Resolve Tencent official APK URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p meta
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 90 -A "$UA"             "https://sj.qq.com/appdetail/$PACKAGE_NAME" -o meta/sj-detail.html
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 90 -A "$UA"             "https://a.app.qq.com/o/simple.jsp?pkgname=$PACKAGE_NAME" -o meta/simple.html || true

          python3 - <<'PY'
          import json,re,html as h, pathlib
          urls=[]
          versions=[]
          def add(v):
              if isinstance(v,str):
                  s=h.unescape(v).replace('\\u0026','&').replace('\\/','/')
                  if '.apk' in s.lower() and s.startswith(('http://','https://')):
                      urls.append(s)
                  if re.fullmatch(r'\d+(?:\.\d+){2,4}', s):
                      versions.append(s)
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      lk=str(k).lower()
                      if isinstance(v,str) and ('apk' in lk or 'version' in lk or 'url' in lk):
                          add(v)
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
              elif isinstance(x,str):
                  add(x)
          for fn in ('meta/sj-detail.html','meta/simple.html'):
              p=pathlib.Path(fn)
              if not p.exists(): continue
              s=p.read_text('utf-8','ignore')
              print(f'--- {fn} bytes={len(s)} ---')
              for m in re.finditer(r'https?://[^"\'<>\\ ]+?\.apk(?:\?[^"\'<>\\ ]*)?', s, re.I):
                  add(m.group(0))
              m=re.search(r'(?s)<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>',s)
              if m:
                  try:
                      j=json.loads(h.unescape(m.group(1)))
                      walk(j)
                      pathlib.Path('meta/next-data.json').write_text(json.dumps(j,ensure_ascii=False,indent=2),'utf-8')
                  except Exception as e:
                      print('NEXT_DATA parse error:',repr(e))
          out=[]
          for u in urls:
              if u not in out: out.append(u)
          print('versions=', sorted(set(versions)))
          print('apk candidates:')
          for u in out: print(u)
          pathlib.Path('meta/candidates.txt').write_text('\n'.join(out)+'\n','utf-8')
          if not out:
              raise SystemExit(42)
          # Only accept the target game package; never select the App Store installer.
          target=[u for u in out if 'com.tencent.kihan_' in u.lower()]
          if not target:
              raise SystemExit('No com.tencent.KiHan APK candidate found')
          preferred=[u for u in target if ('1079079009' in u or '1.79.79.9' in u)]
          chosen=(preferred or target)[0]
          pathlib.Path('meta/source.env').write_text('SOURCE_URL='+chosen+'\n','utf-8')
          print('chosen=',chosen)
          PY
          cat meta/source.env >> "$GITHUB_ENV"

      - name: Download APK from Tencent CDN
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          echo "Downloading from $SOURCE_URL"
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 20             --speed-time 120 --speed-limit 1024 -A "$UA" "$SOURCE_URL" -o naruto-latest.apk
          test "$(stat -c%s naruto-latest.apk)" -gt 500000000
          file naruto-latest.apk | tee meta/file.txt
          unzip -tqq naruto-latest.apk
          sha256sum naruto-latest.apk | tee meta/SHA256SUMS.txt
          md5sum naruto-latest.apk | tee meta/MD5SUMS.txt
          stat -c 'sizeBytes=%s' naruto-latest.apk | tee meta/size.txt

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -111 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$AAPT" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq aapt
            AAPT="$(command -v aapt)"
          fi
          "$AAPT" dump badging naruto-latest.apk | tee meta/badging.txt
          pkg=$("$AAPT" dump badging naruto-latest.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)
          ver=$("$AAPT" dump badging naruto-latest.apk | sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" | head -n1)
          vcode=$("$AAPT" dump badging naruto-latest.apk | sed -n "s/^package: .* versionCode='\([^']*\)'.*/\1/p" | head -n1)
          test "$pkg" = "$PACKAGE_NAME"
          test "$ver" = "$EXPECTED_VERSION"
          {
            echo "package=$pkg"
            echo "versionName=$ver"
            echo "versionCode=$vcode"
            echo "sizeBytes=$(stat -c%s naruto-latest.apk)"
            echo "sha256=$(cut -d' ' -f1 meta/SHA256SUMS.txt)"
            echo "md5=$(cut -d' ' -f1 meta/MD5SUMS.txt)"
          } | tee meta/verified.txt

      - name: Split to 400 MiB artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts
          split -b 400M -d -a 2 naruto-latest.apk parts/naruto-1.79.79.9.apk.part.
          sha256sum parts/* | tee meta/PART_SHA256SUMS.txt
          cat parts/naruto-1.79.79.9.apk.part.* | sha256sum | tee meta/recombined-SHA256.txt
          test "$(cut -d' ' -f1 meta/recombined-SHA256.txt)" = "$(cut -d' ' -f1 meta/SHA256SUMS.txt)"
          find parts -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee meta/parts.txt

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: naruto-1.79.79.9-tencent-metadata
          path: meta/
          retention-days: 90
          compression-level: 6

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: naruto-1.79.79.9-apk-400m-part-00
          path: parts/naruto-1.79.79.9.apk.part.00
          retention-days: 90
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: naruto-1.79.79.9-apk-400m-part-01
          path: parts/naruto-1.79.79.9.apk.part.01
          retention-days: 90
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: naruto-1.79.79.9-apk-400m-part-02
          path: parts/naruto-1.79.79.9.apk.part.02
          retention-days: 90
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: naruto-1.79.79.9-apk-400m-part-03
          path: parts/naruto-1.79.79.9.apk.part.03
          retention-days: 90
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: naruto-1.79.79.9-apk-400m-part-04
          path: parts/naruto-1.79.79.9.apk.part.04
          retention-days: 90
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: naruto-1.79.79.9-apk-400m-part-05
          path: parts/naruto-1.79.79.9.apk.part.05
          retention-days: 90
          compression-level: 0
          if-no-files-found: ignore
