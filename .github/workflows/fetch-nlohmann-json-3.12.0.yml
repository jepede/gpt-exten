name: Fetch nlohmann json 3.12.0

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-nlohmann-json-3.12.0.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download single header
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl -fL --retry 5 --retry-delay 2 \
            -o artifact/json.hpp \
            https://raw.githubusercontent.com/nlohmann/json/v3.12.0/single_include/nlohmann/json.hpp
          (cd artifact && sha256sum json.hpp > SHA256SUMS.txt)
          stat -c 'json.hpp size=%s' artifact/json.hpp
          cat artifact/SHA256SUMS.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nlohmann-json-3.12.0-header
          path: artifact/
          if-no-files-found: error
          retention-days: 400
