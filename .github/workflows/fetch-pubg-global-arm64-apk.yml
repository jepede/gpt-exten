name: Sync PUBG Global ARM64 libUE4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fetch-pubg-global-arm64-apk.yml"

permissions:
  contents: write

env:
  RELEASE_TAG: v1.0.1

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install HTML parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/pubg-fetch out
          cd .tmp/pubg-fetch
          bun init -y >/dev/null
          bun add cheerio@1.1.2

      - name: Resolve latest PUBG Global ARM64 version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          cat > .tmp/pubg-fetch/resolve.ts <<'EOF'
          import { load } from "cheerio";

          const BASE = "https://www.apkmirror.com";
          const APP_URL =
            BASE + "/apk/level-infinite/playerunknowns-battlegrounds-pubg-mobile/";

          function absolute(href: string) {
            return new URL(href, BASE).href;
          }

          async function fetchText(url: string) {
            const r = await fetch(url);
            if (!r.ok) {
              throw new Error(`GET ${url} -> HTTP ${r.status}`);
            }

            const text = await r.text();
            if (
              text.includes("Enable JavaScript and cookies to continue") ||
              text.includes("cf-chl-")
            ) {
              throw new Error("APKMirror returned a Cloudflare challenge");
            }

            return { text, finalUrl: r.url };
          }

          function resolveLatestRelease(html: string) {
            const $ = load(html);
            const table = $('.listWidget:has(a[name="all_versions"])').first();
            if (!table.length) {
              throw new Error("APKMirror all_versions table not found");
            }

            for (const row of table.children().toArray().slice(2, -1)) {
              const a = $(row).find(".table-cell").eq(1).find("a").first();
              const name = a.text().replace(/\s+/g, " ").trim();
              const href = a.attr("href");
              if (!name || !href) continue;
              if (!/^PUBG MOBILE\s+\d/i.test(name)) continue;
              return { name, url: absolute(href) };
            }

            throw new Error("Latest PUBG MOBILE release could not be resolved");
          }

          function resolveArm64Bundle(html: string) {
            const $ = load(html);
            const table = $(".variants-table").first();
            if (!table.length) {
              throw new Error("APKMirror variants table not found");
            }

            for (const row of table.children().toArray().slice(1)) {
              const cells = $(row).find(".table-cell");
              if (cells.length < 4) continue;

              const first = cells.eq(0);
              const href = first.find("a").first().attr("href");
              if (!href) continue;

              const label = first.text().replace(/\s+/g, " ").trim();
              const arch = cells.eq(1).text().replace(/\s+/g, " ").trim();
              const minAndroid = cells.eq(2).text().replace(/\s+/g, " ").trim();
              const dpi = cells.eq(3).text().replace(/\s+/g, " ").trim();

              if (
                arch === "arm64-v8a" &&
                /BUNDLE/i.test(label) &&
                /OBB/i.test(label)
              ) {
                return {
                  url: absolute(href),
                  label,
                  arch,
                  minAndroid,
                  dpi,
                };
              }
            }

            throw new Error("Dedicated arm64-v8a OBB bundle row not found");
          }

          const app = await fetchText(APP_URL);
          const latest = resolveLatestRelease(app.text);

          const release = await fetchText(latest.url);
          const variant = resolveArm64Bundle(release.text);

          const detail = await fetchText(variant.url);
          const detailText = load(detail.text)("body")
            .text()
            .replace(/\s+/g, " ");

          const m = detailText.match(
            /Version:\s*([0-9.]+)\s*\((\d+)\)/,
          );
          if (!m) {
            throw new Error("versionName/versionCode could not be parsed");
          }

          if (!detailText.includes("Package: com.tencent.ig")) {
            throw new Error("Resolved page is not PUBG Global com.tencent.ig");
          }

          const versionName = m[1];
          const versionCode = m[2];
          const parts = versionName.split(".");
          const shortVersion =
            parts.length >= 2 ? `${parts[0]}.${parts[1]}` : versionName;

          const resolved = {
            packageName: "com.tencent.ig",
            versionName,
            versionCode,
            shortVersion,
            latest,
            variant,
          };

          await Bun.write(
            "../../out/resolved.json",
            JSON.stringify(resolved, null, 2),
          );
          console.log(JSON.stringify(resolved, null, 2));
          EOF

          cd .tmp/pubg-fetch
          for attempt in 1 2 3 4 5; do
            echo "Resolve attempt: ${attempt}/5"
            if bun run resolve.ts; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi
            sleep 3
          done
          cd ../..

          python3 - <<'PY'
          import json
          import os

          with open("out/resolved.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          outputs = {
              "package_name": data["packageName"],
              "version_name": data["versionName"],
              "version_code": data["versionCode"],
              "short_version": data["shortVersion"],
              "variant_url": data["variant"]["url"],
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for key, value in outputs.items():
                  f.write(f"{key}={value}\n")
          PY

      - name: Check existing v1.0.1 release asset
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          asset="libUE4-GL-${{ steps.resolve.outputs.short_version }}.so"

          gh release view "${RELEASE_TAG}"             --repo "${GITHUB_REPOSITORY}"             --json tagName >/dev/null

          gh release view "${RELEASE_TAG}"             --repo "${GITHUB_REPOSITORY}"             --json assets             --jq '.assets[].name' > out/release-assets-before.txt

          if grep -Fxq "${asset}" out/release-assets-before.txt; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Asset already exists: ${asset}"
            echo "Nothing to do."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "Asset missing: ${asset}"
          fi

          echo "asset_name=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Already synchronized
        if: steps.release_check.outputs.exists == 'true'
        shell: bash
        run: |
          echo "${{ steps.release_check.outputs.asset_name }} already exists in ${RELEASE_TAG}; exiting without downloading the APK."

      - name: Download latest ARM64 Base APK
        if: steps.release_check.outputs.exists != 'true'
        id: download
        shell: bash
        run: |
          set -euo pipefail

          cat > .tmp/pubg-fetch/download.ts <<'EOF'
          import { load } from "cheerio";
          import { mkdirSync, statSync } from "node:fs";

          const BASE = "https://www.apkmirror.com";

          function absolute(href: string) {
            return new URL(href, BASE).href;
          }

          async function fetchText(url: string) {
            const r = await fetch(url);
            if (!r.ok) {
              throw new Error(`GET ${url} -> HTTP ${r.status}`);
            }

            const text = await r.text();
            if (
              text.includes("Enable JavaScript and cookies to continue") ||
              text.includes("cf-chl-")
            ) {
              throw new Error("APKMirror returned a Cloudflare challenge");
            }

            return { text, finalUrl: r.url };
          }

          function resolveBaseApkLink(html: string) {
            const $ = load(html);
            let href: string | undefined;

            $("a.downloadButton").each((_, el) => {
              if (href) return;

              const a = $(el);
              const h = a.attr("href");
              const label = a.text().replace(/\s+/g, " ").trim();
              if (!h) return;

              if (
                h.includes("forcebaseapk=true") ||
                (/^Download APK\b/i.test(label) && !/Bundle/i.test(label))
              ) {
                href = absolute(h);
              }
            });

            if (!href) {
              throw new Error("Base APK download button was not found");
            }

            return href;
          }

          function resolveFinalDownload(html: string) {
            const $ = load(html);
            const href = $(".card-with-tabs a[href]").first().attr("href");
            if (!href) {
              throw new Error("Final APKMirror download URL not found");
            }
            return absolute(href);
          }

          const resolved = await Bun.file("../../out/resolved.json").json();
          const variantUrl = resolved.variant.url;
          const versionName = resolved.versionName;
          const versionCode = resolved.versionCode;

          const detail = await fetchText(variantUrl);
          const detailText = load(detail.text)("body")
            .text()
            .replace(/\s+/g, " ");

          if (!detailText.includes("Package: com.tencent.ig")) {
            throw new Error("Base APK page is not com.tencent.ig");
          }

          const basePage = resolveBaseApkLink(detail.text);
          const download = await fetchText(basePage);

          if (
            download.finalUrl.includes("thank_you_invalid_nonce") ||
            download.text.includes("The download link you clicked on has expired")
          ) {
            throw new Error("APKMirror Base APK nonce expired");
          }

          const finalUrl = resolveFinalDownload(download.text);

          const apk = await fetch(finalUrl);
          if (!apk.ok || !apk.body) {
            throw new Error(
              `Base APK download -> HTTP ${apk.status} ${apk.statusText}`,
            );
          }

          const contentType = apk.headers.get("content-type") ?? "";
          if (/text\/html/i.test(contentType)) {
            throw new Error("Expected APK bytes but received HTML");
          }

          mkdirSync("../../out", { recursive: true });
          const dest =
            `../../out/PUBG-MOBILE-Global-${versionName}-${versionCode}-arm64-v8a.apk`;

          await Bun.write(dest, apk);

          const size = statSync(dest).size;
          if (size < 20 * 1024 * 1024) {
            throw new Error(`Downloaded APK is unexpectedly small: ${size}`);
          }

          console.log(`${dest} ${size} bytes`);
          EOF

          cd .tmp/pubg-fetch
          for attempt in 1 2 3 4 5; do
            echo "Download attempt: ${attempt}/5"
            rm -f ../../out/PUBG-MOBILE-Global-*-arm64-v8a.apk
            if bun run download.ts; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi
            sleep 3
          done
          cd ../..

          apk="out/PUBG-MOBILE-Global-${{ steps.resolve.outputs.version_name }}-${{ steps.resolve.outputs.version_code }}-arm64-v8a.apk"
          test -f "${apk}"
          echo "apk_path=${apk}" >> "${GITHUB_OUTPUT}"

      - name: Verify APK and extract ARM64 libUE4.so
        if: steps.release_check.outputs.exists != 'true'
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          apk="${{ steps.download.outputs.apk_path }}"
          asset="${{ steps.release_check.outputs.asset_name }}"
          so="out/${asset}"
          entry="lib/arm64-v8a/libUE4.so"

          python3 - "${apk}" "${entry}" <<'PY'
          import sys
          import zipfile

          apk, entry = sys.argv[1], sys.argv[2]

          if not zipfile.is_zipfile(apk):
              raise SystemExit("Downloaded file is not a valid APK/ZIP")

          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              if "AndroidManifest.xml" not in names:
                  raise SystemExit("AndroidManifest.xml missing")
              if entry not in names:
                  raise SystemExit(f"{entry} not found in APK")

              abis = sorted({
                  name.split("/")[1]
                  for name in names
                  if name.startswith("lib/") and len(name.split("/")) >= 3
              })
              print("Native ABIs:", abis)

              if "arm64-v8a" not in abis:
                  raise SystemExit("arm64-v8a missing")
              if "armeabi-v7a" in abis:
                  raise SystemExit("Unexpected armeabi-v7a in ARM64 APK")
          PY

          AAPT="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt 2>/dev/null | sort -V | tail -n1)"
          test -n "${AAPT}"

          "${AAPT}" dump badging "${apk}" > out/aapt-badging.txt

          package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" out/aapt-badging.txt | head -n1)"
          version_code="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" out/aapt-badging.txt | head -n1)"
          version_name="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" out/aapt-badging.txt | head -n1)"

          [ "${package_name}" = "com.tencent.ig" ]
          [ "${version_name}" = "${{ steps.resolve.outputs.version_name }}" ]
          [ "${version_code}" = "${{ steps.resolve.outputs.version_code }}" ]

          unzip -p "${apk}" "${entry}" > "${so}"
          test -s "${so}"

          file "${so}"
          readelf -h "${so}" | tee out/libUE4-elf-header.txt

          readelf -h "${so}" | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h "${so}" | grep -Eq 'Machine:[[:space:]]+AArch64'

          sha256sum "${apk}" | tee out/APK_SHA256SUMS.txt
          sha256sum "${so}" | tee out/LIBUE4_SHA256SUMS.txt
          stat -c '%n %s bytes' "${apk}" "${so}" | tee out/FILE_SIZES.txt

          echo "so_path=${so}" >> "${GITHUB_OUTPUT}"

      - name: Upload libUE4 to v1.0.1 release
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          so="${{ steps.extract.outputs.so_path }}"
          asset="${{ steps.release_check.outputs.asset_name }}"

          if gh release upload "${RELEASE_TAG}" "${so}"               --repo "${GITHUB_REPOSITORY}"; then
            echo "Uploaded: ${asset}"
          else
            gh release view "${RELEASE_TAG}"               --repo "${GITHUB_REPOSITORY}"               --json assets               --jq '.assets[].name' > out/release-assets-race.txt

            if grep -Fxq "${asset}" out/release-assets-race.txt; then
              echo "Another run already uploaded ${asset}; treating as synchronized."
            else
              echo "Release upload failed and ${asset} is still absent." >&2
              exit 1
            fi
          fi

      - name: Verify release asset after upload
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          asset="${{ steps.release_check.outputs.asset_name }}"

          gh release view "${RELEASE_TAG}"             --repo "${GITHUB_REPOSITORY}"             --json assets             --jq '.assets[] | [.name, (.size|tostring), .url] | @tsv'             | tee out/release-assets-after.tsv

          cut -f1 out/release-assets-after.tsv | grep -Fxq "${asset}"

      - name: Upload APK/extraction verification artifact
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pubg-global-${{ steps.resolve.outputs.version_name }}-${{ steps.resolve.outputs.version_code }}-libue4-sync
          path: |
            ${{ steps.download.outputs.apk_path }}
            ${{ steps.extract.outputs.so_path }}
            out/resolved.json
            out/aapt-badging.txt
            out/libUE4-elf-header.txt
            out/APK_SHA256SUMS.txt
            out/LIBUE4_SHA256SUMS.txt
            out/FILE_SIZES.txt
            out/release-assets-after.tsv
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
