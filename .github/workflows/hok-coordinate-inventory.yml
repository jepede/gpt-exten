name: HOK Android APK native engine inventory
on:
  push:
    branches: [work/hok-coordinate-re-20261026]
    paths:
      - .github/workflows/hok-coordinate-inventory.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Probe official cached URL and inspect remote native directory
        run: |
          set -euo pipefail
          python3 tools/hok_coordinate_inventory.py
          sed -n '1,120p' out/hok_coord_inventory/inventory.md
      - name: Preserve report for this investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hok-coordinate-native-inventory
          path: out/hok_coord_inventory/
          if-no-files-found: warn
          retention-days: 1
