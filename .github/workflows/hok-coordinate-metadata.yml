name: HOK IL2CPP metadata coordinate inspection
on:
  push:
    branches: [work/hok-coordinate-re-20261026]
    paths:
      - .github/workflows/hok-coordinate-metadata.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Probe official cached URL and inspect remote native directory
        run: |
          set -euo pipefail
          python3 tools/hok_metadata_coordinate_probe.py
          head -c 18000 out/hok_metadata/metadata_findings.json
      - name: Preserve report for this investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hok-coordinate-metadata-report
          path: out/hok_metadata/
          if-no-files-found: warn
          retention-days: 1
