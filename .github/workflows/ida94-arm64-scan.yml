name: IDA94 ARM64 Scan

on:
  push:
    branches:
      - tmp/ida94-arm64-scan

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Download inputs
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o ida-pro_94_armlinux.run \
            https://github.com/Yigods/ida94_b1/releases/download/v9.4-installers/ida-pro_94_armlinux.run
          echo 'd5f4cbe410d9dd3bf69e8c630ef3a8b26ef7d39de1bb9effdfabb992e8fe7c8e  ida-pro_94_armlinux.run' | sha256sum -c -
          curl -L --fail --retry 3 -o radare2.zip \
            https://github.com/jepede/gpt-exten/releases/download/1.0.0/radare2.zip
          echo '25fcfd7fcd6a381ae63d56a72d50c45d713353cd52b92751f1ad9e6f63cb0320  radare2.zip' | sha256sum -c -
          file ida-pro_94_armlinux.run
          uname -a

      - name: Inspect radare2 bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir r2bundle
          unzip -q radare2.zip -d r2bundle
          find r2bundle -maxdepth 4 -type f -print | sort | head -200
          while IFS= read -r f; do
            if [[ -x "$f" ]] || [[ "$(basename "$f")" == r2 ]] || [[ "$(basename "$f")" == radare2 ]]; then
              file "$f" || true
            fi
          done < <(find r2bundle -type f)

      - name: Install ARM64 IDA into temporary prefix
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ida-pro_94_armlinux.run
          mkdir -p "$GITHUB_WORKSPACE/ida94"
          ./ida-pro_94_armlinux.run \
            --mode unattended \
            --unattendedmodeui none \
            --prefix "$GITHUB_WORKSPACE/ida94"
          find "$GITHUB_WORKSPACE/ida94" -maxdepth 2 -type f \( -name 'libida.so' -o -name 'libida32.so' \) -print

      - name: Deep scan ARM64 core libraries
        shell: bash
        run: |
          set -euxo pipefail
          : > arm64-deep-scan.txt
          for f in ida94/libida.so ida94/libida32.so; do
            echo "===== $f =====" | tee -a arm64-deep-scan.txt
            file "$f" | tee -a arm64-deep-scan.txt
            sha256sum "$f" | tee -a arm64-deep-scan.txt
            readelf -hW "$f" | tee -a arm64-deep-scan.txt
            readelf -SW "$f" >> arm64-deep-scan.txt
          done

          python3 - <<'PY' | tee -a arm64-deep-scan.txt
          from pathlib import Path
          import hashlib, struct

          orig = bytes.fromhex(
              '29f4481f796f9f66f2ff13cc4ab5b54f60845db603ba2c0bac8a9bc4b6cbdefc'
              '5c62bfc2f5ee850ac45ea97ad347e8b56dba5085af8c8aad9cc2ec626ca78a06'
              '8006d658f68651da31a0a77c65a70ed73a40d53b08edd403c095aa0bcffa52f3'
              '13ebcacaaa2ce5024a4e2b9aa70fc6092f38ae094d71e43f7690b5ddd3e9e4f7'
          )
          replacement = bytes.fromhex(
              'a107b71c8a08ba5350934f7cf6e81be3a24dc2e35f7200d80cbd70b37ed6811d'
              'd2146d3cb7e20ad19b2544c0ef14c5c66ffbbdf226ec3f3d544c04385303ca4a'
              '7179299340022f5d50948bcf8a60307e2c196329e51a5296dc419e40fef3ef7c'
              '6f015a09ebd979e79615338985643e666c14897f9f597e11f44341f496d56861'
          )

          def all_hits(data, needle):
              out=[]; p=0
              while True:
                  p=data.find(needle,p)
                  if p < 0: return out
                  out.append(p); p += 1

          def parse_sections(data):
              if data[:4] != b'\x7fELF' or data[4] != 2 or data[5] != 1:
                  raise ValueError('not little-endian ELF64')
              e_shoff=struct.unpack_from('<Q',data,0x28)[0]
              e_shentsize=struct.unpack_from('<H',data,0x3a)[0]
              e_shnum=struct.unpack_from('<H',data,0x3c)[0]
              e_shstrndx=struct.unpack_from('<H',data,0x3e)[0]
              headers=[]
              for i in range(e_shnum):
                  off=e_shoff+i*e_shentsize
                  sh_name,sh_type=struct.unpack_from('<II',data,off)
                  sh_flags,sh_addr,sh_offset,sh_size=struct.unpack_from('<QQQQ',data,off+8)
                  headers.append([sh_name,sh_type,sh_flags,sh_addr,sh_offset,sh_size])
              s=headers[e_shstrndx]
              names=data[s[4]:s[4]+s[5]]
              def cstr(o):
                  end=names.find(b'\0',o)
                  return names[o:end].decode('utf-8','replace')
              return [(cstr(h[0]),*h[1:]) for h in headers]

          for fn in ('ida94/libida.so','ida94/libida32.so'):
              p=Path(fn); data=p.read_bytes(); secs=parse_sections(data)
              oh=all_hits(data,orig); rh=all_hits(data,replacement)
              print(f'FILE={fn}')
              print(f'SIZE={len(data)} SHA256={hashlib.sha256(data).hexdigest()}')
              print('ORIG_HITS=' + ','.join(hex(x) for x in oh))
              print('REPLACEMENT_HITS=' + ','.join(hex(x) for x in rh))
              print('SPACING=' + ','.join(hex(b-a) for a,b in zip(oh,oh[1:])))
              for hit in oh:
                  matches=[]
                  for name,typ,flags,addr,off,size in secs:
                      if off <= hit < off+size:
                          matches.append((name,addr,off,size,addr+(hit-off)))
                  for name,addr,off,size,va in matches:
                      print(f'HIT file_off=0x{hit:x} section={name} sec_off=0x{off:x} sec_va=0x{addr:x} hit_va=0x{va:x} sec_size=0x{size:x}')
                  lo=max(0,hit-32); hi=min(len(data),hit+len(orig)+32)
                  print(f'CONTEXT[{lo:#x}:{hi:#x}]={data[lo:hi].hex()}')
              print()
          PY

      - name: Upload deep scan report
        uses: actions/upload-artifact@v4
        with:
          name: ida94-arm64-deep-scan-report
          path: arm64-deep-scan.txt
          retention-days: 7
