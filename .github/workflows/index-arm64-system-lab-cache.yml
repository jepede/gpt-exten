name: Index ARM64 System Lab Cache
on:
  push:
    paths:
      - '.github/workflows/index-arm64-system-lab-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo.repo;
            const artifactId = 11032351529;
            const a = (await github.rest.actions.getArtifact({owner,repo,artifact_id:artifactId})).data;
            if (a.expired || a.size_in_bytes !== 122163597 || a.name !== 'arm64-system-lab-debian13-v1') throw new Error('Artifact metadata changed');
            if (a.digest !== 'sha256:64fdcf5d1843bedfe0012cb19667f4b2865f81b835033d6f296a01e3dce7599a') throw new Error('Artifact digest mismatch');
            const path = 'ARTIFACT_CACHE.md';
            const f = (await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data;
            if (Array.isArray(f) || f.encoding !== 'base64') throw new Error('Unexpected cache file representation');
            let text = Buffer.from(f.content,'base64').toString('utf8');
            const heading = '## ARM64 system lab Debian 13 v1';
            if (text.includes(heading)) { core.info('Already indexed'); return; }
            const row = '| ARM64 system lab | debian13-v1-qemu10.0.13-linux6.12.111 | Linux / Debian 13 | x86_64 host + AArch64 guest | `36566866696` | SINGLE | `2026-12-28T12:15:02Z` |';
            const index = text.indexOf('## Index');
            const end = text.indexOf('\n## ',index + 8);
            if (index < 0 || end < 0) throw new Error('Cannot identify index boundaries');
            text = text.slice(0,end).trimEnd() + '\n' + row + '\n' + text.slice(end);
            text += '\n\n' + heading + '\n\n' + [
              '- Name: ARM64 system lab',
              '- Version: debian13-v1-qemu10.0.13-linux6.12.111',
              '- Platform: Linux / Debian 13',
              '- Architecture: x86_64 host + AArch64 guest',
              '- Workflow: `.github/workflows/fetch-arm64-system-lab-debian13.yml`',
              '- Run ID: `36566866696`',
              '- Artifact ID: `11032351529`',
              '- Artifact Name: `arm64-system-lab-debian13-v1`',
              '- File: `arm64-system-lab-debian13-v1.zip`',
              '- Size: `122163597` bytes',
              '- SHA256: `64fdcf5d1843bedfe0012cb19667f4b2865f81b835033d6f296a01e3dce7599a`',
              '- Created At: `2026-09-29T12:15:26Z`',
              '- Expires At: `2026-12-28T12:15:02Z`',
              '- Storage: `SINGLE`',
              '- Original File: `arm64-system-lab-debian13-v1.tar`',
              '- Original Size: `122163200` bytes',
              '- Original SHA256: `1819458934fb118d7b11bf9564aa8fb4c6882a932d6fada0dc76ac58dcf44ca1`',
              '- Part Count: `1`',
              '- Contents: Public Debian packages only; QEMU system 10.0.13, Linux 6.12.111+deb13-arm64, ARM64 BusyBox, GDB server, strace, runtime libraries, and package hashes.',
              '- Privacy: Contains no user sample, Android rootfs, memory dump, or private research files.',
              '',
              'Restore: Download artifact 11032351529, verify the archive SHA256, extract and verify the original TAR SHA256, then verify `meta/SHA256SUMS.txt` before use.'
            ].join('\n') + '\n';
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch:'main',sha:f.sha,message:'Index verified ARM64 system lab public dependency artifact',content:Buffer.from(text).toString('base64')});
