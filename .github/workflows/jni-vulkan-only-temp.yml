name: JNI1 Vulkan-only Build (Temporary)
on:
  push:
    paths:
      - '.github/workflows/jni-vulkan-only-temp.yml'
      - 'tools/jni-vulkan-only/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_ZIP_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-8400-8206-8f86-2dce31b0fcac/raw?se=2026-10-09T18%3A38%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=bc6c6910-4688-5629-ae3f-866cca13b8e6&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T01%3A18%3A04Z&ske=2026-10-10T01%3A18%3A04Z&sks=b&skv=2026-02-06&sig=gsUwDbUHLqwWL4aCGkk4K01JQNy9ZyVqEzO0DjqJHt0%3D'
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Fetch original JNI privately via expiring file token
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project output
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_ZIP_URL" -o "$RUNNER_TEMP/jni1.zip"
          test "$(stat -c%s "$RUNNER_TEMP/jni1.zip")" -eq 7713106
          unzip -tq "$RUNNER_TEMP/jni1.zip"
          unzip -q "$RUNNER_TEMP/jni1.zip" -d project
          sha256sum "$RUNNER_TEMP/jni1.zip" > output/original_jni1.sha256

      - name: Fetch pinned Dear ImGui source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.92.6 https://github.com/ocornut/imgui.git "$RUNNER_TEMP/dear-imgui"
          python3 tools/jni-vulkan-only/migrate.py project "$RUNNER_TEMP/dear-imgui"
          grep -q 'libvulkan' project/jni/Android.mk || grep -q -- '-lvulkan' project/jni/Android.mk

      - name: Restore cached Android NDK part 0
        uses: actions/download-artifact@v4
        with:
          name: ndk-r28c-part-00
          path: ndkparts/part00
          run-id: 31684150811
          github-token: ${{ github.token }}

      - name: Restore cached Android NDK part 1
        uses: actions/download-artifact@v4
        with:
          name: ndk-r28c-part-01
          path: ndkparts/part01
          run-id: 31684150811
          github-token: ${{ github.token }}

      - name: Assemble and validate cached NDK
        shell: bash
        run: |
          set -euo pipefail
          ls -lah ndkparts/part00 ndkparts/part01
          cat ndkparts/part00/ndk-r28c.part.00 ndkparts/part01/ndk-r28c.part.01 > "$RUNNER_TEMP/ndk-r28c-linux.zip"
          echo "dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f  $RUNNER_TEMP/ndk-r28c-linux.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ndk"
          unzip -q "$RUNNER_TEMP/ndk-r28c-linux.zip" -d "$RUNNER_TEMP/ndk"
          test -x "$RUNNER_TEMP/ndk/android-ndk-r28c/ndk-build"

      - name: Compile ARM64 Vulkan-only shared library
        shell: bash
        run: |
          set -euo pipefail
          cd project
          "$RUNNER_TEMP/ndk/android-ndk-r28c/ndk-build" -j4 \
            NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk \
            NDK_APPLICATION_MK=./jni/Application.mk BUILD_MODE=debug V=0
          test -s libs/arm64-v8a/libAndroid.so

      - name: Verify Vulkan-only output and package everything
        shell: bash
        run: |
          set -euo pipefail
          test -s project/libs/arm64-v8a/libAndroid.so
          FILE=project/libs/arm64-v8a/libAndroid.so
          "$RUNNER_TEMP/ndk/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$FILE" | tee output/dynamic_dependencies.txt
          grep -q 'libvulkan.so' output/dynamic_dependencies.txt
          if grep -E '(libEGL|libGLES|libOpenGL)' output/dynamic_dependencies.txt; then
            echo "ERROR: OpenGL/EGL/GLES dependency still linked" >&2
            exit 1
          fi
          find project/jni -type f \( -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.mk' \) -print0 |
            xargs -0 grep -nE '#include[[:space:]]*[<"](EGL/|GLES/|GLES2/|GLES3/|GL/)' && exit 1 || true
          mkdir -p project/symbols
          cp -f project/obj/local/arm64-v8a/libAndroid.so project/symbols/libAndroid-unstripped.so
          cp output/original_jni1.sha256 output/dynamic_dependencies.txt project/
          cat > project/BUILD-REPORT.txt <<'REPORT'
          Project: JNI SurfaceControl overlay migrated from EGL/GLES to Vulkan-only.
          Input: uploaded jni1.zip (modified in this workflow).
          Graphics: Vulkan offscreen VkImage -> staging VkBuffer -> CPU-mapped AHardwareBuffer -> ASurfaceControl.
          Backend: Dear ImGui v1.92.6 imgui_impl_vulkan + imgui_impl_android.
          ABI: arm64-v8a / android-31.
          Build: Android NDK r28c cache from gpt-exten run 31684150811.
          Verification: compiler/linker succeeded and DT_NEEDED contains libvulkan but no GLES/EGL.
          Runtime: not tested on actual Android device.
          REPORT
          ( cd project && zip -q -r -9 ../output/jni1-vulkan-only-full.zip \
              jni libs symbols README-Vulkan.md BUILD-REPORT.txt original_jni1.sha256 dynamic_dependencies.txt )
          unzip -tq output/jni1-vulkan-only-full.zip
          sha256sum output/jni1-vulkan-only-full.zip > output/package.sha256
          ls -lh output

      - name: Publish complete source and compiled SO
        uses: actions/upload-artifact@v4
        with:
          name: jni1-vulkan-only-complete
          path: output/
          retention-days: 1
          if-no-files-found: error
