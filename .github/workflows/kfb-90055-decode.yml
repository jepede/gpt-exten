name: KFB 90055 decode

on:
  push:
    branches: [chatgpt-kfb-90055]
    paths:
      - '.github/workflows/kfb-90055-decode.yml'
  workflow_dispatch:

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild KFB input
        run: |
          cat tmp/kfb90055/chunk0.b64 tmp/kfb90055/chunk1a.b64 tmp/kfb90055/chunk1b.b64 tmp/kfb90055/chunk2.b64 tmp/kfb90055/chunk3.b64 tmp/kfb90055/chunk4.b64 tmp/kfb90055/chunk5.b64 > /tmp/90055.b64
          base64 -d /tmp/90055.b64 > /tmp/90055_decrypted.kfb
          echo "size=$(stat -c%s /tmp/90055_decrypted.kfb)"
          sha256sum /tmp/90055_decrypted.kfb
          test "$(stat -c%s /tmp/90055_decrypted.kfb)" = "19155"
          test "$(sha256sum /tmp/90055_decrypted.kfb | cut -d' ' -f1)" = "c3fd48cd5c403bd776fdb9a3cd852dc0b989d568ad5dae11afc411c45b27fa46"

      - name: Download verified KH ActorData decoder
        run: |
          mkdir -p /tmp/kfbtool /tmp/out
          base='https://raw.githubusercontent.com/DianSuWitss/kfb-assetbundle-decrypt/main/kfb/05_tools'
          curl -fL "$base/kfb_static_decrypt.js" -o /tmp/kfbtool/kfb_static_decrypt.js
          curl -fL "$base/kfb_schema_decoder.js" -o /tmp/kfbtool/kfb_schema_decoder.js
          curl -fL "$base/kfb_readable_adapter.js" -o /tmp/kfbtool/kfb_readable_adapter.js
          curl -fL "$base/kfb_schema.json" -o /tmp/kfbtool/kfb_schema.json
          curl -fL "$base/kfb_dump_layout.json" -o /tmp/kfbtool/kfb_dump_layout.json

      - name: Patch current-version AnimationBoxData schema
        run: |
          python3 - <<'PY'
          import json
          p='/tmp/kfbtool/kfb_schema.json'
          s=json.load(open(p,'r',encoding='utf-8'))
          by={t.get('full_name') or t.get('name'):t for t in s['types']}
          t=by['KH.AnimationBoxData']
          def f(tag,name,ft,**kw):
              x={
                'tag':tag,'serialize_level':0,'name':name,'declared_by':'KH.AnimationBoxData',
                'field_type':ft,'type_code':'Object' if kw.get('is_list') else ('Int32' if ft=='System.Int32' else 'Object'),
                'type_code_value':1 if kw.get('is_list') else (9 if ft=='System.Int32' else 1),
                'enum_underlying_type_code':'Empty','is_value_type':ft=='System.Int32','is_enum':False,
                'is_array':False,'is_kfb_serializable':False,'has_custom_serializer':False,
                'is_list':kw.get('is_list',False),'is_dictionary':False,'polymorphic':False,
                'skip_default':False,'skip_default_implicit':True,
                'wire_type_hint':'List' if kw.get('is_list') else 'Variant',
                'display_type':kw.get('display_type',name),'editable_name':name,
              }
              if kw.get('is_list'): x['element_type']=kw['element_type']
              return x
          if not any(x['tag']==11 for x in t['fields']):
              t['fields'].append(f(11,'boxMask','System.Int32',display_type='Int32'))
          if not any(x['tag']==12 for x in t['fields']):
              t['fields'].append(f(12,'AttackBoxList','System.Collections.Generic.List\`1[[AnimationBoxData.AttackBox]]',
                                   is_list=True,element_type='AnimationBoxData.AttackBox',display_type='List<AnimationBoxData.AttackBox>'))
          if 'AnimationBoxData.AttackBox' not in by:
              s['types'].append({
                'full_name':'AnimationBoxData.AttackBox','is_array':False,'is_enum':False,
                'is_value_type':False,'base_type':'System.Object','type_id':None,
                'polymorphic':False,'has_custom_serializer':False,
                'fields':[
                  {'tag':1,'serialize_level':0,'name':'pos','declared_by':'AnimationBoxData.AttackBox',
                   'field_type':'KH.FVector3','type_code':'Object','type_code_value':1,'enum_underlying_type_code':'Empty',
                   'is_value_type':True,'is_enum':False,'is_array':False,'is_kfb_serializable':False,
                   'has_custom_serializer':True,'is_list':False,'is_dictionary':False,'polymorphic':False,
                   'skip_default':False,'skip_default_implicit':True,'wire_type_hint':'Object',
                   'display_type':'FVector3','editable_name':'pos'},
                  {'tag':2,'serialize_level':0,'name':'size','declared_by':'AnimationBoxData.AttackBox',
                   'field_type':'KH.FVector3','type_code':'Object','type_code_value':1,'enum_underlying_type_code':'Empty',
                   'is_value_type':True,'is_enum':False,'is_array':False,'is_kfb_serializable':False,
                   'has_custom_serializer':True,'is_list':False,'is_dictionary':False,'polymorphic':False,
                   'skip_default':False,'skip_default_implicit':True,'wire_type_hint':'Object',
                   'display_type':'FVector3','editable_name':'size'}
                ],
                'default_json':'{"pos":"0,0,0","size":"0,0,0"}'
              })
          hit=by.get('KH.TSHitTestArg')
          if hit is not None and not any(x['tag']==32 and x.get('declared_by')=='KH.TSHitTestArg' for x in hit['fields']):
              hit['fields'].append({
                'tag':32,'serialize_level':0,'name':'recursiveFindObjectFrame','declared_by':'KH.TSHitTestArg',
                'field_type':'System.Boolean','type_code':'Boolean','type_code_value':3,'enum_underlying_type_code':'Empty',
                'is_value_type':True,'is_enum':False,'is_array':False,'is_kfb_serializable':False,
                'has_custom_serializer':False,'is_list':False,'is_dictionary':False,'polymorphic':False,
                'skip_default':False,'skip_default_implicit':True,'wire_type_hint':'Variant',
                'display_type':'Boolean','editable_name':'recursiveFindObjectFrame'
              })
          ct=by.get('KH.ChangeTargetArg')
          if ct is not None:
              for tag,name in [(50,'checkBorder'),(51,'recursiveFindObjectFrame')]:
                  if not any(x['tag']==tag and x.get('declared_by')=='KH.ChangeTargetArg' for x in ct['fields']):
                      ct['fields'].append({
                        'tag':tag,'serialize_level':0,'name':name,'declared_by':'KH.ChangeTargetArg',
                        'field_type':'System.Boolean','type_code':'Boolean','type_code_value':3,'enum_underlying_type_code':'Empty',
                        'is_value_type':True,'is_enum':False,'is_array':False,'is_kfb_serializable':False,
                        'has_custom_serializer':False,'is_list':False,'is_dictionary':False,'polymorphic':False,
                        'skip_default':False,'skip_default_implicit':True,'wire_type_hint':'Variant',
                        'display_type':'Boolean','editable_name':name
                      })
          # Current KFBTypeIdDef from user's dump.cs: old public schema is shifted here.
          if by.get('KH.SearchElementArg') is not None:
              by['KH.SearchElementArg']['type_id']=551
          if by.get('KH.SomeFightToggleArg') is not None:
              sf=by['KH.SomeFightToggleArg']
              sf['type_id']=585
              if not any(x['tag']==59 and x.get('declared_by')=='KH.SomeFightToggleArg' for x in sf['fields']):
                  sf['fields'].append({
                    'tag':59,'serialize_level':0,'name':'canShowFriendBeHurtDmgNum','declared_by':'KH.SomeFightToggleArg',
                    'field_type':'System.Boolean','type_code':'Boolean','type_code_value':3,'enum_underlying_type_code':'Empty',
                    'is_value_type':True,'is_enum':False,'is_array':False,'is_kfb_serializable':False,
                    'has_custom_serializer':False,'is_list':False,'is_dictionary':False,'polymorphic':False,
                    'skip_default':False,'skip_default_implicit':True,'wire_type_hint':'Variant',
                    'display_type':'Boolean','editable_name':'canShowFriendBeHurtDmgNum'
                  })
          json.dump(s,open(p,'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          print('patched KH.AnimationBoxData tags:',[(x['tag'],x['name']) for x in t['fields']])
          PY

      - name: Instrument polymorphic type IDs
        run: |
          python3 - <<'PY'
          p='/tmp/kfbtool/kfb_schema_decoder.js'
          s=open(p,'r',encoding='utf-8').read()
          old='prefixTypeId = Number(typeIdBig);\n      const actual = schema.typesById.get(prefixTypeId);'
          new="prefixTypeId = Number(typeIdBig);\n      if (objectPath.includes('scriptDatas[0]')) console.error('[TYPEID]', objectPath, 'offset', start, 'id', prefixTypeId);\n      const actual = schema.typesById.get(prefixTypeId);"
          assert old in s
          open(p,'w',encoding='utf-8').write(s.replace(old,new))
          PY

      - name: Decode KFB to editable JSON and XML
        run: |
          node /tmp/kfbtool/kfb_static_decrypt.js decode             /tmp/90055_decrypted.kfb /tmp/out/90055             --schema /tmp/kfbtool/kfb_schema.json             --dump-layout /tmp/kfbtool/kfb_dump_layout.json             | tee /tmp/out/90055_decode_report.json

      - name: JSON round-trip
        run: |
          node /tmp/kfbtool/kfb_static_decrypt.js encode             /tmp/out/90055.json /tmp/out/90055_from_json.kfb             --schema /tmp/kfbtool/kfb_schema.json             --dump-layout /tmp/kfbtool/kfb_dump_layout.json             | tee /tmp/out/90055_json_roundtrip.json

      - name: XML round-trip
        run: |
          node /tmp/kfbtool/kfb_static_decrypt.js encode             /tmp/out/90055.xml /tmp/out/90055_from_xml.kfb             --schema /tmp/kfbtool/kfb_schema.json             --dump-layout /tmp/kfbtool/kfb_dump_layout.json             | tee /tmp/out/90055_xml_roundtrip.json

      - name: Summarize outputs
        run: |
          cp /tmp/90055_decrypted.kfb /tmp/out/90055_original.kfb
          sha256sum /tmp/out/*.kfb | tee /tmp/out/SHA256SUMS.txt
          python3 - <<'PY'
          import json, pathlib
          out=pathlib.Path('/tmp/out')
          d=json.loads((out/'90055_decode_report.json').read_text())
          j=json.loads((out/'90055_json_roundtrip.json').read_text())
          x=json.loads((out/'90055_xml_roundtrip.json').read_text())
          summary={
            'decodedBytes': d.get('decryptedBytes'),
            'inputSha256': d.get('sha256'),
            'coverage': d.get('coverage'),
            'jsonFormat': d.get('jsonFormat'),
            'xmlFormat': d.get('xmlFormat'),
            'jsonRoundTrip': j.get('semanticRoundTrip'),
            'xmlRoundTrip': x.get('semanticRoundTrip'),
            'jsonEncodedBytes': j.get('encodedBytes'),
            'xmlEncodedBytes': x.get('encodedBytes'),
          }
          (out/'SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          assert summary['coverage']['unknownFields'] == 0
          assert summary['jsonRoundTrip'] is True
          assert summary['xmlRoundTrip'] is True
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kfb-90055-decoded
          path: /tmp/out/*
          if-no-files-found: error

# retrigger after all KFB chunks are present
