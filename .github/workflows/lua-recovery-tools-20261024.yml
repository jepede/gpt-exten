name: Lua recovery tools 20261024
on:
  push:
    paths:
      - .github/workflows/lua-recovery-tools-20261024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - name: Download tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/bin bundle/lib bundle/share downloads
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          cp /usr/bin/luajit bundle/bin/
          cp -L /usr/lib/x86_64-linux-gnu/libluajit-5.1.so.2 bundle/lib/
          cp -r /usr/share/luajit-*/jit bundle/share/
          curl -fL --retry 3 https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip -o downloads/stylua.zip
          unzip -q downloads/stylua.zip -d bundle/bin
          python3 -m pip download --no-deps ruff==0.14.3 -d downloads
          python3 - <<'PY'
          import glob,zipfile,pathlib
          p=glob.glob('downloads/ruff*.whl')[0]
          with zipfile.ZipFile(p) as z:
              n=next(n for n in z.namelist() if n.endswith('/bin/ruff'))
              pathlib.Path('bundle/bin/ruff').write_bytes(z.read(n))
          PY
          chmod +x bundle/bin/*
          bundle/bin/stylua --version
          bundle/bin/ruff --version
          luajit -v
          dpkg-query -W luajit libluajit-5.1-2 > bundle/VERSIONS.txt
          printf 'StyLua 2.6.0\nruff 0.14.3\n' >> bundle/VERSIONS.txt
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('bundle')
          entries=[{'file':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          (root/'MANIFEST.json').write_text(json.dumps({'Name':'Lua recovery tools','Version':'luajit-ubuntu24-stylua2.6.0-ruff0.14.3-v1','Platform':'Linux','Architecture':'x86_64','files':entries},indent=2))
          PY
          tar -czf lua-recovery-tools-v1.tar.gz -C bundle .
          sha256sum lua-recovery-tools-v1.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test $(stat -c%s lua-recovery-tools-v1.tar.gz) -lt 95000000
      - uses: actions/upload-artifact@v4
        with:
          name: lua-recovery-tools-x86_64-v1
          path: |
            lua-recovery-tools-v1.tar.gz
            SHA256SUMS.txt
          retention-days: 400
          compression-level: 0
