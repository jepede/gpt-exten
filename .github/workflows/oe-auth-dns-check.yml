name: OE Auth DNS A Records (temporary)
on:
  push:
    paths:
      - '.github/workflows/oe-auth-dns-check.yml'
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve old and candidate names without connecting
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import socket, datetime
          print('checked_at_utc:', datetime.datetime.now(datetime.timezone.utc).isoformat())
          for host in ('tcp.oenb1.top','www.oenb66.top','ssl.oekernel.com','test.lm66.cn'):
              try:
                  result=socket.getaddrinfo(host,None,family=socket.AF_INET,type=socket.SOCK_STREAM)
                  print(host, 'IPv4:', ','.join(sorted({x[4][0] for x in result})))
              except Exception as exc:
                  print(host, 'DNS_FAIL:',type(exc).__name__,str(exc))
          PY