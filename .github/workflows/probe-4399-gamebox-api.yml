name: Probe 4399 GameBox APIs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-4399-gamebox-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download official GameBox and extract endpoints
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://dp.yxhimg.com/dp/9.6/4399Game_9.6.0.47..19bf.apk?comment=%7B%22apkChannel%22:%22a4399%22%7D&from=6ab7d6446e1d9'
          curl -L --retry 2 --max-time 120 -A 'Mozilla/5.0 (Linux; Android 16)' "$URL" -o gamebox.apk
          echo '=== file ==='
          ls -lh gamebox.apk
          sha256sum gamebox.apk
          unzip -q gamebox.apk -d apk
          echo '=== collect strings ==='
          : > allstrings.txt
          for f in apk/classes*.dex; do
            strings -a -n 4 "$f" >> allstrings.txt || true
          done
          strings -a -n 4 apk/resources.arsc >> allstrings.txt || true
          sort -u allstrings.txt -o allstrings.txt
          echo '=== URL-ish strings ==='
          grep -Eo 'https?://[^[:space:]<>"'\'' ]+' allstrings.txt | sort -u | grep -Ei '4399|yxh|api|game|down|apk|app' | head -n 2000 || true
          echo '=== host/path keywords ==='
          grep -Ei '(^|[^A-Za-z0-9])(api\.|\.4399\.cn|\.yxhimg\.com|\.img4399\.com|download|down_url|downurl|apkurl|apk_url|gameinfo|gamedetail|game_detail|packageName|package_name|pkgname|appid|gameid)([^A-Za-z0-9]|$)' allstrings.txt | head -n 4000 || true
          echo '=== game/package direct hits ==='
          grep -Ei 'com\.bairimeng\.dmmdzz|逃跑吧|120610' allstrings.txt | head -n 200 || true
