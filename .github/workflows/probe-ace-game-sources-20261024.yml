name: Temporary source discovery Tencent Android games
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-ace-game-sources-20261024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe Tencent and Xiaomi game download metadata
        run: |
          python3 - <<'PY'
          import requests,re,html,json,os,time
          from urllib.parse import quote,urlparse
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (Linux; Android 16; Pixel 8 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Mobile Safari/537.36","Accept-Encoding":"identity"})
          apps=[
           ("hok","com.tencent.tmgp.sgame","108048"),
           ("peace","com.tencent.tmgp.pubgmhd","547468"),
           ("cf","com.tencent.tmgp.cf","121542"),
          ]
          results=[]
          for name,pkg,appid in apps:
           urls=[f"https://a.app.qq.com/o/simple.jsp?pkgname={pkg}",f"https://sj.qq.com/appdetail/{pkg}",f"https://app.mi.com/details?id={pkg}",f"https://app.mi.com/download/{appid}",f"https://app.market.xiaomi.com/apm/download/{appid}",f"https://r.app.xiaomi.com/details?id={pkg}"]
           for url in urls:
            row={"game":name,"url":url}
            try:
             r=s.get(url,timeout=(12,40),stream=True,allow_redirects=True)
             row.update({"code":r.status_code,"final":r.url,"type":r.headers.get("Content-Type"),"size":r.headers.get("Content-Length")})
             if "text" in (r.headers.get("Content-Type","").lower()) or "json" in (r.headers.get("Content-Type","").lower()):
              b=r.raw.read(900000)
              text=b.decode("utf8","replace")
              l=html.unescape(text).replace("\\/","/")
              found=re.findall(r'(?:(?:https?:)?//)[^\s"\'<>]{6,250}?(?:\.apk|\.xapk|\.apks)(?:[?][^\s"\'<>]{0,160})?',l,re.I)
              found2=re.findall(r'.{0,100}(?:imtt\.dd\.qq\.com|url_download|apkurl|apkUrl|downloadUrl|download_url|downUrl|download-link|__NEXT_DATA__).{0,190}',l,re.I)
              row["apk_links"]=found[:8]
              row["interesting_fragments"]=found2[:12]
              row["body_preview"]=l[:350]
             else:
              first=r.raw.read(64)
              row["binary_magic"]=first[:24].hex()
             r.close()
            except Exception as e:row["error"]=str(e)[:350]
            results.append(row);print(json.dumps(row,ensure_ascii=False),flush=True)
          with open("probe_sources.json","w") as f:json.dump(results,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ace-game-download-discovery
          path: probe_sources.json
          retention-days: 1
