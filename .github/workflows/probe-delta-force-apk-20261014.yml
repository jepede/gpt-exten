name: Probe Delta Force CN Official APK Link (temporary)
on:
  push:
    branches: [probe-delta-force-apk-20261014]
    paths: [.github/workflows/probe-delta-force-apk-20261014.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe official Tencent landing and download pages (HTML only)
        shell: bash
        run: |
          mkdir -p probe
          cat > /tmp/probe.py <<'PY'
          import requests,re,html,json,hashlib,pathlib,time
          pages={
            'tencent_app_mobile':'https://a.app.qq.com/o/simple.jsp?pkgname=com.tencent.tmgp.dfm',
            'tencent_app_store':'https://sj.qq.com/appdetail/com.tencent.tmgp.dfm',
            'tencent_website':'https://df.qq.com/cp/a20240906main/index.html',
          }
          out={}
          agents=[
            ('mobile','Mozilla/5.0 (Linux; Android 16; Pixel 9) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36'),
            ('desktop','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'),
          ]
          for label,url in pages.items():
            for ua_name,ua in agents[:1 if label!='tencent_app_mobile' else 2]:
              key=label+'_'+ua_name
              try:
                resp=requests.get(url,headers={'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9','Accept':'text/html,application/xhtml+xml,*/*'},timeout=30)
                raw=resp.content[:3000000]
                dest=pathlib.Path('probe')/(key+'.html')
                dest.write_bytes(raw)
                doc=html.unescape(raw.decode('utf-8','replace'))
                hints=[]
                for pat in ['apkUrl','window.systemData','androidDownload','downloadUrl','apk_url','\\.apk','下载安卓版']:
                  for m in list(re.finditer(pat,doc,re.I))[:12]:
                    hints.append({'pattern':pat,'fragment':doc[max(0,m.start()-100):m.end()+330].replace('\\n',' ')})
                urls=list(dict.fromkeys(re.findall(r'https?://[^\\s"\'<>\\\\]{10,500}',doc)))
                out[key]={'status':resp.status_code,'url':resp.url,'content_type':resp.headers.get('content-type'),'length':len(resp.content),'sha256':hashlib.sha256(raw).hexdigest(),'hints':hints[:30],'candidate_urls':[x[:600] for x in urls if any(t in x.lower() for t in ['apk','down','download','imtt','cdn','qq.com'])][:60]}
              except Exception as e:
                out[key]={'error':repr(e)}
          dest=pathlib.Path('probe/results.json')
          dest.write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print('*** RESULT ***')
          for k,v in out.items():
            print('\n==',k,'==',v.get('status'),v.get('url'),v.get('length'),v.get('error'))
            for h in v.get('hints',[])[:8]:
              print('HINT:',h['pattern'],h['fragment'][:450])
            for u in v.get('candidate_urls',[])[:15]:print('URL:',u)
          PY
          python /tmp/probe.py
          sha256sum probe/*
      - name: Upload transient metadata probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-force-cn-apk-probe-20261014
          path: probe/
          retention-days: 1
          if-no-files-found: warn
