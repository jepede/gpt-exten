name: Probe Tencent CDN 16 MiB HTTP throughput (temporary)
on:
  push:
    branches: [probe-delta-force-apk-20261014]
    paths: [".github/workflows/probe-delta-force-cdn-speed-20261014.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download a small HTTP range and report transfer speed
        shell: bash
        run: |
          set -euo pipefail
          url='http://imtt.dd.qq.com/sjy.00022/sjy.00001/16891/apk/546F3D60B114DDD80E45A708D2D6E130.apk?fsname=com.tencent.tmgp.dfm_1.201.37117.67.apk'
          curl -fL --silent --show-error --connect-timeout 15 --max-time 120 --range 0-16777215 \
            -o /tmp/sample.bin \
            -w 'HTTP=%{http_code} downloaded_bytes=%{size_download} speed_Bps=%{speed_download} time_seconds=%{time_total} remote_ip=%{remote_ip}\n' "$url"
          test "$(stat -c %s /tmp/sample.bin)" -eq 16777216
          xxd -l 16 /tmp/sample.bin
