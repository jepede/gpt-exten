name: Repair artifact cache NDK digest typo
on:
  push:
    paths:
      - '.github/workflows/repair-artifact-cache-ndk-digest.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair exact digest typo and commit
        shell: bash
        run: |
          set -euo pipefail
          bad='sha256:40693e9180b35cdbcb23ac6a126e4fd4b98febda894'
          good='sha256:40693e9180b35cdbcb23ac27e1d274d783d93af3667ca126e4fd4b98febda894'
          grep -Fq "$bad" ARTIFACT_CACHE.md
          sed -i "s|$bad|$good|g" ARTIFACT_CACHE.md
          grep -Fq "$good" ARTIFACT_CACHE.md
          if grep -Fq "$bad" ARTIFACT_CACHE.md; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARTIFACT_CACHE.md
          git commit -m 'Repair NDK artifact digest in cache index'
          git push
