name: Resolve TPBSN 4399 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-tpbsn-4399.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe 4399 download transport
        shell: bash
        run: |
          set -euo pipefail
          API='https://cdn.yxhapi.com/android/box/game/v6.3/apk.html?id=120610'
          curl -L --compressed -A 'Mozilla/5.0 (Linux; Android 16; Mobile)' -e 'https://a.4399.cn/' -sS "$API" -o api.json
          python3 - <<'PY' > urls.txt
          import json
          r=json.load(open('api.json'))['result']
          print('downurl\t'+r['downurl'])
          print('tor\t'+r['tor'])
          print('zstd\t'+r['zstd']['url'])
          print('zstd_tor\t'+r['zstd']['tor'])
          PY
          while IFS=$'\t' read -r kind url; do
            echo "===== $kind ====="
            echo "$url"
            for mode in GET RANGE HEAD POST; do
              echo "--- $mode ---"
              case "$mode" in
                GET)
                  curl -sS --max-time 20 -o /tmp/body -D /tmp/head -w 'CODE=%{http_code} SIZE=%{size_download} REDIR=%{redirect_url} TYPE=%{content_type}\n'                     -A '4399GameCenter/9.6.0.47 (Android 16)' -e 'https://a.4399.cn/' "$url" || true ;;
                RANGE)
                  curl -sS --max-time 20 -o /tmp/body -D /tmp/head -w 'CODE=%{http_code} SIZE=%{size_download} REDIR=%{redirect_url} TYPE=%{content_type}\n'                     -H 'Range: bytes=0-1023' -H 'Accept: */*' -H 'Connection: keep-alive'                     -A '4399GameCenter/9.6.0.47 (Android 16)' -e 'https://a.4399.cn/' "$url" || true ;;
                HEAD)
                  curl -sS --max-time 20 -I -D /tmp/head -o /tmp/body -w 'CODE=%{http_code} SIZE=%{size_download} REDIR=%{redirect_url} TYPE=%{content_type}\n'                     -A '4399GameCenter/9.6.0.47 (Android 16)' "$url" || true ;;
                POST)
                  curl -sS --max-time 20 -X POST -d '' -o /tmp/body -D /tmp/head -w 'CODE=%{http_code} SIZE=%{size_download} REDIR=%{redirect_url} TYPE=%{content_type}\n'                     -A '4399GameCenter/9.6.0.47 (Android 16)' -e 'https://a.4399.cn/' "$url" || true ;;
              esac
              grep -iE '^(HTTP/|location:|allow:|server:|content-type:|content-length:|set-cookie:|x-|via:)' /tmp/head | head -n 30 || true
              echo BODY:
              head -c 600 /tmp/body | strings -a | head -n 20 || true
            done
          done < urls.txt
