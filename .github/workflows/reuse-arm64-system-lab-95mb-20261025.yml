name: Reuse ARM64 System Lab 95MB 20261025
on:
  push:
    paths:
      - '.github/workflows/reuse-arm64-system-lab-95mb-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reuse verified unexpired cache without upstream downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache parts
          gh api repos/jepede/gpt-exten/actions/artifacts/11032351529 > cache/source-artifact.json
          python3 - <<'PY'
          import json,datetime
          a=json.load(open('cache/source-artifact.json'))
          assert not a['expired']
          assert datetime.datetime.fromisoformat(a['expires_at'].replace('Z','+00:00'))>datetime.datetime.now(datetime.timezone.utc)
          assert a['size_in_bytes']==122163597
          PY
          gh api repos/jepede/gpt-exten/actions/artifacts/11032351529/zip > cache/source.zip
          python3 - <<'PY'
          import pathlib,hashlib,zipfile,json
          p=pathlib.Path('cache/source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='64fdcf5d1843bedfe0012cb19667f4b2865f81b835033d6f296a01e3dce7599a'
          with zipfile.ZipFile(p) as z:
              data=z.read('arm64-system-lab-debian13-v1.tar')
          assert len(data)==122163200
          assert hashlib.sha256(data).hexdigest()=='1819458934fb118d7b11bf9564aa8fb4c6882a932d6fada0dc76ac58dcf44ca1'
          parts=[]
          for i,start in enumerate(range(0,len(data),95000000)):
              content=data[start:start+95000000]
              f=pathlib.Path('parts')/f'arm64-system.part.{i:02d}'
              f.write_bytes(content)
              parts.append(dict(file=f.name,bytes=len(content),sha256=hashlib.sha256(content).hexdigest()))
          m=dict(name='ARM64 system lab',version='debian13-v1-qemu10.0.13-linux6.12.111-95MB',source_artifact_id=11032351529,original_file='arm64-system-lab-debian13-v1.tar',original_size=len(data),original_sha256=hashlib.sha256(data).hexdigest(),parts=parts)
          pathlib.Path('parts/MANIFEST.json').write_text(json.dumps(m,indent=2))
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-system-lab-reuse-95mb-00
          path: parts/arm64-system.part.00
          compression-level: 0
          retention-days: 400
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-system-lab-reuse-95mb-01
          path: parts/arm64-system.part.01
          compression-level: 0
          retention-days: 400
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-system-lab-reuse-95mb-manifest
          path: parts/MANIFEST.json
          retention-days: 400
          if-no-files-found: error
