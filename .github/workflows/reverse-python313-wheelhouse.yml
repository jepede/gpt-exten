name: Build Reverse Python 3.13 Wheelhouse

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reverse-python313-wheelhouse.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Show runner ABI
        run: |
          set -euxo pipefail
          uname -a
          python --version
          python - <<'PY'
          import platform, sysconfig
          print('machine:', platform.machine())
          print('libc:', platform.libc_ver())
          print('SOABI:', sysconfig.get_config_var('SOABI'))
          PY

      - name: Build complete offline wheelhouse
        run: |
          set -euxo pipefail
          python -m pip install -U pip setuptools wheel
          mkdir -p wheelhouse
          cat > requirements-top.txt <<'EOF'
          angr==9.3.2
          keystone-engine==0.9.2
          triton-library==1.0.0rc4
          z3-solver==5.0.0.0
          EOF
          python -m pip wheel --wheel-dir wheelhouse -r requirements-top.txt
          python -m pip hash wheelhouse/* > SHA256SUMS.pip-hash.txt
          (cd wheelhouse && sha256sum * | sort) > SHA256SUMS.txt
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path('wheelhouse').glob('*.whl'))
          print('wheel_count=', len(files))
          print('bytes=', sum(p.stat().st_size for p in files))
          for p in files:
              print(p.name)
          PY

      - name: Verify offline installation and AArch64 capabilities
        run: |
          set -euxo pipefail
          python -m venv verify-venv
          verify-venv/bin/python -m pip install --no-index --find-links wheelhouse -r requirements-top.txt
          verify-venv/bin/python -m pip check
          verify-venv/bin/python - <<'PY' | tee VERIFY.txt
          import importlib.metadata as md
          import angr, z3
          from keystone import Ks, KS_ARCH_ARM64, KS_MODE_LITTLE_ENDIAN
          from triton import TritonContext, ARCH, Instruction

          print('angr', md.version('angr'))
          print('keystone-engine', md.version('keystone-engine'))
          print('triton-library', md.version('triton-library'))
          print('z3-solver', md.version('z3-solver'))

          ks = Ks(KS_ARCH_ARM64, KS_MODE_LITTLE_ENDIAN)
          encoding, count = ks.asm('mov x0, #1; ret')
          print('keystone_aarch64_bytes', bytes(encoding).hex(), 'count', count)

          x = z3.BitVec('x', 64)
          s = z3.Solver(); s.add(x + 1 == 3)
          assert s.check() == z3.sat and s.model()[x].as_long() == 2
          print('z3_smoke', 'ok')

          ctx = TritonContext(ARCH.AARCH64)
          inst = Instruction(bytes(encoding[:4]))
          inst.setAddress(0x1000)
          assert ctx.processing(inst) is not None
          print('triton_aarch64', inst.getDisassembly())

          import archinfo
          a = archinfo.ArchAArch64()
          print('angr_archinfo', a.name, a.bits, a.memory_endness)
          print('ALL_VERIFY_OK')
          PY

      - name: Write install helper and manifest
        run: |
          set -euxo pipefail
          cat > install-offline.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          PYTHON="${PYTHON:-python3}"
          "$PYTHON" -m pip install --no-index --find-links "$(cd "$(dirname "$0")" && pwd)/wheelhouse" -r "$(cd "$(dirname "$0")" && pwd)/requirements-top.txt"
          "$PYTHON" -m pip check
          EOF
          chmod +x install-offline.sh
          {
            echo 'Target host: Linux x86_64, CPython 3.13, glibc >= 2.41 (tested runner may differ but wheels are manylinux-compatible)'
            echo 'Target analysis ISA: AArch64 / ARM64 ELF'
            echo
            cat requirements-top.txt
          } > MANIFEST.txt

      - name: Upload complete wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: reverse-py313-linux-x86_64-wheelhouse
          path: |
            wheelhouse/
            requirements-top.txt
            install-offline.sh
            MANIFEST.txt
            VERIFY.txt
            SHA256SUMS.txt
            SHA256SUMS.pip-hash.txt
          compression-level: 0
          retention-days: 7

      - name: Publish run id marker
        if: always()
        run: |
          set -euxo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .reverse-python313-run-id
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .reverse-python313-run-id
          if ! git diff --cached --quiet; then
            git commit -m 'ci: publish reverse wheelhouse run id'
            git push
          fi
