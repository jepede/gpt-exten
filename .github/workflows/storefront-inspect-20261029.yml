name: Inspect public storefront assets
on:
  push:
    paths:
      - .github/workflows/storefront-inspect-20261029.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch public page and scripts
        shell: bash
        run: |
          mkdir -p out
          python3 - <<'PY'
          import requests,re,html
          from urllib.parse import urljoin
          sess=requests.Session()
          sess.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36'})
          url='https://ds.xiaoman.top/liebiao/5F3D441DDE1C816D'
          try:
              r=sess.get(url,timeout=24)
              print('MAIN',r.status_code,'URL',r.url,'TYPE',r.headers.get('Content-Type'),'SIZE',len(r.content))
              open('out/page.html','w').write(r.text)
              print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',r.text,re.S|re.I)[:2])
              print('BODY_START',re.sub('<[^>]+>',' ',r.text[:4000])[:1500])
          except Exception as e:
              print('MAIN_ERROR',repr(e));raise SystemExit(0)
          srcs=re.findall('<script[^>]+src="([^"]+)"',r.text,re.I)
          print('JS_SCRIPTS',srcs[:40])
          pats=['网盘','下载','购卡','提取码','/index/','/api/','goodid','selectcateid','order','pay','pan.baidu.com','pan.quark.cn','123pan','aliyundrive','alipan']
          for i,src in enumerate(srcs[:24]):
              target=urljoin(r.url,html.unescape(src))
              try:
                  x=sess.get(target,timeout=18)
                  print('SCRIPT',i,x.status_code,x.url,'SIZE',len(x.content))
                  if x.ok and len(x.content)<3000000:
                      open(f'out/script{i:02d}.js','w').write(x.text)
                      for p in pats:
                          matches=list(re.finditer(p,x.text,re.I))
                          if matches:
                              print('SCRIPT_MATCH',i,p,'COUNT',len(matches))
                              for m in matches[:6]:
                                  print(' ',repr(x.text[max(0,m.start()-80):m.end()+170])[:280])
              except Exception as e: print('SCRIPT_ERROR',i,repr(e))
          for p in pats:
              matches=list(re.finditer(p,r.text,re.I))
              if matches:
                  print('PAGE_MATCH',p,'COUNT',len(matches))
                  for m in matches[:12]: print(' ',repr(r.text[max(0,m.start()-90):m.end()+150])[:290])
          PY
      - name: Render public page in Chrome
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          echo "CHROME=$CHROME"
          if [ -n "$CHROME" ]; then
            timeout 55 "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --disable-extensions --virtual-time-budget=7000 --dump-dom 'https://ds.xiaoman.top/liebiao/5F3D441DDE1C816D' > out/rendered.html 2>out/chrome-error.log || true
            python3 - <<'PY'
          import re
          s=open('out/rendered.html',errors='replace').read()
          print('RENDERED_SIZE',len(s))
          t=re.sub(r'<script\\b[^>]*>.*?</script>|<style\\b[^>]*>.*?</style>',' ',s,flags=re.S|re.I)
          print('RENDERED_TEXT',re.sub(r'\\s+',' ',re.sub('<[^>]+>',' ',t))[:7000])
          for p in [r'网盘',r'下载',r'购卡',r'https?://(?:pan|www\\.123|alipan|www\\.aliyun)[^\\s"\\x27<>]+']:
              matches=list(re.finditer(p,s,re.I))
              print('RENDERED_MATCH',p,len(matches))
              for m in matches[:10]: print(' ',repr(s[max(0,m.start()-180):m.end()+200])[:420])
          PY
          fi
      - name: Examine public product descriptions and anonymous order-query page
        shell: bash
        run: |
          python3 - <<'PY'
          import requests, re
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://ds.xiaoman.top/liebiao/5F3D441DDE1C816D'})
          for goodid in (114465,114466):
              try:
                  r=s.post('https://ds.xiaoman.top/ajax/getgoodinfo',data={'goodid':goodid},timeout=20)
                  print('PUBLIC_GOODINFO',goodid,'HTTP',r.status_code,'LEN',len(r.content))
                  data=r.json()
                  print('GOODINFO_KEYS',goodid,list(data.keys()) if isinstance(data,dict) else type(data).__name__)
                  if isinstance(data,dict):
                      print('GOODINFO_NAME',goodid,data.get('name'))
                      print('GOODINFO_REMARK',goodid,str(data.get('remark',''))[:650])
                      print('GOODINFO_HAS_CLOUD_LINK',goodid,bool(re.search(r'(?:pan[.]baidu[.]com|pan[.]quark[.]cn|123pan|alipan|aliyundrive)',str(data),re.I)))
              except Exception as e:print('PUBLIC_GOODINFO_ERROR',goodid,repr(e))
          try:
              r=s.get('https://ds.xiaoman.top/orderquery',timeout=20)
              html=r.text
              print('ORDERQUERY_PAGE',r.status_code,'LEN',len(html))
              t=re.sub(r'<[^>]+>',' ',re.sub(r'<script.*?</script>',' ',html,flags=re.S|re.I))
              print('ORDERQUERY_TEXT',re.sub(r'\\s+',' ',t)[:850])
          except Exception as e:print('ORDERQUERY_ERROR',repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: site-public-20261029
          path: out/
          retention-days: 1
