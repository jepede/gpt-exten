name: Sync nlohmann json cache entry
on:
  push:
    paths:
      - '.github/workflows/sync-nlohmann-json-cache-entry.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert verified artifact record and commit
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '| nlohmann/json single header | 3.12.0 |' ARTIFACT_CACHE.md; then
            echo 'Cache entry already present'
            exit 0
          fi
          anchor='| QEMU user-static | 1:7.2+dfsg-7+deb12u18+b3 | Debian 12 / Linux | x86_64 | `32748029497` | SINGLE | `2026-11-22T15:57:40Z` |'
          row='| nlohmann/json single header | 3.12.0 | Any | Any | `32814216489` | SINGLE | `2026-11-23T05:47:17Z` |'
          grep -Fq "$anchor" ARTIFACT_CACHE.md
          python3 -c 'from pathlib import Path; p=Path("ARTIFACT_CACHE.md"); s=p.read_text(); a="| QEMU user-static | 1:7.2+dfsg-7+deb12u18+b3 | Debian 12 / Linux | x86_64 | `32748029497` | SINGLE | `2026-11-22T15:57:40Z` |\n"; r="| nlohmann/json single header | 3.12.0 | Any | Any | `32814216489` | SINGLE | `2026-11-23T05:47:17Z` |\n"; p.write_text(s.replace(a,a+r,1))'
          echo '' | base64 -d >> ARTIFACT_CACHE.md
          grep -Fq '| nlohmann/json single header | 3.12.0 | Any | Any | `json.hpp` | `aaf127c04cb31c406e5b04a63f1ae89369fccde6d8fa7cdda1ed4f32dfc5de63` |' ARTIFACT_CACHE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARTIFACT_CACHE.md
          git commit -m 'Cache nlohmann json 3.12.0 artifact'
          git push
