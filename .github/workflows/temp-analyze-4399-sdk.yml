name: temp-analyze-4399-sdk

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-analyze-4399-sdk.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached APK parts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/parts/00 work/parts/01 work/parts/02 out
          gh run download 36448082222 -R jepede/gpt-exten -n tpbsn-4399-latest-apk-part-00 -D work/parts/00
          gh run download 36448082222 -R jepede/gpt-exten -n tpbsn-4399-latest-apk-part-01 -D work/parts/01
          gh run download 36448082222 -R jepede/gpt-exten -n tpbsn-4399-latest-apk-part-02 -D work/parts/02
          cat work/parts/00/tpbsn-4399-latest.apk.part.00 \
              work/parts/01/tpbsn-4399-latest.apk.part.01 \
              work/parts/02/tpbsn-4399-latest.apk.part.02 \
              > work/tpbsn-4399-8.41.0.apk
          echo '258ac3675fc71fbc0b90d0d59d93658d844610e46964017a97dbfae3ec16a1a6  work/tpbsn-4399-8.41.0.apk' | sha256sum -c -
          echo 'ff7d47d04ab5a95351fc433b19752447  work/tpbsn-4399-8.41.0.apk' | md5sum -c -
          ls -lh work/tpbsn-4399-8.41.0.apk

      - name: Install lightweight analyzers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip >/dev/null
          python3 -m pip install androguard==4.1.3 >/dev/null

      - name: Analyze 4399 SDK evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > work/analyze_4399_sdk.py <<'PY'
          import csv, hashlib, json, os, re, sys, zipfile
          from pathlib import Path
          from collections import Counter, defaultdict

          APK = Path('work/tpbsn-4399-8.41.0.apk')
          OUT = Path('out')
          OUT.mkdir(exist_ok=True)

          KEYWORDS = [
              '4399','m4399','yxhapi','yxhimg','4399api','udb','openID','openId','openid',
              'openKey','openkey','loginKey','loginkey','pfID','pfId','UnitySendMessage',
              'GameCenter','gamecenter','GameBox','4399GameCenter','sdk_version','oauth',
              'token','session','Account','Login','login','pay','anti','realname','verify'
          ]
          KW_RE = re.compile('|'.join(re.escape(k) for k in KEYWORDS), re.I)
          PRINTABLE_RE = re.compile(rb'[\x09\x0a\x0d\x20-\x7e]{4,}')
          CLASS_RE = re.compile(r'^(L)?([A-Za-z0-9_$]+/)+[A-Za-z0-9_$]+;?$')

          def sha256_file(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024), b''):
                      h.update(b)
              return h.hexdigest()

          zf = zipfile.ZipFile(APK)
          infos = zf.infolist()
          apk_entries = [{'name':i.filename,'size':i.file_size,'compress_size':i.compress_size} for i in infos]
          Path(OUT/'apk_entries.json').write_text(json.dumps(apk_entries, ensure_ascii=False, indent=2))
          with open(OUT/'apk_entries.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f, fieldnames=['name','size','compress_size'])
              w.writeheader(); w.writerows(apk_entries)

          interesting_entries=[]
          for i in infos:
              n=i.filename
              if KW_RE.search(n) or n.endswith('.dex') or n in ('AndroidManifest.xml','resources.arsc') or n.startswith('lib/'):
                  interesting_entries.append({'name':n,'size':i.file_size,'compress_size':i.compress_size})
          with open(OUT/'interesting_entries.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f, fieldnames=['name','size','compress_size'])
              w.writeheader(); w.writerows(interesting_entries)

          # Decode manifest with androguard when available.
          manifest_summary={}
          manifest_errors=[]
          try:
              from androguard.core.apk import APK as AndroAPK
              a=AndroAPK(str(APK))
              manifest_summary['package']=a.get_package()
              manifest_summary['version_code']=a.get_androidversion_code()
              manifest_summary['version_name']=a.get_androidversion_name()
              manifest_summary['min_sdk']=a.get_min_sdk_version()
              manifest_summary['target_sdk']=a.get_target_sdk_version()
              manifest_summary['permissions']=sorted(a.get_permissions() or [])
              manifest_summary['activities']=sorted(a.get_activities() or [])
              manifest_summary['services']=sorted(a.get_services() or [])
              manifest_summary['receivers']=sorted(a.get_receivers() or [])
              manifest_summary['providers']=sorted(a.get_providers() or [])
              # raw manifest XML text
              xml=a.get_android_manifest_xml()
              if xml is not None:
                  txt=xml.toprettyxml()
                  Path(OUT/'AndroidManifest_decoded.xml').write_text(txt, encoding='utf-8')
                  manifest_summary['metadata_hits']=[line.strip() for line in txt.splitlines() if KW_RE.search(line)]
          except Exception as e:
              manifest_errors.append(repr(e))
          Path(OUT/'manifest_summary.json').write_text(json.dumps(manifest_summary, ensure_ascii=False, indent=2))
          if manifest_errors:
              Path(OUT/'manifest_errors.txt').write_text('\n'.join(manifest_errors))

          # Scan DEX strings and selected binary strings.
          dex_files=[i for i in infos if re.match(r'classes(\d*)\.dex$', i.filename)]
          dex_summary=[]
          all_hits=[]
          class_hits=set()
          url_hits=set()
          sdk_pkg_hits=Counter()
          string_hits_by_kw=Counter()

          url_re = re.compile(r'https?://[^\s"\'<>\\]+|[a-z0-9._-]+\.(?:com|cn|net|org)(?:/[A-Za-z0-9._~:/?#\[\]@!$&()*+,;=%-]*)?', re.I)
          for info in dex_files:
              data=zf.read(info.filename)
              strings=[]
              for m in PRINTABLE_RE.finditer(data):
                  try:
                      s=m.group(0).decode('utf-8','ignore')
                  except Exception:
                      continue
                  if not s:
                      continue
                  if KW_RE.search(s):
                      strings.append(s)
                      all_hits.append({'file':info.filename,'string':s[:1000]})
                      for kw in KEYWORDS:
                          if re.search(re.escape(kw), s, re.I):
                              string_hits_by_kw[kw]+=1
                      if CLASS_RE.match(s) or '/' in s:
                          if '4399' in s.lower() or 'yxh' in s.lower() or 'udb' in s.lower() or 'gamecenter' in s.lower():
                              class_hits.add(s)
                      for u in url_re.findall(s):
                          if KW_RE.search(u):
                              url_hits.add(u)
                  # package counter from class-like strings
                  if s.startswith('L') and '/' in s and s.endswith(';'):
                      pkg=s[1:-1].replace('/','.')
                      low=pkg.lower()
                      if any(x in low for x in ['4399','yxh','udb','gamecenter','m4399']):
                          prefix='.'.join(pkg.split('.')[:4])
                          sdk_pkg_hits[prefix]+=1
              dex_summary.append({'name':info.filename,'size':info.file_size,'keyword_hit_count':len(strings)})

          with open(OUT/'dex_keyword_hits.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f, fieldnames=['file','string'])
              w.writeheader(); w.writerows(all_hits[:50000])
          Path(OUT/'dex_class_hits.txt').write_text('\n'.join(sorted(class_hits)), encoding='utf-8')
          Path(OUT/'dex_url_hits.txt').write_text('\n'.join(sorted(url_hits)), encoding='utf-8')
          Path(OUT/'dex_summary.json').write_text(json.dumps(dex_summary, ensure_ascii=False, indent=2))
          Path(OUT/'keyword_counter.json').write_text(json.dumps(dict(string_hits_by_kw), ensure_ascii=False, indent=2))
          Path(OUT/'sdk_package_counter.json').write_text(json.dumps(dict(sdk_pkg_hits.most_common()), ensure_ascii=False, indent=2))

          # Scan assets/libs/file names and non-dex strings in small files.
          file_name_hits=[e for e in apk_entries if KW_RE.search(e['name'])]
          Path(OUT/'filename_keyword_hits.json').write_text(json.dumps(file_name_hits, ensure_ascii=False, indent=2))

          # selected small XML/properties/json assets strings
          small_asset_hits=[]
          for info in infos:
              n=info.filename
              if info.file_size > 4*1024*1024:
                  continue
              if n.endswith(('.xml','.json','.properties','.txt','.cfg','.ini','.dat','.bytes','.meta')) or KW_RE.search(n):
                  try:
                      data=zf.read(n)
                  except Exception:
                      continue
                  if KW_RE.search(data.decode('utf-8','ignore')):
                      text=data.decode('utf-8','ignore')
                      lines=[ln for ln in text.splitlines() if KW_RE.search(ln)]
                      small_asset_hits.append({'name':n,'lines':lines[:100]})
          Path(OUT/'small_asset_keyword_hits.json').write_text(json.dumps(small_asset_hits, ensure_ascii=False, indent=2))

          # Try identify lib names and ABIs
          libs=[e for e in apk_entries if e['name'].startswith('lib/')]
          with open(OUT/'native_libs.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f, fieldnames=['name','size','compress_size'])
              w.writeheader(); w.writerows(libs)

          # Raw SDK interpretation report
          report=[]
          report.append('# 4399 SDK APK Static Evidence Report')
          report.append('')
          report.append(f'- APK: `{APK.name}`')
          report.append(f'- SHA256: `{sha256_file(APK)}`')
          report.append(f'- Package: `{manifest_summary.get("package")}`')
          report.append(f'- Version: `{manifest_summary.get("version_name")}` / `{manifest_summary.get("version_code")}`')
          report.append('')
          report.append('## Manifest 4399/YXH/SDK related lines')
          for line in manifest_summary.get('metadata_hits', [])[:300]:
              report.append(f'- `{line}`')
          report.append('')
          report.append('## DEX files')
          for d in dex_summary:
              report.append(f'- `{d["name"]}` size={d["size"]} keyword_hits={d["keyword_hit_count"]}')
          report.append('')
          report.append('## Top SDK package prefixes')
          for k,v in sdk_pkg_hits.most_common(100):
              report.append(f'- `{k}`: {v}')
          report.append('')
          report.append('## URL/domain hits')
          for u in sorted(url_hits)[:500]:
              report.append(f'- `{u}`')
          report.append('')
          report.append('## Class/string hits containing 4399/yxh/udb/gamecenter')
          for c in sorted(class_hits)[:1000]:
              report.append(f'- `{c}`')
          report.append('')
          report.append('## Keyword counts')
          for k,v in string_hits_by_kw.most_common():
              report.append(f'- `{k}`: {v}')
          Path(OUT/'4399_sdk_static_evidence.md').write_text('\n'.join(report), encoding='utf-8')

          # compact summary for chat
          compact={
              'apk_sha256': sha256_file(APK),
              'manifest': {k:manifest_summary.get(k) for k in ['package','version_code','version_name','min_sdk','target_sdk']},
              'permissions_count': len(manifest_summary.get('permissions') or []),
              'activities_count': len(manifest_summary.get('activities') or []),
              'services_count': len(manifest_summary.get('services') or []),
              'receivers_count': len(manifest_summary.get('receivers') or []),
              'providers_count': len(manifest_summary.get('providers') or []),
              'dex_count': len(dex_files),
              'dex_summary': dex_summary,
              'top_sdk_packages': sdk_pkg_hits.most_common(50),
              'url_hits': sorted(url_hits)[:200],
              'class_hit_count': len(class_hits),
              'keyword_counts': dict(string_hits_by_kw),
              'file_name_hits_count': len(file_name_hits),
          }
          Path(OUT/'4399_sdk_static_summary.json').write_text(json.dumps(compact, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python3 work/analyze_4399_sdk.py
          tar -czf out/4399-sdk-analysis-results.tar.gz -C out .
          ls -lh out

      - name: Upload 4399 SDK analysis results
        uses: actions/upload-artifact@v4
        with:
          name: tpbsn-4399-sdk-analysis-results
          path: out/4399-sdk-analysis-results.tar.gz
          compression-level: 0
          retention-days: 90
