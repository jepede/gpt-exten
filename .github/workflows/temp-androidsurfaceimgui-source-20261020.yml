name: Temporary AndroidSurfaceImgui Source Retrieval
on:
  push:
    paths:
      - '.github/workflows/temp-androidsurfaceimgui-source-20261020.yml'
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone pinned upstream and its submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Bzi-Han/AndroidSurfaceImgui.git AndroidSurfaceImgui
          cd AndroidSurfaceImgui
          git checkout --detach 26de5d1e4eb1408b040c7b98b574757eda4784d7
          git submodule update --init --recursive
          git rev-parse HEAD > ../SOURCE_COMMIT.txt
          git submodule status --recursive > ../SUBMODULE_COMMITS.txt
          cd ..
          tar -czf AndroidSurfaceImgui-26de5d1e-source.tar.gz --exclude-vcs AndroidSurfaceImgui
          sha256sum AndroidSurfaceImgui-26de5d1e-source.tar.gz > SHA256SUMS.txt
          du -h AndroidSurfaceImgui-26de5d1e-source.tar.gz
      - name: Upload one-day source artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidsurfaceimgui-src-26de5d1e
          path: |
            AndroidSurfaceImgui-26de5d1e-source.tar.gz
            SHA256SUMS.txt
            SOURCE_COMMIT.txt
            SUBMODULE_COMMITS.txt
          retention-days: 1
          if-no-files-found: error
