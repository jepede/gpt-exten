name: Temporary Android 16 ARM64 runtime for local CTF validation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/temp-ctf-android16-runtime.yml
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Pull Android ARM64 OCI filesystem
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs unzip zstd > /dev/null
          docker pull --platform linux/arm64 redroid/redroid:16.0.0_64only-latest
          cid=$(docker create --platform linux/arm64 redroid/redroid:16.0.0_64only-latest)
          mkdir -p runtime/system runtime/vendor runtime/apex
          docker cp "$cid:/system/lib64" runtime/system/lib64 || true
          mkdir -p runtime/system/bin
          docker cp "$cid:/system/bin/linker64" runtime/system/bin/linker64 || true
          docker cp "$cid:/system/bin/linker" runtime/system/bin/linker || true
          docker cp "$cid:/vendor/lib64" runtime/vendor/lib64 || true
          mkdir -p work_apex
          for apk in com.android.runtime com.android.art com.android.conscrypt com.android.i18n com.android.media com.android.resolv; do
            for suffix in apex capex; do
              docker cp "$cid:/system/apex/$apk.$suffix" "work_apex/$apk.$suffix" 2>/dev/null || true
            done
          done
          docker rm "$cid"
          for f in work_apex/*.apex work_apex/*.capex; do
            test -f "$f" || continue
            name=$(basename "$f" | sed -e 's/\.apex$//' -e 's/\.capex$//')
            mkdir -p "runtime/apex/$name"
            unzip -p "$f" apex_payload.img > /tmp/apex_payload.img || true
            if [[ -s /tmp/apex_payload.img ]]; then
              debugfs -R "rdump / runtime/apex/$name" /tmp/apex_payload.img 2>&1 | tail -n 10 || true
            fi
            rm -f /tmp/apex_payload.img
          done
          echo "runtime tree:"
          du -sh runtime/* runtime/apex/* 2>/dev/null || true
          find runtime -name linker64 -o -name libc.so -o -name libandroid.so -o -name libGLESv3.so | head -40
          tar -I "zstd -2 -T0" -cf android16-arm64-runtime.tar.zst runtime
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android16-arm64-runtime.tar.zst')
          print('size:',p.stat().st_size)
          assert p.stat().st_size < 450_000_000, "Too large for <=512MB artifact limit"
          PY
          sha256sum android16-arm64-runtime.tar.zst > SHA256SUMS.txt
      - name: Upload small temporary runtime
        uses: actions/upload-artifact@v4
        with:
          name: temp-ctf-android16-arm64-runtime
          path: |
            android16-arm64-runtime.tar.zst
            SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
