name: Temporary GeekFlashTool OPPO K10 PGJM10 resources
on:
  push:
    paths:
      - '.github/workflows/temp-fetch-geekflash-pgjm10-20261114.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Download K10 DA1 DA2 Preloader and Config from Gitee
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/DA/OPLUS out/PreLoader/OPLUS
          files=(
            'DA/OPLUS/MT6895_DA1.bin'
            'DA/OPLUS/MT6895_DA2.bin'
            'PreLoader/OPLUS/OPPOK10_preloader_k6895v1_64.bin'
            'Config.xml'
          )
          for f in "${files[@]}"; do
            echo "::group::Fetch $f"
            ok=0
            for url in "https://gitee.com/geekflashtool/package_mtk_edl/raw/master/$f" "https://gitee.com/api/v5/repos/geekflashtool/package_mtk_edl/raw/$f?ref=master"; do
              if curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 12 --max-time 75 --silent --show-error -A 'Mozilla/5.0' -o "out/$f" "$url"; then
                size="$(stat -c %s "out/$f")"
                printf "Source %s size %s\n" "$url" "$size" | tee -a out/sources.txt
                if [ "$size" -gt 150 ] && ! head -c 100 "out/$f" | grep -Eaiq '<!doctype|<html|AccessDenied|Not Found|rate limit|security verification'; then
                  ok=1
                  break
                fi
                echo "Invalid response: $size bytes"
              fi
            done
            if [ "$ok" != 1 ]; then
              echo "$f" | tee -a out/missing.txt
              rm -f "out/$f"
            fi
            echo "::endgroup::"
          done
          (cd out && find . -type f -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          (cd out && find . -type f -printf '%p %s bytes\n')
          if test -f out/Config.xml; then grep -n 'PGJM10' out/Config.xml || true; fi
          test -s out/DA/OPLUS/MT6895_DA1.bin
          test -s out/DA/OPLUS/MT6895_DA2.bin

      - name: Upload temporary K10 bundle
        uses: actions/upload-artifact@v4
        with:
          name: temp-geekflash-pgjm10-20261114
          path: out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
