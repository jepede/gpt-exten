name: temp-fetch-libue4-bg45

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-fetch-libue4-bg45.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify BG 4.5
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/jepede/gpt-exten/releases/download/v1.0.1/libUE4-BG-4.5.so'
          curl --fail --location --retry 5 --retry-all-errors --output libUE4-BG-4.5.so "$url"
          echo '04d811ab3417296e3ec89adf2f22a432883463c0745fe5cb8d4931f6d6f415a6  libUE4-BG-4.5.so' | sha256sum -c -
          file libUE4-BG-4.5.so
          ls -lh libUE4-BG-4.5.so
      - name: Upload BG 4.5
        uses: actions/upload-artifact@v4
        with:
          name: libUE4-BG-4.5
          path: libUE4-BG-4.5.so
          compression-level: 0
          retention-days: 1
