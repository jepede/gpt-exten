name: Temporary Lua 5.3.6 Fetch

on:
  push:
    paths:
      - '.github/workflows/temp-fetch-lua53.yml'
  pull_request:
    paths:
      - '.github/lua-fetch-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Lua 5.3.6 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 5 --retry-delay 2 \
            https://www.lua.org/ftp/lua-5.3.6.tar.gz \
            -o out/lua-5.3.6.tar.gz
          (cd out && sha256sum lua-5.3.6.tar.gz | tee SHA256SUMS.txt)
          stat -c '%n %s bytes' out/lua-5.3.6.tar.gz

      - name: Upload Lua source artifact
        uses: actions/upload-artifact@v4
        with:
          name: temp-lua-5.3.6-source
          path: out/
          retention-days: 1
          if-no-files-found: error
