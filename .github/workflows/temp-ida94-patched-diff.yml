name: Temporary IDA 9.4 Linux x64 patched/original diff

on:
  push:
    paths:
      - '.github/workflows/temp-ida94-patched-diff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download patched libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patched" "$RUNNER_TEMP/original" "$RUNNER_TEMP/out"
          curl -fL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/Yigods/ida94_b1/main/kg_patch/x64linux/libida.so' \
            -o "$RUNNER_TEMP/patched/libida.so"
          curl -fL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/Yigods/ida94_b1/main/kg_patch/x64linux/libida32.so' \
            -o "$RUNNER_TEMP/patched/libida32.so"
          echo 'd22b54b01d51822387d4f75bb2e057fe2222ed7cdde66649f7c5e50e2132fd0a  '$RUNNER_TEMP'/patched/libida.so' | sha256sum -c -
          echo 'b16d74a217d9b6546adb0548cf948e7f39310874e72ca5e3180ac9ac22f46355  '$RUNNER_TEMP'/patched/libida32.so' | sha256sum -c -

      - name: Download and install original release
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/Yigods/ida94_b1/releases/download/v9.4-installers/ida-pro_94_x64linux.run'
          curl -fL --retry 4 --retry-delay 3 "$URL" -o "$RUNNER_TEMP/ida-pro_94_x64linux.run"
          echo 'ec59282dba8e72eca2a750b5514f3d6722022d8b29bfc0cebd29a6403d2db19a  '$RUNNER_TEMP'/ida-pro_94_x64linux.run' | sha256sum -c -
          chmod +x "$RUNNER_TEMP/ida-pro_94_x64linux.run"
          "$RUNNER_TEMP/ida-pro_94_x64linux.run" --mode unattended --prefix "$RUNNER_TEMP/ida94" >/dev/null 2>&1
          cp "$RUNNER_TEMP/ida94/libida.so" "$RUNNER_TEMP/original/libida.so"
          cp "$RUNNER_TEMP/ida94/libida32.so" "$RUNNER_TEMP/original/libida32.so"

      - name: Hash and compare
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/original"
          P="$RUNNER_TEMP/patched"
          OUT="$RUNNER_TEMP/out"
          {
            echo '== SHA256 =='
            sha256sum "$O/libida.so" "$P/libida.so" "$O/libida32.so" "$P/libida32.so"
            echo
            echo '== FILE =='
            file "$O/libida.so" "$P/libida.so" "$O/libida32.so" "$P/libida32.so"
            echo
            echo '== SIZE =='
            stat -c '%n %s' "$O/libida.so" "$P/libida.so" "$O/libida32.so" "$P/libida32.so"
          } | tee "$OUT/summary.txt"

          python3 - <<'PY' | tee "$OUT/diff_regions.txt"
          from pathlib import Path
          import os
          root = Path(os.environ['RUNNER_TEMP'])
          for name in ('libida.so','libida32.so'):
              a=(root/'original'/name).read_bytes(); b=(root/'patched'/name).read_bytes()
              n=min(len(a),len(b))
              diffs=[i for i in range(n) if a[i]!=b[i]]
              if len(a)!=len(b): diffs.extend(range(n,max(len(a),len(b))))
              print(f'[{name}]')
              print('original_size=',len(a),'patched_size=',len(b),'diff_bytes=',len(diffs))
              regions=[]
              if diffs:
                  s=p=diffs[0]
                  for x in diffs[1:]:
                      if x==p+1: p=x
                      else: regions.append((s,p)); s=p=x
                  regions.append((s,p))
              print('regions=',len(regions))
              for s,e in regions:
                  print(f'0x{s:x}-0x{e:x} len={e-s+1}')
              print()
          PY

          # Full xxd/hexdump diff is generated for verification, but not needed to upload as a reusable patch recipe.
          for name in libida.so libida32.so; do
            xxd -g1 "$O/$name" > "$RUNNER_TEMP/${name}.orig.hex"
            xxd -g1 "$P/$name" > "$RUNNER_TEMP/${name}.patched.hex"
            diff -u "$RUNNER_TEMP/${name}.orig.hex" "$RUNNER_TEMP/${name}.patched.hex" > "$OUT/${name}.full-hexdump.diff" || true
          done

          cp "$P/libida.so" "$OUT/libida_patched.so"
          cp "$P/libida32.so" "$OUT/libida32_patched.so"

      - name: Upload patched libraries and comparison metadata
        uses: actions/upload-artifact@v4
        with:
          name: ida94-linux-x64-patched-compare
          path: |
            ${{ runner.temp }}/out/libida_patched.so
            ${{ runner.temp }}/out/libida32_patched.so
            ${{ runner.temp }}/out/summary.txt
            ${{ runner.temp }}/out/diff_regions.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
