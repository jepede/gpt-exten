name: temp-lobby-secret-replay

on:
  workflow_dispatch:
    inputs:
      host:
        description: Lobby TCP host
        required: false
        default: 82.156.181.229
      port:
        description: Lobby TCP port
        required: false
        default: "9005"
      seqs:
        description: Comma-separated seq list to replay
        required: false
        default: "1,3,4,5,8,10"
      save_full:
        description: Save full server responses into artifact. Use false unless needed.
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
  push:
    paths:
      - tools/lobby_secret_replay_runner.py
      - .github/workflows/temp-lobby-secret-replay.yml

permissions:
  contents: read

env:
  LOBBY_HOST: ${{ github.event.inputs.host || '82.156.181.229' }}
  LOBBY_PORT: ${{ github.event.inputs.port || '9005' }}
  LOBBY_SEQS: ${{ github.event.inputs.seqs || '1,3,4,5,8,10' }}
  LOBBY_SAVE_FULL: ${{ github.event.inputs.save_full || 'false' }}
  LOBBY_REPLAY_TEMPLATES_B64: ${{ secrets.LOBBY_REPLAY_TEMPLATES_B64 }}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run lobby secret replay
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/lobby_secret_replay_runner.py \
            --host "$LOBBY_HOST" \
            --port "$LOBBY_PORT" \
            --seqs "$LOBBY_SEQS" \
            --out lobby_secret_replay_results

      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lobby-secret-replay-results
          path: lobby_secret_replay_results/
          if-no-files-found: warn
          retention-days: 1
