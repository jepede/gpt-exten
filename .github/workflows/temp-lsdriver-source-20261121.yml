name: Temp lsdriver source audit snapshot 20261121
on:
  push:
    paths:
      - .github/workflows/temp-lsdriver-source-20261121.yml
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Fetch exact public source snapshot without large binaries
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/lsnbm/Linux-android-arm64.git src
          cd src
          git sparse-checkout set lsdriver
          test "$(git rev-parse HEAD)" = "37fc9b7bc5f5095aa57cef1c31b0bcc3648e68cf"
          rm -rf lsdriver/byte_stream
          printf "Repository: lsnbm/Linux-android-arm64\nCommit: %s\nFetch date (UTC): %s\nIncluded: lsdriver source tree, README, build scripts, license, format config\nExcluded: precompiled kernel .ko files and unrelated large binaries\n" "$(git rev-parse HEAD)" "$(date -u +%FT%TZ)" > ../source_info.txt
          tar -czf ../lsdriver-source.tar.gz --exclude='*.ko' lsdriver README.md build_all.sh ddk_build_all.sh .clang-format LICENSE
          cd ..
          sha256sum lsdriver-source.tar.gz > lsdriver-source.tar.gz.sha256
          ls -lh lsdriver-source.tar.gz
      - name: Upload one-day source audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsdriver-source-audit-20261121
          path: |
            lsdriver-source.tar.gz
            lsdriver-source.tar.gz.sha256
            source_info.txt
          retention-days: 1
          if-no-files-found: error
