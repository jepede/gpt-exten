name: Temporary PHP HTTP Fingerprint (No Exploit)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-php-fingerprint-20261022.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check DNS and safe HTTP metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, socket, ssl, time, urllib.request, urllib.error
          from pathlib import Path
          
          HOST = "www.oenb66.top"
          PATH = "/AppEn.php"
          SAFE_HEADERS = {"server","x-powered-by","content-type","content-length","via","x-cache","strict-transport-security","x-frame-options","x-content-type-options","allow","cf-ray"}
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          opener = urllib.request.build_opener(
              urllib.request.HTTPHandler(),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              NoRedirect(),
          )
          addresses = []
          try:
              addresses = sorted(set(p[4][0] for p in socket.getaddrinfo(HOST, None, proto=socket.IPPROTO_TCP)))[:8]
          except Exception as e:
              dns_error = f"{type(e).__name__}: {str(e)[:180]}"
          else:
              dns_error = None
          results = []
          for scheme in ("https", "http"):
              for method in ("HEAD", "GET"):
                  url = f"{scheme}://{HOST}{PATH}"
                  record = {"url":url, "method":method, "http_status":None, "headers":{}, "has_set_cookie":False, "has_location":False, "elapsed_ms":None, "error":None}
                  start = time.monotonic()
                  try:
                      req=urllib.request.Request(url, method=method, headers={"User-Agent":"gpt-exten-minimal-http-fingerprint/1.0", "Accept":"*/*"})
                      try:
                          resp=opener.open(req, timeout=9)
                      except urllib.error.HTTPError as e:
                          resp=e
                      with resp:
                          record["http_status"]=resp.code
                          record["headers"]={k:v[:180] for k,v in resp.headers.items() if k.lower() in SAFE_HEADERS}
                          record["has_set_cookie"]=bool(resp.headers.get("Set-Cookie"))
                          record["has_location"]=bool(resp.headers.get("Location"))
                          # Do not read, log, or store the response body.
                  except Exception as e:
                      record["error"]=f"{type(e).__name__}: {str(e)[:180]}"
                  record["elapsed_ms"]=round((time.monotonic()-start)*1000)
                  results.append(record)
          report={"scope":"Non-invasive HTTP version/header availability checks only; no payload, login, attack, or exploit", "host":HOST, "dns_addresses":addresses, "dns_error":dns_error, "requests":results}
          Path("php_fingerprint.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Diagnose HTTPS certificate and public headers without secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, socket, ssl, subprocess, time, urllib.request, urllib.error
          from pathlib import Path
          
          HOST="www.oenb66.top"
          SAFE={"server","x-powered-by","content-type","content-length","via","x-cache","strict-transport-security","x-frame-options","allow"}
          result={"note":"TLS verification bypassed ONLY to diagnose public response headers; no authentication, tokens, or response body","certificate":{}, "https_requests":[]}
          try:
              context=ssl._create_unverified_context()
              with socket.create_connection((HOST,443),timeout=7) as raw:
                  with context.wrap_socket(raw,server_hostname=HOST) as conn:
                      cert=conn.getpeercert(binary_form=True)
                      result["certificate"]["protocol"]=conn.version()
                      result["certificate"]["cipher"]=conn.cipher()[0]
              proc=subprocess.run(["openssl","x509","-inform","DER","-noout","-subject","-issuer","-dates","-ext","subjectAltName"],input=cert,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=7)
              result["certificate"]["details"]=proc.stdout.decode("utf-8","replace")[:4000]
          except Exception as e:
              result["certificate"]["error"]=f"{type(e).__name__}: {str(e)[:200]}"
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  return None
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ssl._create_unverified_context()), NoRedirect())
          for path in ("/AppEn.php","/"):
              url=f"https://{HOST}{path}"
              item={"url":url,"method":"HEAD","status":None,"headers":{},"error":None}
              try:
                  req=urllib.request.Request(url,method="HEAD",headers={"User-Agent":"gpt-exten-tls-metadata-check/1.0"})
                  try:
                      resp=opener.open(req,timeout=9)
                  except urllib.error.HTTPError as e:
                      resp=e
                  with resp:
                      item["status"]=resp.code
                      item["headers"]={k:v[:180] for k,v in resp.headers.items() if k.lower() in SAFE}
                      item["redirect_header_present"]=bool(resp.headers.get("Location"))
              except Exception as e:
                  item["error"]=f"{type(e).__name__}: {str(e)[:200]}"
              result["https_requests"].append(item)
          Path("php_tls_diagnostic.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Upload small probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-fingerprint-20261022
          path: |
            php_fingerprint.json
            php_tls_diagnostic.json
          if-no-files-found: warn
          retention-days: 1
