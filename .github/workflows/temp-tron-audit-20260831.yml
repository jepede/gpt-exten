name: Temporary TRON Transaction Audit
on:
  push:
    branches: [temp-tron-audit-20260831]
    paths: [.github/workflows/temp-tron-audit-20260831.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Query TronGrid and TRONSCAN
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tron_audit
          ADDR='TQGTsbqawRHhv35UMxjHo14mieUGWXyQzk'
          USDT='TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t'
          TXID='7a4b0e62a8a9edefa8bd26fc11dbfbca88f394916d70b35bb38e5abeb64664e9'
          MIN='1768176000000'; MAX='1768435200000'
          curl -fsS --retry 3 --get "https://api.trongrid.io/v1/accounts/$ADDR/transactions/trc20" \
            --data-urlencode 'limit=200' --data-urlencode 'only_confirmed=true' --data-urlencode 'only_to=true' \
            --data-urlencode 'order_by=block_timestamp,asc' --data-urlencode "min_timestamp=$MIN" \
            --data-urlencode "max_timestamp=$MAX" --data-urlencode "contract_address=$USDT" > tron_audit/trongrid.json
          curl -fsS --retry 3 --get 'https://apilist.tronscanapi.com/api/token_trc20/transfers' \
            --data-urlencode 'limit=200' --data-urlencode 'start=0' --data-urlencode 'sort=-timestamp' --data-urlencode 'count=true' \
            --data-urlencode "relatedAddress=$ADDR" --data-urlencode "start_timestamp=$MIN" --data-urlencode "end_timestamp=$MAX" > tron_audit/tronscan.json
          curl -fsS --retry 3 -H 'Content-Type: application/json' -d "{\"value\":\"$TXID\"}" \
            'https://api.trongrid.io/wallet/gettransactioninfobyid' > tron_audit/trongrid_txinfo.json
          curl -fsS --retry 3 --get 'https://apilist.tronscanapi.com/api/transaction-info' \
            --data-urlencode "hash=$TXID" > tron_audit/tronscan_txinfo.json
          echo '=== MATCH FROM TRONGRID ==='
          jq -c --arg t "$TXID" '.data[]? | select(.transaction_id==$t) | {transaction_id,block_timestamp,from,to,value,token_info}' tron_audit/trongrid.json
          echo '=== MATCH FROM TRONSCAN ==='
          jq -c --arg t "$TXID" '.token_transfers[]? | select(.transaction_id==$t) | {transaction_id,block_ts,from_address,to_address,quant,tokenInfo}' tron_audit/tronscan.json
          echo '=== TRONGRID DIRECT TX INFO ==='
          jq '{id,fee,blockNumber,blockTimeStamp,result,receipt,resMessage}' tron_audit/trongrid_txinfo.json
          echo '=== TRONSCAN DIRECT TX INFO ==='
          jq '{hash,confirmed,contractRet,block,block_ts,cost,tokenTransferInfo}' tron_audit/tronscan_txinfo.json
          echo '=== OTHER EXACT 10000 USDT MOVEMENTS IN WINDOW ==='
          jq -c '.token_transfers[]? | select((.quant|tostring)=="10000000000") | {transaction_id,block_ts,from_address,to_address,quant}' tron_audit/tronscan.json
          sha256sum tron_audit/*.json | tee tron_audit/SHA256SUMS.txt
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: tron-10000-usdt-audit-20260113
          path: tron_audit/
          retention-days: 30
