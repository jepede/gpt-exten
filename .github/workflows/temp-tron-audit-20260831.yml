name: Temporary TRON Transaction Audit
on:
  push:
    branches: [temp-tron-audit-20260831]
    paths: [.github/workflows/temp-tron-audit-20260831.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Query current balance
        shell: bash
        run: |
          set -euo pipefail
          ADDR='TQGTsbqawRHhv35UMxjHo14mieUGWXyQzk'
          echo "queried_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS --retry 3 --get 'https://apilist.tronscanapi.com/api/account' --data-urlencode "address=$ADDR" > account.json
          curl -fsS --retry 3 --get 'https://apilist.tronscanapi.com/api/account/tokens' --data-urlencode "address=$ADDR" --data-urlencode 'start=0' --data-urlencode 'limit=200' --data-urlencode 'hidden=0' --data-urlencode 'show=0' > tokens.json || true
          curl -fsS --retry 3 "https://api.trongrid.io/v1/accounts/$ADDR" > trongrid.json
          echo '=== ACCOUNT KEYS ==='
          jq -r 'keys[]' account.json | sort
          echo '=== ACCOUNT SELECT ==='
          jq '{address,balance,totalAssetInTrx,totalAssetInUsd,withPriceTokens,tokenBalances,tokens,trc20token_balances,assetV2}' account.json
          echo '=== TOKENS ==='
          jq '.' tokens.json || true
          echo '=== TRONGRID ==='
          jq '{success,data:(.data|map({address,balance,assetV2,trc20}))}' trongrid.json
