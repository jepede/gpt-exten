name: Temporary TRON Transaction Audit
on:
  push:
    branches: [temp-tron-audit-20260831]
    paths: [.github/workflows/temp-tron-audit-20260831.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Query full current balance
        shell: bash
        run: |
          set -euo pipefail
          ADDR='TQGTsbqawRHhv35UMxjHo14mieUGWXyQzk'
          echo "queried_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS --retry 3 --get 'https://apilist.tronscanapi.com/api/account' --data-urlencode "address=$ADDR" > account.json
          curl -fsS --retry 3 "https://api.trongrid.io/v1/accounts/$ADDR" > trongrid.json
          echo '=== FULL VALUE FIELDS ==='
          jq '{address,balance,totalFrozen,frozen,frozenForBandWidth,frozenForEnergy,delegateFrozenForBandWidth,delegateFrozenForEnergy,acquiredDelegateFrozenForBandWidth,acquiredDelegateFrozenForEnergy,delegated,reward,rewardNum,voteTotal,accountResource,tokenBalances,trc20token_balances}' account.json
          echo '=== TRONGRID STAKE/RESOURCE FIELDS ==='
          jq '{success,data:(.data|map({address,balance,frozen,frozenV2,delegated_frozenV2_balance_for_bandwidth,acquired_delegated_frozenV2_balance_for_bandwidth,delegated_frozenV2_balance_for_energy,acquired_delegated_frozenV2_balance_for_energy,account_resource,trc20}))}' trongrid.json
