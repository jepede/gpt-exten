name: Temporary analyze PUBG 4.6 dynamic PAK keys

on:
  push:
    branches:
      - tmp/analyze-pubg46-dynkeys-20261011
    paths:
      - .github/workflows/tmp-analyze-pubg46-dynkeys.yml

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified libUE4
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o libUE4-GL-4.6.so \
            https://github.com/jepede/gpt-exten/releases/download/v1.0.1/libUE4-GL-4.6.so
          echo "abb9343f69735378b6aea4db97a66e9789664075b0196b1b99378514052454ce  libUE4-GL-4.6.so" | sha256sum -c -
      - name: Probe XOR 0x71 overlay
        run: |
          python3 - <<'PY'
          import json, hashlib
          d=open('libUE4-GL-4.6.so','rb').read()
          pats={
            'dyn37':b'46e490567d02cdb312b3',
            'dyn38':b'f838b560ec26d4ba67fd',
            'dyn42':b'56eed0401753d9e5ee86',
            'static50':b'wD2rP3lP9xF4mE1eC5jS',
            'global17':b'48ea7d82db9995f2',
            'sm4_sbox_32':bytes([0x34,0x66,0x25,0x74,0x89,0x78,0xE4,0xA9,0x5A,0x41,0xBC,0x7A,0xD6,0x16,0x21,0x23,0x4D,0x61,0xDA,0x94,0x9B,0xDF,0x13,0x3C,0x69,0x3A,0x31,0x0A,0x5F,0xD7,0x99,0x95]),
            'sm4_ck_16':bytes.fromhex('2bb90e0083e70a3a675c3b9ebfdadbad')
          }
          out={}
          for name,p in pats.items():
              enc=bytes(x^0x71 for x in p)
              hits=[]; pos=0
              while True:
                  q=d.find(enc,pos)
                  if q<0: break
                  hits.append({'off':q,'page':q&~0xfff})
                  pos=q+1
              out[name]=hits
          print(json.dumps(out,indent=2))
          open('probe71.json','w').write(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pubg46-xor71-probe
          path: probe71.json
          retention-days: 1
