name: Temp Build Magicmida RS

on:
  push:
    paths:
      - '.github/workflows/tmp-build-magicmida-rs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Clone Magicmida RS
        shell: pwsh
        run: git clone --depth 1 https://github.com/guoxing2024/magicmida-rs.git magicmida-rs

      - name: Build release
        shell: pwsh
        run: |
          cd magicmida-rs
          cargo build --release -p mida-cli
          Get-FileHash target/release/mida-cli.exe -Algorithm SHA256 | Format-List

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item magicmida-rs/target/release/mida-cli.exe artifact/mida-cli.exe
          (Get-FileHash artifact/mida-cli.exe -Algorithm SHA256).Hash.ToLower() | Set-Content artifact/SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicmida-rs-windows-x64-temp
          path: artifact/
          retention-days: 1
          if-no-files-found: error
