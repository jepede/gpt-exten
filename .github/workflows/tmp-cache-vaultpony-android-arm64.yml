name: Temporary Cache VaultPony Android ARM64

on:
  push:
    paths:
      - '.github/workflows/tmp-cache-vaultpony-android-arm64.yml'

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update ARTIFACT_CACHE.md
        shell: bash
        env:
          SECTION_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          p = Path('ARTIFACT_CACHE.md')
          text = p.read_text(encoding='utf-8')
          row = '| VaultPony VeraCrypt-compatible CLI | 0.1.0+fb4c460 | Android (API 24+) | AArch64 | `33089426736` | SINGLE | `2026-11-25T15:43:58Z` |'
          heading = '## VaultPony VeraCrypt-compatible CLI 0.1.0+fb4c460'
          if row not in text:
              lines = text.splitlines()
              start = lines.index('## Index')
              end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith('## '))
              table_rows = [i for i in range(start + 1, end) if lines[i].startswith('|')]
              lines.insert(max(table_rows) + 1, row)
              text = '\n'.join(lines).rstrip() + '\n'
          if heading not in text:
              section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
              text = text.rstrip() + '\n\n' + section
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARTIFACT_CACHE.md
          git diff --cached --check
          git commit -m 'cache: record VaultPony Android arm64 CLI artifact'
          git push origin HEAD:main
