name: Temporary fetch Chinese Gaokao benchmark

on:
  push:
    branches:
      - tmp/fetch-chinese-gaokao-benchmark-20261006

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned source repository
        shell: bash
        run: |
          set -euo pipefail
          SRC_COMMIT=9f4d2fa299ac889d20bb93e095901bef41f193ea
          git clone https://github.com/yangziteng/chinese-gaokao-benchmark.git chinese-gaokao-benchmark
          git -C chinese-gaokao-benchmark checkout "$SRC_COMMIT"
          test "$(git -C chinese-gaokao-benchmark rev-parse HEAD)" = "$SRC_COMMIT"
          printf '%s\n' "$SRC_COMMIT" > SOURCE_COMMIT.txt
          find chinese-gaokao-benchmark -type f ! -path 'chinese-gaokao-benchmark/.git/*' -print0 | sort -z | xargs -0 sha256sum > SOURCE_FILES.sha256
          rm -rf chinese-gaokao-benchmark/.git
          tar -czf chinese-gaokao-benchmark-9f4d2fa2.tar.gz chinese-gaokao-benchmark SOURCE_COMMIT.txt SOURCE_FILES.sha256
          sha256sum chinese-gaokao-benchmark-9f4d2fa2.tar.gz > ARCHIVE.sha256

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: chinese-gaokao-benchmark-9f4d2fa2
          path: |
            chinese-gaokao-benchmark-9f4d2fa2.tar.gz
            SOURCE_COMMIT.txt
            SOURCE_FILES.sha256
            ARCHIVE.sha256
          retention-days: 1
          compression-level: 0
