name: Temporary fetch Gaokao 3500 vocabulary

on:
  push:
    branches:
      - tmp/fetch-gaokao-3500-vocab-20261007

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source vocabulary file
        shell: bash
        run: |
          set -euo pipefail
          REPO=https://github.com/lailai0916/lailai0916.github.io.git
          git clone --depth=1 "$REPO" src
          cp "src/docs/note/english/vocabulary/gaokao.mdx" gaokao.mdx
          sha256sum gaokao.mdx > SHA256SUMS.txt
          wc -l gaokao.mdx
          du -h gaokao.mdx

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-3500-vocab-source
          path: |
            gaokao.mdx
            SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
