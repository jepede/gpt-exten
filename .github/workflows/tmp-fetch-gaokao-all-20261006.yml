name: Temporary fetch all Gaokao datasets

on:
  push:
    branches:
      - tmp/fetch-gaokao-all-20261006

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned source repository
        shell: bash
        run: |
          set -euo pipefail
          SRC_COMMIT=1743a5520c12076c9345b14c60a9969ece045f92
          git clone https://github.com/rainewhk/gaokao.git gaokao
          git -C gaokao checkout "$SRC_COMMIT"
          test "$(git -C gaokao rev-parse HEAD)" = "$SRC_COMMIT"
          printf '%s\n' "$SRC_COMMIT" > SOURCE_COMMIT.txt
          find gaokao -type f ! -path 'gaokao/.git/*' -print0 | sort -z | xargs -0 sha256sum > SOURCE_FILES.sha256
          rm -rf gaokao/.git
          tar -czf gaokao-all-1743a552.tar.gz gaokao SOURCE_COMMIT.txt SOURCE_FILES.sha256
          sha256sum gaokao-all-1743a552.tar.gz > ARCHIVE.sha256
          du -h gaokao-all-1743a552.tar.gz
          wc -l SOURCE_FILES.sha256

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-all-1743a552
          path: |
            gaokao-all-1743a552.tar.gz
            SOURCE_COMMIT.txt
            SOURCE_FILES.sha256
            ARCHIVE.sha256
          retention-days: 1
          compression-level: 0
