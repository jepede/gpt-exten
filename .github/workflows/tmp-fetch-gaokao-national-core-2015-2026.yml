name: Temporary fetch Gaokao national core 2015-2026
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch national Chinese English core
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests beautifulsoup4
          cat >/tmp/fetch_core.py <<'PY'
          import requests,re,json,time,hashlib
          from bs4 import BeautifulSoup
          from pathlib import Path
          from urllib.parse import urljoin,unquote
          ROOT='https://www.ksft.cn'; OUT=Path('out'); OUT.mkdir()
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/140'})
          EX=['模拟','联考','月考','期中','期末','一模','二模','三模','适应性','预测','专题','练习','评析','汇总','分类']
          subjects={'yuwen':'语文','yingyu':'英语'}
          rows=[]
          def g(url,timeout=20,**kw):
            for i in range(3):
              try:
                r=S.get(url,timeout=timeout,**kw)
                if r.status_code<500:return r
              except Exception: pass
              time.sleep(1+i)
            return None
          def national(title):
            return any(k in title for k in ['全国','新课标','新高考']) and not any(k in title for k in EX)
          def safe(s):
            return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+',' ',s)).strip()[:150]
          for y in range(2015,2027):
            for code,sub in subjects.items():
              found={}
              for page in range(1,6):
                u=f'{ROOT}/{y}?year={y}&subject={code}&sort=asc' if page==1 else f'{ROOT}/{y}/{page}?year={y}&subject={code}&sort=asc'
                r=g(u)
                if not r: continue
                soup=BeautifulSoup(r.text,'html.parser')
                hits=0
                for a in soup.find_all('a',href=True):
                  t=' '.join(a.get_text(' ',strip=True).split()); h=urljoin(ROOT,a['href'])
                  if '/article/' not in h or str(y) not in t or sub not in t or not national(t): continue
                  if not any(k in t for k in ['高考','普通高等学校招生全国统一考试','真题','试卷','试题']): continue
                  found[h]=t; hits+=1
                # actual national papers are usually early in year/subject listing; stop after first empty page after hits found
                if found and hits==0: break
              print('FOUND',y,sub,len(found),list(found.values()),flush=True)
              for url,title in found.items():
                ar=g(url)
                rec={'year':y,'subject':sub,'title':title,'article':url}
                if not ar:
                  rec['status']='article_fail'; rows.append(rec); continue
                soup=BeautifulSoup(ar.text,'html.parser')
                dl=[]
                for tr in soup.find_all('tr'):
                  txt=' '.join(tr.get_text(' ',strip=True).split()); a=tr.find('a',href=True)
                  if a and '/download/' in a['href']: dl.append((txt,urljoin(ROOT,a['href'])))
                choice=next(((t,h) for t,h in dl if any(k in t for k in ['试卷','试题','原卷']) and not t.startswith(('答案','解析'))),dl[0] if dl else None)
                if not choice:
                  rec['status']='no_download'; rows.append(rec); continue
                rr=g(choice[1],timeout=30,headers={'Referer':url},allow_redirects=True)
                if not rr:
                  rec['status']='download_fail'; rows.append(rec); continue
                ct=rr.headers.get('content-type','').lower()
                rec.update({'download':choice[1],'http':rr.status_code,'ctype':ct,'size':len(rr.content),'final':rr.url})
                if rr.status_code!=200 or 'text/html' in ct or rr.content[:16].lstrip().lower().startswith((b'<html',b'<!doctype')):
                  rec['status']='html_redirect'; rows.append(rec); print('BAD',rec,flush=True); continue
                cd=rr.headers.get('content-disposition','')
                m=re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^;"\']+)',cd,re.I)
                ext=''
                if m: ext=Path(unquote(m.group(1))).suffix.lower()
                if not ext:
                  ext='.pdf' if 'pdf' in ct else '.docx' if 'wordprocessingml' in ct else '.doc' if 'msword' in ct else Path(rr.url.split('?')[0]).suffix.lower()
                if ext not in ['.pdf','.docx','.doc']: ext='.bin'
                d=OUT/str(y)/sub; d.mkdir(parents=True,exist_ok=True)
                p=d/(safe(title)+ext); p.write_bytes(rr.content)
                rec.update({'status':'ok','file':str(p),'sha256':hashlib.sha256(rr.content).hexdigest()})
                rows.append(rec); print('OK',y,sub,title,len(rr.content),flush=True)
          (OUT/'MANIFEST.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          with (OUT/'MANIFEST.tsv').open('w',encoding='utf-8') as f:
            f.write('year\tsubject\tstatus\tsize\ttitle\tfile\tarticle\tdownload\tsha256\n')
            for r in rows:
              f.write('\t'.join(str(r.get(k,'')).replace('\t',' ') for k in ['year','subject','status','size','title','file','article','download','sha256'])+'\n')
          print('SUMMARY',len(rows),sum(r.get('status')=='ok' for r in rows),sum(r.get('size',0) for r in rows if r.get('status')=='ok'),flush=True)
          PY
          python3 /tmp/fetch_core.py
          du -sh out
          cat out/MANIFEST.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: gaokao-national-core-2015-2026
          path: out
          retention-days: 1
          compression-level: 0
