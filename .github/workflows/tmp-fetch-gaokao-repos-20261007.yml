name: Temporary fetch Gaokao repositories 20261007

on:
  push:
    paths:
      - '.github/workflows/tmp-fetch-gaokao-repos-20261007.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          mkdir -p src out
          git lfs install --skip-repo || true

      - name: Clone repositories
        shell: bash
        run: |
          set -euo pipefail
          clone_repo() {
            name="$1"; url="$2"
            echo "::group::clone $name"
            git clone --depth 1 "$url" "src/$name"
            if command -v git-lfs >/dev/null 2>&1; then
              (cd "src/$name" && git lfs pull) || true
            fi
            (cd "src/$name" && git rev-parse HEAD) > "out/$name.commit"
            du -sb "src/$name" | awk '{print $1}' > "out/$name.bytes"
            rm -rf "src/$name/.git"
            echo "::endgroup::"
          }
          clone_repo rainewhk-gaokao https://github.com/rainewhk/gaokao.git
          clone_repo GAOKAO-Bench https://github.com/OpenLMLab/GAOKAO-Bench.git
          clone_repo gaokaomath https://github.com/deekur/gaokaomath.git
          clone_repo gaokao_math_corpus https://github.com/TsubameHata/gaokao_math_corpus.git
          clone_repo China-Gaokao-Papers-Collection https://github.com/qingshuo/China-Gaokao-Papers-Collection.git

      - name: Pack and split
        shell: bash
        run: |
          set -euo pipefail
          for d in rainewhk-gaokao GAOKAO-Bench gaokaomath gaokao_math_corpus China-Gaokao-Papers-Collection; do
            tar --zstd -cf "out/$d.tar.zst" -C src "$d"
            sha256sum "out/$d.tar.zst" > "out/$d.tar.zst.sha256"
            split -b 250M -d -a 2 "out/$d.tar.zst" "out/$d.part."
            sha256sum out/$d.part.* > "out/$d.parts.sha256"
            rm "out/$d.tar.zst"
          done
          {
            echo "Generated: $(date -u +%FT%TZ)"
            for d in rainewhk-gaokao GAOKAO-Bench gaokaomath gaokao_math_corpus China-Gaokao-Papers-Collection; do
              printf '%s\tcommit=' "$d"; cat "out/$d.commit"
              printf '%s\tbytes=' "$d"; cat "out/$d.bytes"
              cat "out/$d.tar.zst.sha256"
              cat "out/$d.parts.sha256"
            done
          } > out/MANIFEST.txt
          cat out/MANIFEST.txt

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-repos-metadata
          path: |
            out/MANIFEST.txt
            out/*.commit
            out/*.bytes
            out/*.sha256
          retention-days: 1
          compression-level: 0

      - name: Upload rainewhk-gaokao 00
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-src-rainewhk-00
          path: out/rainewhk-gaokao.part.00
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload GAOKAO-Bench 00
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-src-bench-00
          path: out/GAOKAO-Bench.part.00
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload gaokao_math_corpus 00
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-src-corpus-00
          path: out/gaokao_math_corpus.part.00
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload gaokaomath parts
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-src-gaokaomath
          path: out/gaokaomath.part.*
          retention-days: 1
          compression-level: 0

      - name: Upload China collection part 00
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-src-china-00
          path: out/China-Gaokao-Papers-Collection.part.00
          retention-days: 1
          compression-level: 0
      - name: Upload China collection part 01
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-src-china-01
          path: out/China-Gaokao-Papers-Collection.part.01
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload China collection part 02
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-src-china-02
          path: out/China-Gaokao-Papers-Collection.part.02
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload China collection part 03
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-src-china-03
          path: out/China-Gaokao-Papers-Collection.part.03
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload China collection part 04
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-src-china-04
          path: out/China-Gaokao-Papers-Collection.part.04
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload China collection part 05
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-src-china-05
          path: out/China-Gaokao-Papers-Collection.part.05
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
