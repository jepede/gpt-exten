name: Temporary libUE4 GL 4.5 Fetch

on:
  push:
    branches:
      - tmp-fetch-libue4-gl45-20260827
    paths:
      - .github/workflows/tmp-fetch-libue4-gl45-20260827.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download release asset
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/jepede/gpt-exten/releases/download/v1.0.1/libUE4-GL-4.5.so'
          curl -fL --retry 5 --retry-delay 2 --output libUE4-GL-4.5.so "$URL"
          test "$(stat -c '%s' libUE4-GL-4.5.so)" = '247976280'
          echo 'b5e68be0e06e52a81713c4241169ec493772bdcbca9b54b0845e89d08d2f8fdc  libUE4-GL-4.5.so' | sha256sum -c -
          sha256sum libUE4-GL-4.5.so > SHA256SUMS.txt
          file libUE4-GL-4.5.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libue4-gl-4.5-v1.0.1
          path: |
            libUE4-GL-4.5.so
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
