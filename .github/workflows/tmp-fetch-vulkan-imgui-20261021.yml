name: Temporary Vulkan ImGui ARM64 Source Fetch
on:
  push:
    paths:
      - '.github/workflows/tmp-fetch-vulkan-imgui-20261021.yml'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone exact upstream commit, archive and hash
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/wanmian0323/Android_imgui_Vulkan.git Android_imgui_Vulkan
          cd Android_imgui_Vulkan
          git checkout --detach ab6aa630b3244ac8fba12c544f48f9b62fab581e
          test "$(git rev-parse HEAD)" = "ab6aa630b3244ac8fba12c544f48f9b62fab581e"
          git submodule update --init --recursive
          cd ..
          tar -czf Android_imgui_Vulkan-ab6aa630-source.tar.gz --exclude-vcs Android_imgui_Vulkan
          sha256sum Android_imgui_Vulkan-ab6aa630-source.tar.gz > SHA256SUMS.txt
          echo ab6aa630b3244ac8fba12c544f48f9b62fab581e > COMMIT.txt
          ls -lh Android_imgui_Vulkan-ab6aa630-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: android-imgui-vulkan-pinned-source
          path: |
            Android_imgui_Vulkan-ab6aa630-source.tar.gz
            SHA256SUMS.txt
            COMMIT.txt
          retention-days: 1
          if-no-files-found: error
