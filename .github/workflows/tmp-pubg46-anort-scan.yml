name: Temporary PUBG 4.6 Anort Scan

on:
  push:
    branches:
      - tmp/pubg46-anort-20261011
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached 4.6 verification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jepede/gpt-exten/actions/artifacts/11309845408/zip" -o cache.zip
          echo "816ab7a7b41a2ae5c45a4d4c0373fde6eab42e561bd5c01eced4f8bd05a065ab  cache.zip" | sha256sum -c -
          unzip -q cache.zip -d cache
          find cache -maxdepth 3 -type f -printf '%p %s\n' | sort

      - name: Inspect APK native libraries
        run: |
          set -euo pipefail
          APK="$(find cache -type f -name '*.apk' -print -quit)"
          echo "APK=$APK"
          if [ -z "$APK" ]; then
            echo "No APK in verification artifact"
            exit 0
          fi
          echo "===== MATCHING LIBS ====="
          unzip -l "$APK" | grep -Ei 'lib/(arm64-v8a|armeabi-v7a)/.*(anort|unpacker|tersafe|tprt|UE4|anogs|ano|tss).*\.so' | head -300 || true
          mkdir -p out
          python3 - "$APK" <<'PY'
          import sys,zipfile,os,hashlib
          apk=sys.argv[1]
          z=zipfile.ZipFile(apk)
          names=[n for n in z.namelist() if n.startswith('lib/arm64-v8a/') and n.endswith('.so')]
          for n in names:
              base=os.path.basename(n).lower()
              if any(k in base for k in ('anort','unpacker','tersafe','tprt','ano','tss')):
                  d=z.read(n)
                  p='out/'+os.path.basename(n)
                  open(p,'wb').write(d)
                  print(n,len(d),hashlib.sha256(d).hexdigest(),p)
          PY
          echo "===== FILES ====="
          file out/* 2>/dev/null || true
          echo "===== SYMBOL/STRING FOCUS ====="
          for f in out/*.so; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            readelf -Ws "$f" 2>/dev/null | grep -Ei 'g_acf_array|g_aco_array|decrypt_elf|stub_|recvfrom|sendto|mprotect|mmap|munmap' | head -300 || true
            strings -a -t x "$f" | grep -Ei 'g_acf_array|g_aco_array|decrypt_elf|stub_|recvfrom|sendto|mprotect|mmap|munmap|F5DF260|SetDecryptionKey' | head -300 || true
          done
