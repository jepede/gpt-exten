name: Temporary PUBG 4.6 Loader Focus

on:
  push:
    branches:
      - tmp/pubg46-loader2-20261011
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached libUE4 4.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/jepede/gpt-exten/actions/artifacts/11309845408/zip" -o a.zip
          echo "816ab7a7b41a2ae5c45a4d4c0373fde6eab42e561bd5c01eced4f8bd05a065ab  a.zip" | sha256sum -c -
          unzip -q a.zip -d a
          cp "$(find a -name libUE4-GL-4.6.so -print -quit)" libUE4.so
      - name: Compact loader report
        run: |
          set -euo pipefail
          echo "===== SYMBOLS ====="
          readelf -Ws libUE4.so | grep -E 'stub_|decrypt_elf|g_acf_array|g_aco_array|ELF_HOOK|mprotect|recvfrom|sendto' | head -500 || true
          echo "===== LOADER RELOCS ====="
          readelf -rW libUE4.so | grep -E '000000000f74f7b0|000000000f74f7b8|000000000f74f7c0|000000000f74f830|mprotect|recvfrom|sendto|mmap|munmap' | head -300 || true
          echo "===== HEX AROUND LOADER TABLE ====="
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path("libUE4.so").read_bytes()
          # LOAD11 maps file offset 0xf090000 to VA 0xf74c000.
          def off(va):
              if 0xf74c000 <= va < 0xf74c000+0x3848:
                  return 0xf090000+(va-0xf74c000)
              if 0xf750000 <= va < 0xf750000+0x5688:
                  return 0xf090000+(va-0xf750000)
              if 0xf758000 <= va < 0xf758000+0x6018:
                  return 0xf094000+(va-0xf758000)
              return None
          for va in (0xf74f7b0,0xf74f7b8,0xf74f7c0,0xf74f830):
              o=off(va)
              print(hex(va), "off", hex(o) if o is not None else None, "qword", hex(struct.unpack_from("<Q",b,o)[0]) if o is not None else None)
          PY
