name: Temporary Themida Emulator Bundle

on:
  push:
    paths:
      - '.github/workflows/tmp-themida-emulator-bundle.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Build relocatable analysis bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle/site-packages
          git clone --depth 1 https://github.com/bobalkkagi/bobalkkagi.git bundle/bobalkkagi
          python -m pip install --upgrade pip
          python -m pip install --target bundle/site-packages \
            'unicorn==2.0.1.post1' \
            'lief==0.12.3' \
            'fire==0.4.0' \
            'capstone==4.0.2' \
            'pefile==2022.5.30' \
            'distorm3==3.5.2'
          PYROOT="$(python -c 'import sys; print(sys.base_prefix)')"
          cp -a "$PYROOT" bundle/python
          PYTHONPATH="$PWD/bundle/site-packages:$PWD/bundle/bobalkkagi" \
            "$PWD/bundle/python/bin/python3.10" -c 'import unicorn,lief,fire,capstone,pefile,distorm3,bobalkkagi; print("bundle import test OK")'
          tar --zstd -cf themida-emulator-linux-x86_64.tar.zst bundle
          sha256sum themida-emulator-linux-x86_64.tar.zst > SHA256SUMS.txt
          ls -lh themida-emulator-linux-x86_64.tar.zst
          cat SHA256SUMS.txt

      - name: Upload temporary bundle
        uses: actions/upload-artifact@v4
        with:
          name: themida-emulator-linux-x86_64
          path: |
            themida-emulator-linux-x86_64.tar.zst
            SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
