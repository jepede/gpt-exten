name: Temporary TinyHTTPS nghttp3 QPACK interop v1.18.0
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tmp-tinyhttps-nghttp3-qpack-v1.18.0.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch verified nghttp3 v1.18.0 commit with submodules
        shell: bash
        run: |
          set -euo pipefail
          commit=dbfc24286138cb0b6490160e7ca87fe1ce6722a0
          git clone --filter=blob:none --recurse-submodules --branch v1.18.0 --depth 1 \
            https://github.com/ngtcp2/nghttp3.git src
          test "$(git -C src rev-parse HEAD)" = "${commit}"
          git -C src submodule status --recursive | tee SUBMODULES.txt
          printf 'nghttp3 v1.18.0\ncommit=%s\ntag_object=868e81b343d1350597b47f78a5958d60c3695aa4\n' "${commit}" > SOURCE.txt
      - name: Build qpack reference tool
        shell: bash
        run: |
          set -euo pipefail
          cmake -S src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED_LIB=OFF \
            -DENABLE_STATIC_LIB=ON \
            -DBUILD_TESTING=OFF
          cmake --build build --target qpack -j2
          mkdir -p out
          cp build/examples/qpack out/nghttp3-qpack
          cp SOURCE.txt SUBMODULES.txt out/
          strip out/nghttp3-qpack || true
          out/nghttp3-qpack --help > out/help.txt 2>&1 || true
          (cd out && sha256sum nghttp3-qpack > SHA256SUMS.txt)
          stat -c '%n %s' out/nghttp3-qpack > out/SIZES.txt
          test "$(stat -c %s out/nghttp3-qpack)" -lt 503316480
      - uses: actions/upload-artifact@v4
        with:
          name: tinyhttps-nghttp3-qpack-1.18.0
          path: out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
