name: Temporary validate metaphysics upstreams 2026-09-18
on:
  push:
    paths:
      - ".github/workflows/tmp-validate-metaphysics-20260918.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned upstreams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          clone_pin() {
            repo="$1"; sha="$2"; name="$3"
            git clone --quiet --filter=blob:none "https://github.com/$repo.git" "work/$name"
            git -C "work/$name" checkout --quiet "$sha"
          }
          clone_pin "TheCrazyAnt/bazi-ziwei" "955ca0b028381212495b666284d2fd0ecb39a922" crazyant
          clone_pin "mingze21/bazi-ziwei-skill" "8fd7dfa45f50f21b8e5a5047bfe48cdeda16ab66" mingze
          clone_pin "minutes1125-star/ZIWEIDOUSHU" "3ce39cf965a6533f7a5928a34b4bb837e3d2307c" ziwei-minutes
          clone_pin "arc119226/qimen_dunjia" "7d941031d685d818d9fd234edf891dba5bd6a323" qimen-arc

      - name: Validate Python BaZi + ZiWei
        shell: bash
        run: |
          set -euo pipefail
          cd work/crazyant
          python3 -m unittest discover -s tests -v 2>&1 | tee ../../out/crazyant-tests.log
          python3 scripts/chart.py --datetime "2000-01-01 12:00" --gender M --year 2026 --json > ../../out/crazyant-sample.json

      - name: Validate TypeScript BaZi + ZiWei
        shell: bash
        run: |
          set -euo pipefail
          cd work/mingze/calculator
          npm ci --ignore-scripts
          npm run build 2>&1 | tee ../../../out/mingze-build.log
          node dist/run-chart.js --year=2000 --month=1 --day=1 --hour=12 --minute=0 --gender=male > ../../../out/mingze-sample.json

      - name: Validate ZiWei independent engine
        shell: bash
        run: |
          set -euo pipefail
          cd work/ziwei-minutes
          npm ci --ignore-scripts
          npm test 2>&1 | tee ../../out/ziwei-minutes-tests.log
          npm run audit 2>&1 | tee ../../out/ziwei-minutes-audit.log

      - name: Validate Qimen v3.1
        shell: bash
        run: |
          set -euo pipefail
          cd work/qimen-arc
          npm ci --ignore-scripts
          npm test 2>&1 | tee ../../out/qimen-arc-tests.log
          node --input-type=module <<'NODE' > ../../out/qimen-arc-sample.json
          import { generateChartByDatetime, chartToObject } from './index.js';
          const chart = generateChartByDatetime('2026091819');
          process.stdout.write(JSON.stringify(chartToObject(chart), null, 2));
          NODE

      - name: Produce validation manifest
        shell: bash
        run: |
          set -euo pipefail
          cd out
          sha256sum * > SHA256SUMS.txt
          {
            echo "Validation run: ${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Generated: $(date -u +%FT%TZ)"
            echo
            echo "Pinned sources:"
            echo "TheCrazyAnt/bazi-ziwei 955ca0b028381212495b666284d2fd0ecb39a922"
            echo "mingze21/bazi-ziwei-skill 8fd7dfa45f50f21b8e5a5047bfe48cdeda16ab66"
            echo "minutes1125-star/ZIWEIDOUSHU 3ce39cf965a6533f7a5928a34b4bb837e3d2307c"
            echo "arc119226/qimen_dunjia 7d941031d685d818d9fd234edf891dba5bd6a323"
          } > VALIDATION_MANIFEST.txt

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: tmp-metaphysics-validation-20260918
          path: out/
          compression-level: 6
          retention-days: 1
