name: TShield 6.2 Asset Fetch

on:
  push:
    branches:
      - tshield-fetch-6-2-20260821
  pull_request:
    branches:
      - main

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch signed TShield asset
        shell: bash
        run: |
          set -uo pipefail
          echo '=== DNS ===' | tee fetch_meta.txt
          getent ahosts japi.t3yanzheng.com | tee -a fetch_meta.txt || true
          echo '=== HTTP ===' | tee -a fetch_meta.txt
          set +e
          curl -sS -v --connect-timeout 15 --max-time 60 \
            -H 'Accept: */*' \
            -H 'Accept-Language: zh-CN' \
            -H 'Connection: Keep-Alive' \
            -H 'User-Agent: SDK C++ http client' \
            -H 'X-Rt-Inst: ca2864677b17fb907b01f8ebd985e4b7' \
            -H 'X-Rt-Nonce: j0aWkOOnR6w42HMSri6q0OaO5CWyz066' \
            -H 'X-Rt-Seq: 1' \
            -H 'X-Rt-Sign: 7fd41d0a96b87b04d7f82ad9ba9c770a' \
            -H 'X-Rt-Token: mrpcs_1787188288533_RtBuSBCZepXlokKNthJVIWnQF0aL5tNw' \
            -H 'X-Rt-Ts: 1787308777' \
            -D response_headers.txt \
            -o asset.bin \
            -w 'HTTP_CODE=%{http_code}\nREMOTE_IP=%{remote_ip}\nSIZE=%{size_download}\n' \
            'http://japi.t3yanzheng.com/v1/assets/u0cbfa4m308w35kvikzynwznnlhy6rbx' | tee -a fetch_meta.txt
          rc=${PIPESTATUS[0]}
          echo "CURL_RC=$rc" | tee -a fetch_meta.txt
          set -e
          test -f response_headers.txt || : > response_headers.txt
          test -f asset.bin || : > asset.bin
          wc -c asset.bin response_headers.txt | tee -a fetch_meta.txt
          sha256sum asset.bin response_headers.txt | tee SHA256SUMS.txt
          echo '=== RESPONSE HEADERS ===' | tee -a fetch_meta.txt
          cat response_headers.txt | tee -a fetch_meta.txt
          echo '=== BODY PREFIX ===' | tee -a fetch_meta.txt
          xxd -l 1024 asset.bin | tee -a fetch_meta.txt || true
      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: tshield-6-2-asset
          path: |
            asset.bin
            response_headers.txt
            fetch_meta.txt
            SHA256SUMS.txt
          retention-days: 90
