name: TShield 6.2 Live W Bridge

on:
  pull_request:
    branches:
      - main

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Send exact raw request
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, socket, hashlib
          req = base64.b64decode('')
          print('REQ_LEN',len(req),'REQ_SHA256',hashlib.sha256(req).hexdigest())
          s=socket.create_connection(('w.t3yanzheng.com',80),15)
          s.settimeout(3)
          s.sendall(req)
          chunks=[]
          while True:
              try:
                  b=s.recv(65536)
                  if not b: break
                  chunks.append(b)
              except socket.timeout:
                  break
          raw=b''.join(chunks)
          open('response.raw','wb').write(raw)
          print('RESP_LEN',len(raw),'RESP_SHA256',hashlib.sha256(raw).hexdigest())
          print(raw[:4096])
          PY
      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: tshield-live-w-response
          path: response.raw
          retention-days: 90
