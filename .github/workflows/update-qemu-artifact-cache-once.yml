name: Update QEMU Artifact Cache Once

on:
  push:
    paths:
      - '.github/workflows/update-qemu-artifact-cache-once.yml'

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add QEMU artifact record without downloading again
        shell: python
        run: |
          from pathlib import Path
          p = Path('ARTIFACT_CACHE.md')
          text = p.read_text()
          row = '| QEMU user-static | 1:7.2+dfsg-7+deb12u18+b3 | Debian 12 / Linux | x86_64 | `32748029497` | SINGLE | `2026-11-22T15:57:40Z` |'
          if row not in text:
              marker = '| TShield 6.2 Live W response | 6.2-live-w-bridge-run11-v1 | Any | Any | `32483541702` | SINGLE | `2026-11-19T12:47:00Z` |'
              if marker in text:
                  text = text.replace(marker, marker + '\n' + row, 1)
              else:
                  raise SystemExit('Index insertion marker not found; refusing blind rewrite')
          heading = '## QEMU user-static 1:7.2+dfsg-7+deb12u18+b3'
          if heading not in text:
              text += '''\n\n## QEMU user-static 1:7.2+dfsg-7+deb12u18+b3\n\n- Workflow: `.github/workflows/fetch-qemu-user-static-bookworm.yml`\n- Run ID: `32748029497`\n- Source: `https://deb.debian.org/debian/pool/main/q/qemu/qemu-user-static_7.2+dfsg-7+deb12u18+b3_amd64.deb`\n- Repository Visibility: `Public`\n- Requested Retention: `90 days`\n- Storage Mode: `SINGLE`\n- Artifact Name: `qemu-user-static-7.2-deb12u18-amd64`\n- Artifact ID: `9527836019`\n- File: `qemu-user-static_7.2+dfsg-7+deb12u18+b3_amd64.deb`\n- Artifact Archive Size: `62604562` bytes\n- Artifact Archive SHA256 / Digest: `33fc072150ca5eb586aca5506b4a8c31226706f6b1f60cf68f94dc5ec6d89297`\n- Original Size: `62603724` bytes\n- Original SHA256: `c3e3ba2bd87f8c5b9a5da5ef21b5a3b82d7c63b89dd448d9ddaa4eabc5b6e402`\n- Part Count: `1`\n- Created At: `2026-08-24T15:57:46Z`\n- Expires At: `2026-11-22T15:57:40Z`\n\n### Contents\n\n| Name | Version | Platform | Architecture | File/Path | SHA256 |\n|---|---|---|---|---|---|\n| QEMU user-static Debian package | 1:7.2+dfsg-7+deb12u18+b3 | Debian 12 / Linux | x86_64 | `qemu-user-static_7.2+dfsg-7+deb12u18+b3_amd64.deb` | `c3e3ba2bd87f8c5b9a5da5ef21b5a3b82d7c63b89dd448d9ddaa4eabc5b6e402` |\n\nThe package contains the statically linked user-mode emulators, including `qemu-aarch64-static`, for running AArch64 Linux/Android user-space ELF binaries on an x86_64 host.\n\n### Artifact\n\n| Part | Artifact ID | Artifact Name | Original Size | Original SHA256 | Artifact Size | Artifact Digest | Created At | Expires At |\n|---:|---:|---|---:|---|---:|---|---|---|\n| 1/1 | `9527836019` | `qemu-user-static-7.2-deb12u18-amd64` | `62603724` | `c3e3ba2bd87f8c5b9a5da5ef21b5a3b82d7c63b89dd448d9ddaa4eabc5b6e402` | `62604562` | `sha256:33fc072150ca5eb586aca5506b4a8c31226706f6b1f60cf68f94dc5ec6d89297` | `2026-08-24T15:57:46Z` | `2026-11-22T15:57:40Z` |\n\n### Restore\n\nDownload Artifact `9527836019`, verify the Artifact ZIP SHA256 `33fc072150ca5eb586aca5506b4a8c31226706f6b1f60cf68f94dc5ec6d89297`, extract the Debian package, verify its SHA256 `c3e3ba2bd87f8c5b9a5da5ef21b5a3b82d7c63b89dd448d9ddaa4eabc5b6e402`, then extract it with `dpkg-deb -x`. The installed binary used for AArch64 testing is `usr/bin/qemu-aarch64-static`.\n'''
          p.write_text(text)
      - name: Commit cache update
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARTIFACT_CACHE.md
          git diff --cached --quiet && exit 0
          git commit -m 'Cache QEMU user-static Debian 12 artifact'
          git push
