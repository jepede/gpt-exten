name: yz.hdelf.com live CN screenshot 20261121

on:
  push:
    branches: ["codex/yz-hdelf-cn-relay-20261121-mwq07wls"]
    paths: [".github/workflows/yz-hdelf-cn-relay-20261121.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify CN exit and capture the live website
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import html
          import ipaddress
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import tempfile
          
          OUT = pathlib.Path("evidence")
          OUT.mkdir(exist_ok=True)
          PROXY = "http://123.121.122.125:8888"
          TARGET = "https://yz.hdelf.com/"
          summary = {
              "started_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "proxy": PROXY,
              "target": TARGET,
              "run_url": "https://github.com/{}/actions/runs/{}".format(
                  os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]
              ),
              "tls_verification": "enabled; no certificate errors ignored",
              "browser_profile": "new temporary profile; no login",
          }
          
          try:
              check = subprocess.run(
                  [
                      "curl",
                      "--silent",
                      "--show-error",
                      "--noproxy",
                      "",
                      "--proxy",
                      PROXY,
                      "--proto",
                      "=https",
                      "--connect-timeout",
                      "8",
                      "--max-time",
                      "20",
                      "--max-filesize",
                      "65536",
                      "--dump-header",
                      str(OUT / "exit.headers.txt"),
                      "--output",
                      str(OUT / "exit.body"),
                      "--write-out",
                      "%{json}",
                      "https://ipinfo.io/json",
                  ],
                  capture_output=True,
                  timeout=25,
              )
              (OUT / "exit.stderr.txt").write_bytes(check.stderr)
              metrics = json.loads(check.stdout)
              geo = json.loads((OUT / "exit.body").read_bytes())
              summary["exit_check"] = {
                  "returncode": check.returncode,
                  "metrics": metrics,
                  "reported_exit": geo,
              }
              assert (
                  check.returncode == 0
                  and metrics["http_code"] == 200
                  and geo.get("country") == "CN"
              )
              assert ipaddress.ip_address(geo["ip"]).is_global
              assert not any(
                  s in (geo.get("region", "") + " " + geo.get("city", "")).lower()
                  for s in ["hong kong", "macao", "macau", "taiwan"]
              )
              chrome = next(
                  (
                      shutil.which(x)
                      for x in [
                          "google-chrome",
                          "google-chrome-stable",
                          "chromium",
                          "chromium-browser",
                      ]
                      if shutil.which(x)
                  ),
                  None,
              )
              assert chrome, "No installed Chrome; no dependency download attempted"
              summary["browser_version"] = subprocess.check_output(
                  [chrome, "--version"], text=True
              ).strip()
              with tempfile.TemporaryDirectory(prefix="yz-screenshot-") as profile:
                  args = [
                      chrome,
                      "--headless=new",
                      "--disable-gpu",
                      "--disable-background-networking",
                      "--disable-component-update",
                      "--disable-sync",
                      "--no-first-run",
                      "--no-default-browser-check",
                      "--user-data-dir=" + profile,
                      "--proxy-server=" + PROXY,
                      "--window-size=1440,1100",
                      "--timeout=45000",
                      "--virtual-time-budget=10000",
                      "--screenshot=" + str((OUT / "yz-hdelf-desktop.png").resolve()),
                      "--dump-dom",
                      TARGET,
                  ]
                  browser = subprocess.run(args, capture_output=True, timeout=70)
              (OUT / "browser-dom.html").write_bytes(browser.stdout)
              (OUT / "browser.stderr.txt").write_bytes(browser.stderr)
              summary["browser_exit_code"] = browser.returncode
              found = re.search(
                  r"<title>(.*?)</title>", browser.stdout.decode(errors="replace"), re.S | re.I
              )
              summary["rendered_title"] = html.unescape(found.group(1)).strip() if found else None
              summary["screenshot_exists"] = (OUT / "yz-hdelf-desktop.png").is_file()
              summary["expected_title_present"] = (
                  summary["rendered_title"] == "汇安加固 - Android ELF 二进制保护平台"
              )
              assert (
                  browser.returncode == 0
                  and summary["screenshot_exists"]
                  and summary["expected_title_present"]
              )
          except Exception as error:
              summary["error"] = type(error).__name__ + ": " + str(error)
              raise
          finally:
              summary["finished_at_utc"] = datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat()
              (OUT / "screenshot-summary.json").write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2) + "\n"
              )
              (OUT / "SHA256SUMS.txt").write_text(
                  "".join(
                      hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n"
                      for p in sorted(OUT.iterdir())
                      if p.is_file() and p.name != "SHA256SUMS.txt"
                  )
              )
              print("SCREENSHOT_SUMMARY " + json.dumps(summary, ensure_ascii=False), flush=True)
          PY
      - name: Upload live screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yz-hdelf-cn-live-screenshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 1
          if-no-files-found: error
