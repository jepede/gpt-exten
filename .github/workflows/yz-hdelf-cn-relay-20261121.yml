name: yz.hdelf.com verified CN relay 20261121

on:
  push:
    branches: ["codex/yz-hdelf-cn-relay-20261121-mwq07wls"]
    paths: [".github/workflows/yz-hdelf-cn-relay-20261121.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify a CN exit and fetch the public target
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import ipaddress
          import json
          import os
          import pathlib
          import subprocess
          import time
          from urllib.parse import urljoin, urlsplit
          
          OUT = pathlib.Path("evidence")
          OUT.mkdir(exist_ok=True)
          TARGET = "https://yz.hdelf.com/"
          CANDIDATES = json.loads(r'''[{"host":"222.211.216.201","port":7890,"protocol":"http","listed_country":"CN"},{"host":"101.251.204.174","port":8080,"protocol":"http","listed_country":"CN"},{"host":"123.57.0.163","port":8888,"protocol":"http","listed_country":"CN"},{"host":"110.40.178.232","port":8080,"protocol":"http","listed_country":"CN"},{"host":"180.125.216.109","port":8118,"protocol":"http","listed_country":"CN"},{"host":"221.176.85.230","port":1080,"protocol":"socks5","listed_country":"CN"},{"host":"222.184.87.224","port":8989,"protocol":"socks5","listed_country":"CN"},{"host":"218.26.101.226","port":53813,"protocol":"socks4","listed_country":"CN"},{"host":"221.225.48.67","port":8989,"protocol":"socks5","listed_country":"CN"},{"host":"27.115.33.94","port":4153,"protocol":"socks4","listed_country":"CN"}]''')
          SUMMARY = {
              "target": TARGET,
              "started_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "run_url": "https://github.com/{}/actions/runs/{}".format(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]),
              "candidates_source": "Previously retrieved monosans/proxy-list CN records; no new list download",
              "attempts": [],
              "verified_mainland_exit": None,
              "target_requests": [],
              "website_fetched": False,
          }
          
          def save(name, value):
              (OUT / name).write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n")
          
          def fetch(label, url, proxy, seconds, limit):
              headers = OUT / (label + ".headers.txt")
              body = OUT / (label + ".body")
              args = ["curl", "--silent", "--show-error", "--noproxy", "", "--proxy", proxy,
                      "--proto", "=https", "--connect-timeout", "5", "--max-time", str(seconds),
                      "--max-filesize", str(limit), "--dump-header", str(headers),
                      "--output", str(body), "--write-out", "%{json}", url]
              started = time.monotonic()
              try:
                  p = subprocess.run(args, capture_output=True, timeout=seconds + 5)
                  code, stdout, stderr = p.returncode, p.stdout, p.stderr
              except subprocess.TimeoutExpired as error:
                  code, stdout, stderr = 124, error.stdout or b"", error.stderr or b""
              (OUT / (label + ".stderr.txt")).write_bytes(stderr)
              try:
                  metrics = json.loads(stdout)
              except (ValueError, UnicodeError):
                  metrics = {}
              result = {"url": url, "proxy": proxy, "exit_code": code, "elapsed_seconds": round(time.monotonic() - started, 3),
                        "metrics": {key: metrics[key] for key in ["http_code", "remote_ip", "time_connect", "time_appconnect", "time_total", "ssl_verify_result", "errormsg"] if key in metrics},
                        "body_file": body.name, "headers_file": headers.name}
              save(label + ".json", result)
              return result, body.read_bytes() if body.exists() else b""
          
          for index, candidate in enumerate(CANDIDATES):
              if not ipaddress.ip_address(candidate["host"]).is_global:
                  continue
              scheme = {"http": "http", "socks5": "socks5h", "socks4": "socks4a"}[candidate["protocol"]]
              proxy = "{}://{}:{}".format(scheme, candidate["host"], candidate["port"])
              result, data = fetch("proxy-{:02d}-exit".format(index), "https://ipinfo.io/json", proxy, 10, 65536)
              try:
                  geo = json.loads(data)
              except (ValueError, UnicodeError):
                  geo = {}
              result["reported_exit"] = {k: geo[k] for k in ["ip", "country", "region", "city", "org"] if k in geo}
              SUMMARY["attempts"].append(result)
              print(json.dumps(result, ensure_ascii=False), flush=True)
              if result["exit_code"] != 0 or result["metrics"].get("http_code") != 200 or geo.get("country") != "CN":
                  continue
              if any(word in (geo.get("region", "") + " " + geo.get("city", "")).lower() for word in ["hong kong", "macao", "macau", "taiwan"]):
                  continue
              try:
                  if not ipaddress.ip_address(geo.get("ip", "")).is_global:
                      continue
              except ValueError:
                  continue
              SUMMARY["verified_mainland_exit"] = {"proxy": proxy, "reported_exit": result["reported_exit"], "verification": "TLS-verified ipinfo.io response"}
              current = TARGET
              for step in range(3):
                  response, data = fetch("target-{:02d}".format(step), current, proxy, 20, 2097152)
                  SUMMARY["target_requests"].append(response)
                  status = response["metrics"].get("http_code", 0)
                  if response["exit_code"] == 0 and status == 200:
                      SUMMARY["website_fetched"] = True
                  if response["exit_code"] != 0 or status not in [301, 302, 303, 307, 308]:
                      break
                  raw_headers = (OUT / response["headers_file"]).read_text(errors="replace")
                  locations = [line.split(":", 1)[1].strip() for line in raw_headers.splitlines() if line.lower().startswith("location:")]
                  if not locations:
                      break
                  next_url = urljoin(current, locations[-1])
                  parsed = urlsplit(next_url)
                  if parsed.scheme != "https" or parsed.hostname != "yz.hdelf.com" or parsed.port not in [None, 443]:
                      break
                  current = next_url
              break
          
          SUMMARY["finished_at_utc"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          save("summary.json", SUMMARY)
          (OUT / "SHA256SUMS.txt").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n" for p in sorted(OUT.iterdir()) if p.is_file() and p.name != "SHA256SUMS.txt"))
          print("FINAL_SUMMARY " + json.dumps(SUMMARY, ensure_ascii=False), flush=True)
          
          PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yz-hdelf-cn-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 1
          if-no-files-found: error
